":5124.636,"e":5126.226,"p":false,"h":false},{"t":"악을 미워합니다.","s":5126.544,"e":5127.974,"p":false,"h":false},{"t":"하나님의 법이 선하다고 인정하고, 22절에서는 속사람으로 하나님의 법을 즐거워한다고까지 말합니다.","s":5128.632,"e":5135.604,"p":false,"h":false},{"t":"하나님의 법을 즐거워하는 사람은 복음을 모르는 사람이 아닙니다.","s":5136.192,"e":5140.362,"p":false,"h":false},{"t":"바울은 8장 7절에서 육신의 생각은 하나님과 원수가 되고 하나님의 법에 굴복하지 않는다고 말합니다.","s":5140.908,"e":5147.261,"p":false,"h":false},{"t":"하나님의 법에 굴복하지 않는 사람이 하나님의 법을 즐거워할 수는 없습니다.","s":5147.892,"e":5152.689,"p":false,"h":false},{"t":"이 사람 안에는 이미 새 마음이 있습니다.","s":5152.968,"e":5155.85,"p":true,"h":false},{"t":"둘째로 그는 자기의 죄 때문에 아파합니다.","s":5156.748,"e":5159.701,"p":false,"h":false},{"t":"죄를 지으면서 아무렇지도 않은 사람은 24절처럼 탄식하지 않습니다.","s":5160.348,"e":5165.613,"p":false,"h":false},{"t":"오호라 나는 곤고한 사람이로다.","s":5166.252,"e":5168.498,"p":false,"h":false},{"t":"이 사망의 몸에서 누가 나를 건져 내랴.","s":5169.132,"e":5171.965,"p":false,"h":false},{"t":"이 탄식은 하나님이 없는 사람의 절망이 아니라 하나님을 알기 때문에 터져 나오는 아픔입니다.","s":5172.624,"e":5178.946,"p":false,"h":false},{"t":"죄가 죄로 보이고, 그것이 슬프고, 벗어나고 싶은 마음이 있다는 것 자체가 은혜가 이미 일하고 있다는 증거입니다.","s":5179.572,"e":5187.578,"p":true,"h":false},{"t":"셋째로 6장 이후의 흐름입니다.","s":5188.464,"e":5190.811,"p":false,"h":false},{"t":"6장에서 바울은 우리가 이미 죄에 대하여 죽었고 죄가 왕 노릇 하지 못한다고 했습니다.","s":5191.452,"e":5197.269,"p":false,"h":false},{"t":"그런데 7장은 왜 이런 싸움이 일어나는가를 정직하게 보여 줍니다.","s":5197.932,"e":5202.382,"p":false,"h":false},{"t":"죄에 대하여 죽은 신분을 받았지만 옛 본성의 흔적이 아직 내 속에 남아 있기 때문입니다.","s":5203.008,"e":5208.913,"p":false,"h":false},{"t":"6장에서 말한 죄는 왕에서 쫓겨난 잔당이라는 그림 그대로입니다.","s":5209.596,"e":5214.309,"p":false,"h":false},{"t":"쫓겨난 왕의 잔당이 아직 나라 안에서 저항하고 있는 것입니다.","s":5214.924,"e":5218.909,"p":false,"h":false},{"t":"이 저항이 얼마나 끈질기고 쓰라린지를 바울은 7장에서 숨김없이 털어놓습니다.","s":5219.568,"e":5225.24,"p":true,"h":false},{"t":"이렇게 읽으면 14절의 \"죄 아래 팔렸도다\"가 6장의 \"죄가 너희를 주장하지 못하리라\"와 부딪히는 것처럼 들릴 수 있습니다.","s":5226.084,"e":5234.967,"p":false,"h":false},{"t":"그러나 이 둘은 같은 사람을 다른 각도에서 보고 있습니다.","s":5235.624,"e":5239.618,"p":false,"h":false},{"t":"6장은 그리스도 안에서의 내 신분을 말하고, 7장은 육신 속에서 내가 겪는 경험을 말합니다.","s":5240.124,"e":5246.716,"p":false,"h":false},{"t":"18절이 그 \"육신\"을 정확히 짚습니다.","s":5247.36,"e":5250.252,"p":false,"h":false},{"t":"내 속 곧 내 육신에 선한 것이 거하지 아니하는 줄을 아노니.","s":5250.888,"e":5254.664,"p":false,"h":false},{"t":"바울은 자기 육신 자체에는 선한 것이 하나도 없다고 말합니다.","s":5255.316,"e":5259.544,"p":false,"h":false},{"t":"죄가 왕은 아니지만 육신은 여전히 죄에 기울어 있습니다.","s":5260.14,"e":5263.937,"p":false,"h":false},{"t":"그래서 이 싸움은 일생을 두고 계속됩니다.","s":5264.568,"e":5267.812,"p":true,"h":false},{"t":"한 가지 조심해서 들어야 할 대목이 있습니다.","s":5268.672,"e":5271.59,"p":false,"h":false},{"t":"17절과 20절에서 바울은 이렇게 말합니다.","s":5272.164,"e":5275.517,"p":false,"h":false},{"t":"그런즉 이것을 행하는 자는 내가 아니요 내 속에 거하는 죄니라.","s":5276.124,"e":5280.137,"p":false,"h":false},{"t":"이 말이 죄를 남 탓으로 돌리는 변명처럼 들릴 수 있습니다.","s":5280.804,"e":5284.721,"p":false,"h":false},{"t":"그러나 이것은 변명이 아닙니다.","s":5285.34,"e":5287.724,"p":false,"h":false},{"t":"바울은 이 말 바로 앞뒤에서 자신이 얼마나 괴로워하는지를 쏟아 내고 있습니다.","s":5288.04,"e":5293.3,"p":false,"h":false},{"t":"새로 난 내 속사람이 원하는 것과 실제로 일어나는 일이 다르다는 말이고, 죄의 책임을 지지 않겠다는 말이 아닙니다.","s":5293.944,"e":5301.47,"p":false,"h":false},{"t":"바울은 곤고하다고 탄식하지, 나는 죄가 없다고 하지 않습니다.","s":5302.08,"e":5306.896,"p":false,"h":false},{"t":"이 말은 내 안에 원치 않는 힘이 아직 살아 있다는 것을 정직하게 고백하는 말입니다.","s":5307.552,"e":5313.166,"p":true,"h":false},{"t":"21절부터 23절은 이 싸움을 한 폭의 그림으로 보여 줍니다.","s":5314.068,"e":5318.876,"p":false,"h":false},{"t":"선을 행하기 원하는 나에게 악이 함께 있다고 합니다.","s":5319.54,"e":5322.965,"p":false,"h":false},{"t":"내 마음의 법과 내 지체 속의 다른 법이 싸운다고 합니다.","s":5323.608,"e":5327.524,"p":false,"h":false},{"t":"전쟁터는 내 안입니다.","s":5328.18,"e":5330.104,"p":false,"h":false},{"t":"이 싸움을 모르는 성도는 한 사람도 없습니다.","s":5330.736,"e":5333.876,"p":false,"h":false},{"t":"기도하려고 앉으면 딴생각이 들고, 용서하자고 결심하고도 마음이 따라 주지 않고, 다시는 하지 않겠다고 한 것을 또 하고, 그런 나를 보며 낙심합니다.","s":5334.516,"e":5345.156,"p":false,"h":false},{"t":"바울도 그랬습니다.","s":5345.748,"e":5347.276,"p":false,"h":false},{"t":"이 점이 우리에게 큰 위로가 됩니다.","s":5347.944,"e":5350.472,"p":false,"h":false},{"t":"이런 싸움이 있다는 것은 내가 신자가 아니라는 증거가 아니라, 오히려 신자라는 증거입니다.","s":5351.112,"e":5357.223,"p":false,"h":false},{"t":"죽은 사람은 싸우지 않습니다.","s":5357.88,"e":5360.06,"p":true,"h":false},{"t":"그리고 한 가지를 귀담아들어 보십시오.","s":5360.94,"e":5363.49,"p":false,"h":false},{"t":"14절부터 25절 사이에는 \"나\"라는 말이 수도 없이 반복되는데, 성령이라는 말은 한 번도 나오지 않습니다.","s":5363.964,"e":5372.007,"p":false,"h":false},{"t":"내가 원하고, 내가 행하고, 내가 미워하고, 나는 곤고합니다.","s":5372.64,"e":5378.474,"p":false,"h":false},{"t":"이 싸움을 나의 결심과 노력만으로 치르려 할 때 어떤 일이 일어나는지를 바울이 보여 주고 있습니다.","s":5379.084,"e":5385.351,"p":false,"h":false},{"t":"나는 선을 원하는데 선을 행할 힘이 내게는 없습니다.","s":5385.996,"e":5389.669,"p":false,"h":false},{"t":"원함은 내게 있으나 선을 행하는 것은 없다고 18절은 말합니다.","s":5390.28,"e":5394.467,"p":false,"h":false},{"t":"이 싸움은 결심으로 이길 수 있는 종류의 것이 아닙니다.","s":5395.104,"e":5398.886,"p":true,"h":false},{"t":"그래서 24절의 탄식이 나옵니다.","s":5399.784,"e":5402.34,"p":false,"h":false},{"t":"누가 나를 건져 내랴.","s":5402.952,"e":5404.53,"p":false,"h":false},{"t":"여기서 바울은 \"내가 어떻게 해야 하나\"라고 묻지 않고 \"누가\"라고 묻습니다.","s":5405.148,"e":5410.53,"p":false,"h":false},{"t":"자기 안에 답이 없다는 것을 이제 아는 것입니다.","s":5411.196,"e":5414.376,"p":false,"h":false},{"t":"그리고 25절 첫머리에서 대답이 터져 나옵니다.","s":5415.012,"e":5418.547,"p":false,"h":false},{"t":"감사하리로다.","s":5419.188,"e":5420.386,"p":false,"h":false},{"t":"우리 주 예수 그리스도로 말미암아.","s":5421.096,"e":5423.405,"p":false,"h":false},{"t":"건짐은 내 안에서가 아니라 밖에서, 사람이 아니라 한 분에게서 옵니다.","s":5424.084,"e":5428.956,"p":true,"h":false},{"t":"25절 끝은 다시 현실로 돌아옵니다.","s":5429.844,"e":5432.87,"p":false,"h":false},{"t":"그런즉 내 자신이 마음으로는 하나님의 법을 섬기고 육신으로는 죄의 법을 섬기노라.","s":5433.516,"e":5439.043,"p":false,"h":false},{"t":"감사가 있다고 해서 싸움이 당장 끝나는 것이 아닙니다.","s":5439.708,"e":5443.519,"p":false,"h":false},{"t":"바울은 승리의 감사와 싸움의 현실이 함께 있다는 것을 정직하게 말합니다.","s":5444.172,"e":5448.892,"p":false,"h":false},{"t":"은혜는 싸움을 없애 주는 것이 아니라 싸움 가운데서 나를 붙들어 줍니다.","s":5449.5,"e":5454.091,"p":false,"h":false},{"t":"그리고 이 감사의 근거가 무엇인지는 바로 다음 장 첫 절에서 터져 나옵니다.","s":5454.756,"e":5460.278,"p":false,"h":false},{"t":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니.","s":5460.912,"e":5465.547,"p":false,"h":false},{"t":"7장의 곤고한 사람에게 8장은 이 선언으로 시작합니다.","s":5466.168,"e":5470.111,"p":true,"h":false},{"t":"이 단락을 듣고 나서 한 가지를 마음에 담아 두면 좋겠습니다.","s":5471.028,"e":5475.121,"p":false,"h":false},{"t":"내가 같은 죄 앞에서 번번이 넘어진다고 느낄 때, 그것은 내가 하나님의 자녀가 아니라는 신호가 아니라 내가 아직 싸움터 한가운데 서 있다는 신호입니다.","s":5475.744,"e":5485.934,"p":false,"h":false},{"t":"그리고 그 싸움의 끝은 내가 이겨서가 아니라 내가 건져짐으로 끝납니다.","s":5486.58,"e":5491.521,"p":false,"h":false},{"t":"기도하는 자리에서 이렇게 말씀드려 보십시오.","s":5492.124,"e":5495.256,"p":false,"h":false},{"t":"주님, 내가 원하는 선을 행하지 못하는 연약함을 숨기지 않고 주님 앞에 내놓습니다.","s":5495.832,"e":5501.879,"p":false,"h":false},{"t":"나를 이 사망의 몸에서 건지시는 분이 주님이심을 믿습니다.","s":5502.528,"e":5506.466,"p":false,"h":false},{"t":"내가 이기려 하지 않고 주님께 맡기게 하여 주십시오.","s":5507.064,"e":5510.458,"p":true,"h":false},{"t":"그러면 이 건져 주시는 분은 구체적으로 어떻게 우리를 건지십니까.","s":5511.276,"e":5515.83,"p":false,"h":false},{"t":"정죄함이 없다는 선언이 실제 싸움 속에서 어떤 힘이 되는지, 그리고 이 싸움에서 성령이 무슨 일을 하시는지는 이어지는 이야기에서 들어 보겠습니다.","s":5516.46,"e":5526.033,"p":true,"h":false}]},{"title":"11. 정죄함이 없다는 것은 실제로 무슨 뜻인가 (로마서 8장 1절~17절)","audio":"book_2610310944_2.mp3","start":0,"end":594.324,"dur":594.3,"segs":[{"t":"11.","s":0,"e":0.694,"p":false,"h":false},{"t":"정죄함이 없다는 것은 실제로 무슨 뜻인가 (로마서 8장 1절~17절)","s":1.908,"e":7.687,"p":true,"h":false},{"t":"7장은 탄식으로 끝났습니다.","s":8.388,"e":10.618,"p":false,"h":false},{"t":"오호라 나는 곤고한 사람이로다.","s":11.268,"e":13.514,"p":false,"h":false},{"t":"누가 나를 건져 내랴.","s":14.148,"e":15.726,"p":false,"h":false},{"t":"그 탄식이 채 가라앉기도 전에 8장이 시작됩니다.","s":16.344,"e":19.887,"p":false,"h":false},{"t":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니.","s":20.484,"e":25.119,"p":true,"h":false},{"t":"이 문장에는 두 마디가 있습니다.","s":25.956,"e":28.407,"p":false,"h":false},{"t":"하나는 \"그러므로\"이고 다른 하나는 \"이제\"입니다.","s":28.98,"e":32.614,"p":false,"h":false},{"t":"그러므로는 앞의 모든 이야기를 모아서 내리는 결론이라는 뜻입니다.","s":33.264,"e":37.867,"p":false,"h":false},{"t":"3장에서 값이 치러졌고, 4장에서 받는 손을 보았고, 5장에서 대표가 바뀌었고, 6장에서 주인 .35,"p":false,"h":false},{"t":"자녀이면 또한 상속자라고 합니다.","s":517.968,"e":520.46,"p":false,"h":false},{"t":"하나님의 상속자요 그리스도와 함께한 상속자라고 합니다.","s":521.1,"e":524.879,"p":false,"h":false},{"t":"그런데 문장은 거기서 끝나지 않고 한 구절이 더 붙습니다.","s":525.456,"e":529.812,"p":false,"h":false},{"t":"우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 할 것이니라.","s":530.424,"e":534.97,"p":false,"h":false},{"t":"상속자라면 영광만 받을 줄 알았는데, 고난이 함께 따라온다고 합니다.","s":535.644,"e":540.691,"p":false,"h":false},{"t":"이 말은 8장의 나머지 부분 전체를 여는 열쇠입니다.","s":541.332,"e":545.389,"p":true,"h":false},{"t":"이 단락을 들으며 이런 물음을 마음에 두면 좋겠습니다.","s":546.264,"e":549.919,"p":false,"h":false},{"t":"나는 오늘 하나님 앞에 정죄받는 사람으로 서 있습니까, 아니면 아빠라고 부르는 자녀로 서 있습니까.","s":550.584,"e":556.931,"p":false,"h":false},{"t":"넘어졌을 때 마음속에서 들리는 목소리가 정죄의 소리입니까, 아니면 돌아오라는 아버지의 목소리입니까.","s":557.532,"e":564.518,"p":false,"h":false},{"t":"기도하는 자리에서 한 번 이렇게 말씀드려 보십시오.","s":565.128,"e":568.741,"p":false,"h":false},{"t":"아빠 아버지, 오늘도 내가 부족하나 정죄함이 없다는 말씀을 붙듭니다.","s":569.304,"e":574.523,"p":false,"h":false},{"t":"성령께서 내 영에 내가 주의 자녀임을 증언해 주시고, 몸의 행실을 이기는 힘을 주십시오.","s":575.172,"e":581.223,"p":true,"h":false},{"t":"그런데 상속자에게 왜 고난이 따릅니까.","s":581.976,"e":584.782,"p":false,"h":false},{"t":"고난 속에서도 정말 하나님의 사랑에서 끊어지지 않는다고 할 수 있는지, 그 물음은 이어지는 이야기에서 들어 보겠습니다.","s":585.396,"e":593.418,"p":true,"h":false}]},{"title":"12. 고난 속에서도 끊을 수 없다는 것 (로마서 8장 18절~39절)","audio":"book_2610310944_2.mp3","start":594.324,"end":1302.948,"dur":708.6,"segs":[{"t":"12.","s":594.324,"e":594.978,"p":false,"h":false},{"t":"고난 속에서도 끊을 수 없다는 것 (로마서 8장 18절~39절)","s":596.232,"e":601.266,"p":true,"h":false},{"t":"앞의 이야기는 이 말로 끝났습니다.","s":601.992,"e":604.683,"p":false,"h":false},{"t":"우리가 그와 함께 영광을 받기 위하여 고난도 함께 받아야 할 것이니라.","s":605.34,"e":609.886,"p":false,"h":false},{"t":"상속자의 자리에 고난이 붙어 있다는 말이었습니다.","s":610.56,"e":613.852,"p":false,"h":false},{"t":"은혜를 받으면 평탄해질 줄 알았던 사람에게 이 말은 서늘하게 들립니다.","s":614.484,"e":619.256,"p":false,"h":false},{"t":"바울은 이 서늘함을 얼버무리지 않고 18절에서 곧바로 저울에 올립니다.","s":619.92,"e":625.201,"p":false,"h":false},{"t":"내가 생각하건대 현재의 고난은 장차 우리에게 나타날 영광과 비교할 수 없도다.","s":625.86,"e":631.179,"p":false,"h":false},{"t":"바울은 고난이 작다고 하지 않았습니다.","s":631.8,"e":634.454,"p":false,"h":false},{"t":"그는 누구보다 많은 고난을 겪은 사람입니다.","s":635.112,"e":638.217,"p":false,"h":false},{"t":"다만 저울의 반대편 접시에 올려진 영광이 비교할 수 없이 무겁다고 말합니다.","s":638.784,"e":644.017,"p":true,"h":false},{"t":"그리고 19절부터 22절에서 시야가 갑자기 넓어집니다.","s":644.94,"e":649.172,"p":false,"h":false},{"t":"바울은 우리만 기다리는 것이 아니라고 말합니다.","s":649.8,"e":652.983,"p":false,"h":false},{"t":"피조물이 고대하며 하나님의 아들들이 나타나기를 기다린다고 합니다.","s":653.652,"e":657.909,"p":false,"h":false},{"t":"피조물이 허무한 데 굴복했다고 하고, 지금까지 모든 피조물이 함께 탄식하며 함께 해산의 고통을 겪고 있다고 합니다.","s":658.548,"e":666.607,"p":false,"h":false},{"t":"사람이 죄를 지었을 때 사람만 무너진 것이 아니라 사람에게 맡겨진 세계도 함께 무너졌습니다.","s":667.26,"e":673.67,"p":false,"h":false},{"t":"그러니 구원도 사람 하나로 끝나지 않습니다.","s":674.28,"e":677.358,"p":false,"h":false},{"t":"해산의 고통이라는 그림이 중요합니다.","s":677.916,"e":680.447,"p":false,"h":false},{"t":"해산은 고통이지만 끝에 새 생명이 있습니다.","s":680.976,"e":684.198,"p":false,"h":false},{"t":"지금 이 세계의 탄식은 끝이 아니라 무엇인가가 태어나고 있다는 신호입니다.","s":684.756,"e":689.997,"p":true,"h":false},{"t":"23절은 이 탄식이 우리 안에도 있다고 합니다.","s":690.876,"e":694.355,"p":false,"h":false},{"t":"성령의 처음 익은 열매를 받은 우리 자신도 속으로 탄식하며 양자 될 것 곧 우리 몸의 속량을 기다린다고 합니다.","s":695.016,"e":702.587,"p":false,"h":false},{"t":"성령을 받았다는 것은 이미 맛보기를 받았다는 뜻입니다.","s":703.224,"e":707.184,"p":false,"h":false},{"t":"첫 열매는 밭에서 먼저 거둔 열매이고, 그것이 나왔다는 것은 곧 추수가 온다는 약속입니다.","s":707.796,"e":714.505,"p":false,"h":false},{"t":"우리는 이미 아들이지만 아직 그 영광을 다 누리지 못합니다.","s":715.176,"e":719.445,"p":false,"h":false},{"t":"이미와 아직 사이에서 탄식이 나옵니다.","s":720.072,"e":722.834,"p":false,"h":false},{"t":"이 탄식은 믿음이 없어서 나오는 것이 아니라 오히려 맛보았기 때문에 더 간절해지는 것입니다.","s":723.492,"e":729.622,"p":true,"h":false},{"t":"24절과 25절은 소망이 어떤 것인지를 말합니다.","s":730.512,"e":734.544,"p":false,"h":false},{"t":"보이는 소망은 소망이 아니라고 합니다.","s":734.868,"e":737.584,"p":false,"h":false},{"t":"이미 눈앞에 있는 것을 누가 바라겠습니까.","s":738.216,"e":740.984,"p":false,"h":false},{"t":"소망은 아 se},{"t":"6장에서 보았듯이 은혜가 주인이 된 사람은 죄를 더하고 싶어 하지 않고, 이 확신이 있는 사람은 오히려 두려움 없이 순종하게 됩니다.","s":1218.276,"e":1227.169,"p":false,"h":false},{"t":"쫓겨날까 봐 두려워서 순종하는 것이 아니라, 끊을 수 없는 사랑을 받았기 때문에 순종합니다.","s":1227.816,"e":1233.847,"p":true,"h":false},{"t":"이 단락을 들으면서 한 가지를 마음에 두면 좋겠습니다.","s":1234.764,"e":1238.499,"p":false,"h":false},{"t":"내 믿음이 약해진 날, 기도가 막힌 날, 같은 죄 앞에서 또 넘어진 날에 나는 무엇을 붙들었습니까.","s":1239.12,"e":1246.276,"p":false,"h":false},{"t":"내 믿음의 세기를 붙들었습니까, 아니면 나를 끊을 수 없다고 하신 그분의 사랑을 붙들었습니까.","s":1246.896,"e":1253.302,"p":false,"h":false},{"t":"기도하는 자리에서 이렇게 말씀드려 보십시오.","s":1253.88,"e":1257.012,"p":false,"h":false},{"t":"주님, 내 힘으로 주님을 붙드는 것이 아니라 주님의 사랑이 나를 붙들고 계심을 믿습니다.","s":1257.588,"e":1263.92,"p":false,"h":false},{"t":"말이 나오지 않는 날에도 성령께서 나를 위해 간구하고 계심을 믿습니다.","s":1264.536,"e":1269.105,"p":false,"h":false},{"t":"아무것도 나를 주님의 사랑에서 끊을 수 없다는 말씀 위에 오늘 서게 하여 주십시오.","s":1269.684,"e":1274.885,"p":true,"h":false},{"t":"그런데 이 사슬 한가운데에는 걸리는 말이 있습니다.","s":1275.696,"e":1279.274,"p":false,"h":false},{"t":"미리 정하신.","s":1279.908,"e":1281.138,"p":false,"h":false},{"t":"하나님이 누구를 미리 정하셨다면 정해지지 않은 사람은 어떻게 됩니까.","s":1281.816,"e":1286.21,"p":false,"h":false},{"t":"그리고 하나님이 약속을 주신 이스라엘은 어떻게 된 것입니까.","s":1286.82,"e":1290.692,"p":false,"h":false},{"t":"바울은 9장을 가슴 아픈 고백으로 시작합니다.","s":1291.284,"e":1294.512,"p":false,"h":false},{"t":"내게 큰 근심이 있고 마음에 그치지 않는 고통이 있다고.","s":1295.172,"e":1299.323,"p":false,"h":false},{"t":"이 고백이 이야기를 열어 갑니다.","s":1299.816,"e":1302.044,"p":true,"h":false}]},{"title":"13. 하나님이 택하신다는 것은 불공평한 것은 아닌가 (로마서 9장)","audio":"book_2610310944_2.mp3","start":1302.948,"end":2135.916,"dur":833,"segs":[{"t":"13.","s":1302.948,"e":1303.728,"p":false,"h":false},{"t":"하나님이 택하신다는 것은 불공평한 것은 아닌가 (로마서 9장)","s":1304.856,"e":1309.607,"p":true,"h":false},{"t":"8장은 아무것도 우리를 하나님의 사랑에서 끊을 수 없다는 선언으로 끝났습니다.","s":1310.256,"e":1315.299,"p":false,"h":false},{"t":"그 선언을 높이 들은 직후에 9장이 시작되는데, 분위기가 전혀 다릅니다.","s":1315.908,"e":1321.202,"p":false,"h":false},{"t":"내가 그리스도 안에서 참말을 하고 거짓말을 아니하노라.","s":1321.812,"e":1325.378,"p":false,"h":false},{"t":"내게 큰 근심이 있고 마음에 그치지 않는 고통이 있다고 바울은 말합니다.","s":1326.024,"e":1331.227,"p":false,"h":false},{"t":"3절은 더 놀랍습니다.","s":1331.856,"e":1333.737,"p":false,"h":false},{"t":"내 형제 곧 골육의 친척을 위하여 내 자신이 그리스도에게서 저주를 받아 끊어질지라도 원하는 바로라고 합니다.","s":1334.34,"e":1341.582,"p":false,"h":false},{"t":"8장에서 끊을 수 없다고 외치던 사람이 9장에서는 동족을 위해 자기가 끊어져도 좋다고 말합니다.","s":1342.188,"e":1348.38,"p":false,"h":false},{"t":"이스라엘이 받은 것은 참으로 많았습니다.","s":1348.956,"e":1351.748,"p":false,"h":false},{"t":"양자 됨과 영광과 언약들과 율법과 예배와 약속들과 조상들, 그리고 육신으로는 그리스도까지 그들에게서 나셨습니다.","s":1352.376,"e":1361.054,"p":false,"h":false},{"t":"그런데 그들 대부분이 그 그리스도를 받아들이지 않았습니다.","s":1361.7,"e":1365.694,"p":true,"h":false},{"t":"여기서 날카로운 물음이 생깁니다.","s":1366.56,"e":1368.937,"p":false,"h":false},{"t":"하나님이 이스라엘에게 하신 약속은 어떻게 된 것입니까.","s":1369.584,"e":1373.141,"p":false,"h":false},{"t":"약속이 깨진 것입니까.","s":1373.76,"e":1375.49,"p":false,"h":false},{"t":"그렇다면 8장의 끊을 수 없다는 약속도 믿을 수 없게 됩니다.","s":1376.1,"e":1380.235,"p":false,"h":false},{"t":"이 물음이 9장 전체를 끌고 갑니다.","s":1380.888,"e":1383.574,"p":false,"h":false},{"t":"그래서 바울은 6절에서 이렇게 시작합니다.","s":1384.2,"e":1387.383,"p":false,"h":false},{"t":"그러나 하나님의 말씀이 폐하여진 것 같지 않도다.","s":1387.944,"e":1391.259,"p":true,"h":false},{"t":"그의 답은 이렇습니다.","s":1391.796,"e":1393.506,"p":false,"h":false},{"t":"이스라엘에게서 난 사람이 다 이스라엘은 아니요 아브라함의 씨가 다 그의 자녀는 아니라는 것입니다.","s":1393.812,"e":1400.46,"p":false,"h":false},{"t":"육신의 혈통이 약속을 받는 기준이 아니었다는 말입니다.","s":1401.12,"e":1404.84,"p":false,"h":false},{"t":"아브라함에게는 이스마엘도 있었는데 약속의 자손은 이삭이었습니다.","s":1405.476,"e":1410.42,"p":false,"h":false},{"t":"그것도 육신의 자녀가 아니라 약속의 자녀가 씨로 여겨진다고 합니다.","s":1411.092,"e":1415.82,"p":false,"h":false},{"t":"이삭과 이스마엘은 어머니가 달랐으니 그렇다 치자는 생각이 들 수 있습니다.","s":1416.456,"e":1421.367,"p":false,"h":false},{"t":"그래서 바울은 더 어려운 예를 듭니다.","s":1422.036,"e":1424.822,"p":false,"h":false},{"t":"리브가가 한 사람 곧 이삭에게서 쌍둥이를 임신했습니다.","s":1425.384,"e":1429.36,"p":false,"h":false},{"t":"어머니도 같고 아버지도 같고 같은 때에 잉태된 쌍둥이, 야곱과 에서입니다.","s":1430.028,"e":1435.674,"p":true,"h":false},{"t":"11절이 이 장의 가장 중요한 말씀입니다.","s":1436.58,"e":1439.527,"p":false,"h":false},{"t":"그 자식들이 아직 나지도 아니하고 무슨 선이나 악을 행하지 아니한 때에, 택하심을 따라 되는 하나님의 뜻이 행위로 말미암지 않고 오직 부르시는 이로 말미암아 서게 하려 하사.","s":1440.144,"e":1451.6,"p":false,"h":false},{"t":"선택은 아이들이 태어나 무엇을 하기 전에 이루어졌다는 것입니다.","s":1452.132,"e":1456.261,"p":false,"h":false},{"t":"미리 보신 선행 때문이 아니고, 미리 보신 믿음 때문도 아닙니다.","s":1456.884,"e":1461.69,"p":false,"h":false},{"t":"하나님의 뜻이 사람의 행위가 아니라 부르시는 분에게서 선다는 것이 이 말의 요점입니다.","s":1462.284,"e":1468.19,"p":false,"h":false},{"t":"그리고 13절은 기록된 말씀을 인용합니다.","s":1468.836,"e":1472.193,"p":false,"h":false},{"t":"야곱은 내가 사랑하고 에서는 미워하였다.","s":1472.724,"e":1475.637,"p":false,"h":false},{"t":"여기서 \"미워하였다\"는 말은 에서를 향한 감정의 이야기라기보다, 한 사람은 택하시고 한 사람은 택하지 않으셨다는 대비의 말로 듣습니다.","s":1476.252,"e":1485.387,"p":false,"h":false},{"t":"어느 쪽이든 이 한 구절이 분명히 하는 것은 이 차이가 둘의 행위에서 나오지 않았다는 점입니다.","s":1486.08,"e":1492.19,"p":true,"h":false},{"t":"이 대목에서 마음이 거세게 저항합니다.","s":1493.1,"e":1495.88,"p":false,"h":false},{"t":"14절이 그 저항을 그대로 받아 적습니다.","s":1496.52,"e":1499.505,"p":false,"h":false},{"t":"그런즉 우리가 무슨 말을 하리요 하나님께 불의가 있느냐.","s":1500.084,"e":1503.666,"p":false,"h":false},{"t":"바울은 이 물음이 나올 것을 알았고, 이 물음을 두려워하지 않았습니다.","s":1504.296,"e":1509.189,"p":false,"h":false},{"t":"그리고 그의 답은 이렇게 시작합니다.","s":1509.84,"e":1512.446,"p":false,"h":false},{"t":"결코 그렇지 아니하다.","s":1513.044,"e":1514.861,"p":true,"h":false},{"t":"이 대답은 한 가지를 전제하고 있습니다.","s":1515.708,"e":1518.513,"p":false,"h":false},{"t":"하나님이 누구에게든 빚지신 것이 없다는 것입니다.","s":1519.128,"e":1522.475,"p":false,"h":false},{"t":"15절에서 하나님은 모세에게 말씀하십니다.","s":1523.016,"e":1526.163,"p":false,"h":false},{"t":"내가 긍휼히 여길 자를 긍휼히 여기고 불쌍히 여길 자를 불쌍히 여기리라.","s":1526.796,"e":1531.648,"p":false,"h":false},{"t":"긍휼은 받을 자격이 있는 사람에게 갚아 주는 것이 아니라 하나님이 자유롭게 베푸시는 것입니다.","s":1532.268,"e":1538.374,"p":false,"h":false},{"t":"이 점이 이해되지 않으면 선택이 불공평하게 보입니다.","s":1539.036,"e":1542.634,"p":false,"h":false},{"t":"모든 사람이 동등하게 구원받을 권리를 가졌는데 하나님이 어떤 사람은 건지시고 어떤 사람은 건지지 않으시는 것처럼 보이기 때문입니다.","s":1543.248,"e":1552.291,"p":false,"h":false},{"t":"그러나 우리는 이 책의 처음부터 여기까지 걸어오면서 다른 사실을 보았습니다.","s":1552.86,"e":1558.454,"p":false,"h":false},{"t":"1장에서 3장에 이르기까지 우리는 모든 입이 막히고 온 세상이 하나님의 심판 아래 있다는 것을 보았습니다.","s":1559.088,"e":1565.771,"p":false,"h":false},{"t":"아무도 하나님께 요구할 것이 없었습니다.","s":1566.396,"e":1569.213,"p":false,"h":false},{"t":"구원이 모든 사람의 권리가 아니라면, 건져 주지 않으시는 것은 불의가 아닙니다.","s":1569.888,"e":1575.291,"p":false,"h":false},{"t":"한 사람이라도 건지시는 것이 은혜입니다.","s":1575.936,"e":1578.742,"p":false,"h":false},{"t":"우리가 오래 걸려 계단을 올라온 것이 이 자리에서 쓰입니다.","s":1579.248,"e":1583.39,"p":false,"h":false},{"t":"3장에서 입이 막힌 사람만이 9장의 질문 앞에서 입을 다물 수 있습니다.","s":1584.072,"e":1589.169,"p":true,"h":false},{"t":"16절은 이 결론을 한 문장으로 말합니다.","s":1590.048,"e":1593.127,"p":false,"h":false},{"t":"그런즉 원하는 자로 말미암음도 아니요 달음박질하는 자로 말미암음도 아니요 오직 긍휼히 여기시는 하나님께 달렸느니라.","s":1593.684,"e":1601.586,"p":false,"h":false},{"t":"내가 원하는 것도, 내가 애쓰는 것도 구원의 원인이 아니고 하나님의 긍휼이 원인입니다.","s":1602.252,"e":1608.253,"p":false,"h":false},{"t":"이 말은 앞서 믿음도 하나님이 주신 것이라고 했던 이야기와 같은 방향에 있습니다.","s":1608.876,"e":1614.118,"p":false,"h":false},{"t":"믿는 것이 내 몫이라면 달음박질하는 자로 말미암는 것이 되지만, 믿어지게 하신 분이 하나님이시므로 모든 것이 긍휼에 달려 있습니다.","s":1614.744,"e":1623.721,"p":true,"h":false},{"t":"17절과 18절은 반대편의 사례를 들려줍니다.","s":1624.536,"e":1628.084,"p":false,"h":false},{"t":"바로입니다.","s":1628.712,"e":1629.759,"p":false,"h":false},{"t":"성경은 바로에게 말씀하십니다.","s":1630.62,"e":1632.98,"p":false,"h":false},{"t":"내가 너를 세웠음은 너로 말미암아 내 능력을 보이고 내 이름이 온 땅에 전파되게 하려 함이라.","s":1633.608,"e":1639.561,"p":false,"h":false},{"t":"그리고 결론이 이어집니다.","s":1640.196,"e":1642.167,"p":false,"h":false},{"t":"하나님께서 하고자 하시는 자를 긍휼히 여기시고 하고자 하시는 자를 완악하게 하신다고 합니다.","s":1642.788,"e":1648.504,"p":true,"h":false},{"t":"이 구절은 무겁습니다.","s":1649.376,"e":1651.095,"p":false,"h":false},{"t":"어떻게 들어야 합니까.","s":1651.716,"e":1653.286,"p":false,"h":false},{"t":"출애굽기를 보면 바로가 여러 번 스스로 마음을 완악하게 했다는 기록이 먼저 나오고, 그 뒤에 하나님이 그의 마음을 완악하게 하셨다는 기록이 나옵니다.","s":1653.804,"e":1663.407,"p":false,"h":false},{"t":"하나님이 선하던 바로를 99.778,"p":false,"h":false},{"t":"이 말을 뒷받침하려고 바울은 호세아와 이사야를 인용합니다.","s":1900.44,"e":1904.943,"p":false,"h":false},{"t":"내 백성이 아닌 자를 내 백성이라 부르고 사랑하지 아니한 자를 사랑한 자라 부르리라.","s":1905.588,"e":1911.168,"p":false,"h":false},{"t":"이방인이 하나님의 백성이 되는 것은 갑작스러운 일이 아니라 이미 예언된 일이었습니다.","s":1911.816,"e":1917.522,"p":false,"h":false},{"t":"그리고 이사야는 이스라엘 자손이 바다의 모래 같다 할지라도 남은 자만 구원을 받으리라고 외쳤습니다.","s":1918.188,"e":1924.623,"p":false,"h":false},{"t":"이사야서를 함께 공부하신 분은 이 남은 자의 개념을 이미 만나셨을 것입니다.","s":1925.28,"e":1930.598,"p":false,"h":false},{"t":"하나님은 민족을 통째로가 아니라 그 안에서 남은 자를 건지십니다.","s":1931.22,"e":1935.629,"p":false,"h":false},{"t":"만일 만군의 주께서 우리에게 씨를 남겨 두지 아니하셨더라면 우리가 소돔 같이 되고 고모라 같이 되었으리라는 말씀이 그것입니다.","s":1936.26,"e":1944.646,"p":false,"h":false},{"t":"남아 있다는 사실이 은혜입니다.","s":1945.26,"e":1947.527,"p":true,"h":false},{"t":"30절부터는 이야기의 방향이 바뀝니다.","s":1948.428,"e":1951.358,"p":false,"h":false},{"t":"그러면 우리가 무슨 말을 하리요.","s":1951.956,"e":1954.244,"p":false,"h":false},{"t":"바울은 놀라운 사실을 하나 짚습니다.","s":1954.872,"e":1957.478,"p":false,"h":false},{"t":"의를 따르지 않던 이방인들이 의를 얻었으니 곧 믿음에서 난 의라고 합니다.","s":1958.112,"e":1963.331,"p":false,"h":false},{"t":"반대로 의의 법을 따라 갔던 이스라엘은 그 법에 이르지 못했습니다.","s":1963.98,"e":1968.407,"p":false,"h":false},{"t":"이유가 무엇입니까.","s":1969.056,"e":1970.589,"p":false,"h":false},{"t":"32절이 답합니다.","s":1971.216,"e":1972.921,"p":false,"h":false},{"t":"어찌 그러하냐 그들이 믿음으로 하지 아니하고 행위에 의지함이라.","s":1973.232,"e":1977.511,"p":false,"h":false},{"t":"그들이 부딪칠 돌에 부딪쳤다고 합니다.","s":1978.2,"e":1980.891,"p":false,"h":false},{"t":"그 돌이 바로 그리스도입니다.","s":1981.512,"e":1983.566,"p":false,"h":false},{"t":"이사야가 말한 대로 시온에 거치는 돌과 걸림이 되는 바위를 두었으나 그를 믿는 자는 부끄러워하지 아니하리라 했습니다.","s":1984.14,"e":1991.744,"p":false,"h":false},{"t":"이 마지막 부분이 중요합니다.","s":1992.384,"e":1994.423,"p":false,"h":false},{"t":"선택을 말하던 바울이 마지막에 이스라엘의 실패의 원인을 하나님의 작정으로만 돌리지 않고 그들의 행위 의지로 돌립니다.","s":1995.012,"e":2003.105,"p":false,"h":false},{"t":"하나님의 선택과 사람의 책임이 한 장 안에 함께 있습니다.","s":2003.724,"e":2007.492,"p":false,"h":false},{"t":"바울은 이 둘을 어떻게 매끈하게 조화시킬 수 있는지는 설명하지 않지만, 어느 한쪽도 지우지 않습니다.","s":2007.828,"e":2014.709,"p":false,"h":false},{"t":"선택을 말하면서도 사람은 책임이 있고, 책임을 말하면서도 구원은 하나님께 달렸습니다.","s":2015.352,"e":2021.559,"p":false,"h":false},{"t":"다음 이야기가 이 책임의 쪽을 더 깊이 들려줍니다.","s":2022.192,"e":2025.799,"p":true,"h":false},{"t":"이 장을 들으면서 가장 조심해야 할 것이 있습니다.","s":2026.656,"e":2030.075,"p":false,"h":false},{"t":"이 말씀을 들으면 자기가 선택받았는지 아닌지를 알아내려고 하늘의 장부를 뒤지고 싶어집니다.","s":2030.724,"e":2037.134,"p":false,"h":false},{"t":"그러나 바울은 이 장을 그렇게 쓰지 않았습니다.","s":2037.78,"e":2041.308,"p":false,"h":false},{"t":"이 장은 불안을 일으키려고 쓴 장이 아니라 위로하려고 쓴 장입니다.","s":2041.884,"e":2046.566,"p":false,"h":false},{"t":"8장의 끊을 수 없는 사랑의 뿌리가 어디 있는지를 보여 주는 장입니다.","s":2047.14,"e":2051.38,"p":false,"h":false},{"t":"내 구원이 내 달음박질에 달려 있다면 불안해야 하지만, 하나님의 긍휼에 달려 있다면 안전합니다.","s":2052,"e":2058.247,"p":false,"h":false},{"t":"그리고 그리스도를 향해 마음이 열렸다는 것, 하나님의 사랑이 믿어졌다는 것이 이 선택이 내 위에 이루어졌다는 가장 분명한 표지입니다.","s":2058.876,"e":2068.295,"p":false,"h":false},{"t":"앞에서 저자가 들려드린 대로, 찾기도 전에 먼저 사랑하셨다는 말을 듣고 믿어졌다는 경험은 이 장의 내용이 한 사람의 삶 속에서 어떻게 일어나는지를 보여 줍니다.","s":2068.956,"e":2079.787,"p":true,"h":false},{"t":"이 단락을 듣고 나서 이렇게 기도해 보면 좋겠습니다.","s":2080.656,"e":2084.304,"p":false,"h":false},{"t":"주님, 내가 구원받은 것이 내가 원해서도 달려서도 아니고 오직 주님의 긍휼 때문임을 고백합니다.","s":2084.976,"e":2091.982,"p":false,"h":false},{"t":"나를 택하신 은혜를 헤아릴 수 없어서 엎드립니다.","s":2092.572,"e":2095.892,"p":false,"h":false},{"t":"아직 주님을 알지 못하는 사람들을 보면서 판단하지 않고 주님의 긍휼을 구하는 사람으로 서게 하여 주십시오.","s":2096.496,"e":2103.615,"p":true,"h":false},{"t":"그러나 바울의 마음은 여기서 평안히 끝나지 않습니다.","s":2104.308,"e":2108.194,"p":false,"h":false},{"t":"10장이 시작되면서 그는 다시 말합니다.","s":2108.844,"e":2111.824,"p":false,"h":false},{"t":"형제들아 내 마음의 소원과 하나님께 구하는 것은 이스라엘을 위하여 그들이 구원받는 것이라고.","s":2112.408,"e":2118.857,"p":false,"h":false},{"t":"선택을 가장 깊이 말한 사람이 전도를 가장 간절히 한 사람이었다는 사실이 여기서 드러납니다.","s":2119.464,"e":2125.347,"p":false,"h":false},{"t":"하나님이 택하신다면 왜 복음을 전해야 하느냐는 물음에 10장이 답하고, 이스라엘이 버려진 것이냐는 물음에는 11장이 마지막에 답합니다.","s":2125.98,"e":2135.015,"p":true,"h":false}]},{"title":"14. 이스라엘은 버려졌는가, 그리고 이방인인 나는 어디에 서 있는가 (로마서 10장~11장)","audio":"book_2610310944_2.mp3","start":2135.916,"end":3150.432,"dur":1014.5,"segs":[{"t":"14.","s":2135.916,"e":2136.635,"p":false,"h":false},{"t":"이스라엘은 버려졌는가, 그리고 이방인인 나는 어디에 서 있는가 (로마서 10장~11장)","s":2137.824,"e":2144.413,"p":true,"h":false},{"t":"9장은 하나님의 선택이라는 가장 무거운 이야기로 끝났습니다.","s":2145.168,"e":2149.187,"p":false,"h":false},{"t":"그런데 바울은 그 이야기를 끝내고 평안히 앉아 있지 않습니다.","s":2149.812,"e":2154.13,"p":false,"h":false},{"t":"10장 1절에서 그는 이렇게 말합니다.","s":2154.744,"e":2157.391,"p":false,"h":false},{"t":"형제들아 내 마음의 소원과 하나님께 구하는 것은 이스라엘을 위하여 그들이 구원받는 것이라.","s":2157.984,"e":2164.289,"p":false,"h":false},{"t":"선택을 가장 깊이 말한 사람이 전도를 가장 간절히 하는 사람이었다는 사실이 여기서 드러납니다.","s":2164.968,"e":2170.865,"p":false,"h":false},{"t":"하나님이 택하신다면 굳이 복음을 전할 필요가 있느냐는 물음이 생길 수 있는데, 바울에게 선택은 전도를 멈추게 하는 이유가 아니라 전도를 소망으로 만드는 이유였습니다.","s":2171.484,"e":2182.091,"p":false,"h":false},{"t":"하나님이 택하신 사람들이 반드시 있기 때문에 전하는 일이 헛되지 않습니다.","s":2182.608,"e":2187.393,"p":true,"h":false},{"t":"바울은 이스라엘에게 열심이 있다는 것을 인정합니다.","s":2188.26,"e":2191.917,"p":false,"h":false},{"t":"2절입니다.","s":2192.58,"e":2193.587,"p":false,"h":false},{"t":"그들이 하나님께 열심이 있는 것은 내가 증언하노니.","s":2194.488,"e":2197.883,"p":false,"h":false},{"t":"그런데 그 열심이 지식을 따른 것이 아니라고 합니다.","s":2198.52,"e":2202.058,"p":false,"h":false},{"t":"열심은 뜨거운데 방향이 틀렸습니다.","s":2202.696,"e":2205.352,"p":false,"h":false},{"t":"3절은 그 이유를 말합니다.","s":2205.972,"e":2208.238,"p":false,"h":false},{"t":"하나님의 의를 모르고 자기 의를 세우려고 힘써 하나님의 의에 복종하지 아니하였다고 합니다.","s":2208.78,"e":2215.008,"p":false,"h":false},{"t":"이 구절은 우리 자신을 비추는 거울처럼 들립니다.","s":2215.62,"e":2219.043,"p":false,"h":false},{"t":"열심히 신앙생활을 하는 사람이 자기도 모르는 사이에 하나님이 주시는 의를 받는 자리가 아니라 자기가 세우는 의의 자리에 서 있을 수 있습니다.","s":2219.652,"e":2228.462,"p":false,"h":false},{"t":"3장과 4장에서 길게 보았던 그 오해가 가장 신실해 보이는 사람들 속에서 다시 나타납니다.","s":2229.12,"e":2235.239,"p":true,"h":false},{"t":"4절은 이 장의 열쇠가 되는 문장입니다.","s":2236.14,"e":2239.044,"p":false,"h":false},{"t":"그리스도는 모든 믿는 자에게 의를 이루기 위하여 율법의 마침이 되시니라.","s":2239.668,"e":2244.735,"p":false,"h":false},{"t":"여기서 마침이라는 말은 끝이라는 뜻도 되고 목표라는 뜻도 됩니다.","s":2245.32,"e":2250.051,"p":false,"h":false},{"t":"저는 두 뜻이 함께 들어 있다고 듣습니다.","s":2250.684,"e":2253.526,"p":false,"h":false},{"t":"그리스도 안에서 율법을 통한 의의 추구가 끝났고, 동시에 율법이 처음부터 가리키던 목표가 그분 안에서 이루어졌습니다.","s":2254.14,"e":2262.558,"p":false,"h":false},{"t":"율법을 폐하신 것이 아니라 율법이 향하던 곳에 도착하신 것입니다.","s":2263.212,"e":2267.817,"p":true,"h":false},{"t":"5절부터 13절은 두 가지 길을 나란히 놓습니다.","s":2268.72,"e":2272.503,"p":false,"h":false},{"t":"율법에서 난 의는 그것을 행하는 사람이 그로 말미암아 산다는 것입니다.","s":2273.076,"e":2277.951,"p":false,"h":false},{"t":"이 길은 행하는 데서 시작하고 끝까지 행해야 합니다.","s":2278.584,"e":2282.128,"p":false,"h":false},{"t":"그런데 믿음에서 난 의는 전혀 다른 말을 합니다.","s":2282.688,"e":2286.075,"p":false,"h":false},{"t":"네 마음에 누가 하늘에 올라가겠느냐 하지 말라 그것은 그리스도를 모셔 내리는 것이요, 누가 무저갱에 내려가겠느냐 하지 말라 그것은 그리스도를 죽은 자 가운데서 모셔 올리는 것이라 합니다.","s":2286.72,"e":2298.414,"p":false,"h":false},{"t":"구원을 얻으려고 하늘에 올라가거나 무저갱에 내려갈 필요가 없다는 말입니다.","s":2299.032,"e":2303.84,"p":false,"h":false},{"t":"그리스도가 이미 내려오셨고 이미 살아나셨기 때문입니다.","s":2304.432,"e":2308.526,"p":false,"h":false},{"t":"그러면 무엇이 있습니까.","s":2309.148,"e":2310.989,"p":false,"h":false},{"t":"8절은 말씀이 네게 가까워 네 입에 있으며 네 마음에 있다고 합니다.","s":2311.308,"e":2315.768,"p":false,"h":false},{"t":"구원은 먼 곳에서 올려 가져와야 하는 것이 아니라 이미 가까이 와 있는 말씀입니다.","s":2316.42,"e":2321.889,"p":true,"h":false},{"t":"그 말씀의 내용이 9절과 10절입니다.","s":2322.792,"e":2325.629,"p":false,"h":false},{"t":"네가 만일 네 입으로 예수를 주라 시인하며 또 하나님이 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 얻으리니.","s":2326.212,"e":2334.237,"p":false,"h":false},{"t":"마음으로 믿어 의에 이르고 입으로 시인하여 구원에 이른다고 합니다.","s":2334.852,"e":2339.261,"p":false,"h":false},{"t":"여기서 입으로 시인하는 것이 믿음 위에 덧붙인 공로가 아니라는 점은 이미 앞에서 본 것으로 분명합니다.","s":2339.892,"e":2346.974,"p":false,"h":false},{"t":"마음에 믿어진 것은 반드시 입으로 터져 나오기 마련이고, 이 두 가지가 함께 구원받은 사람의 모습이라는 뜻입니다.","s":2347.632,"e":2355.241,"p":false,"h":false},{"t":"고린도전서 12장 3절은 성령으로 말하지 않고는 누구든지 예수를 주라 할 수 없다고 합니다.","s":2355.912,"e":2362.029,"p":false,"h":false},{"t":"예수를 주라 시인하는 입술 자체가 성령이 하신 일의 열매입니다.","s":2362.68,"e":2366.918,"p":true,"h":false},{"t":"그리고 11절부터 13절은 이 길의 문이 모두에게 열려 있다고 말합니다.","s":2367.792,"e":2373.166,"p":false,"h":false},{"t":"그를 믿는 자는 부끄러움을 당하지 아니하리라.","s":2373.768,"e":2376.803,"p":false,"h":false},{"t":"유대인이나 헬라인이나 차별이 없다고 합니다.","s":2377.368,"e":2380.286,"p":false,"h":false},{"t":"모든 사람의 주가 되신 분이 주를 부르는 모든 사람에게 부요하시기 때문입니다.","s":2380.932,"e":2385.963,"p":false,"h":false},{"t":"그리고 13절이 이렇게 닫습니다.","s":2386.584,"e":2389.1,"p":false,"h":false},{"t":"누구든지 주의 이름을 부르는 자는 구원을 얻으리라.","s":2389.428,"e":2392.933,"p":false,"h":false},{"t":"이 말씀을 들으면 앞에서 우리가 지나온 길이 한꺼번에 떠오릅니다.","s":2393.568,"e":2398.171,"p":false,"h":false},{"t":"3장의 \"차별이 없느니라\"와 같은 말입니다.","s":2398.788,"e":2401.78,"p":true,"h":false},{"t":"그런데 바울의 논리는 여기서 한 걸음 더 나아갑니다.","s":2402.64,"e":2406.345,"p":false,"h":false},{"t":"14절과 15절은 다섯 개의 물음을 사슬처럼 이어 놓습니다.","s":2406.96,"e":2411.178,"p":false,"h":false},{"t":"그들이 믿지 아니하는 이를 어찌 부르리요.","s":2411.82,"e":2414.406,"p":false,"h":false},{"t":"듣지도 못한 이를 어찌 믿으리요.","s":2415.024,"e":2417.227,"p":false,"h":false},{"t":"전파하는 자가 없이 어찌 들으리요.","s":2417.544,"e":2420.033,"p":false,"h":false},{"t":"보내심을 받지 아니하였으면 어찌 전파하리요.","s":2420.676,"e":2423.617,"p":false,"h":false},{"t":"이 사슬을 거꾸로 들으면 구원의 길이 보입니다.","s":2424.24,"e":2427.471,"p":false,"h":false},{"t":"보내심이 있고, 전파가 있고, 들음이 있고, 믿음이 있고, 부름이 있고, 구원이 있습니다.","s":2428.056,"e":2436.352,"p":false,"h":false},{"t":"시작이 보내심이라는 점을 놓쳐서는 안 됩니다.","s":2436.948,"e":2440.154,"p":false,"h":false},{"t":"이 사슬은 하나님이 먼저 보내시는 데서 시작합니다.","s":2440.656,"e":2444.261,"p":false,"h":false},{"t":"그리고 15절은 이사야의 말을 인용하면서 그 발을 노래합니다.","s":2444.904,"e":2449.217,"p":false,"h":false},{"t":"좋은 소식을 전하는 자들의 발이 얼마나 아름다운가.","s":2449.872,"e":2453.336,"p":true,"h":false},{"t":"17절이 이 사슬의 요점을 한 문장으로 말합니다.","s":2454.156,"e":2457.727,"p":false,"h":false},{"t":"그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라.","s":2458.368,"e":2463.252,"p":false,"h":false},{"t":"이 문장은 앞에서 말한 믿음의 선물성과 모순되지 않고 오히려 짝을 이룹니다.","s":2463.876,"e":2469.482,"p":false,"h":false},{"t":"믿음이 하나님이 주시는 선물이라면, 하나님은 그 선물을 어떤 길로 주시는가.","s":2470.104,"e":2475.321,"p":false,"h":false},{"t":"사람이 전하는 그리스도의 말씀을 통해서 주십니다.","s":2475.972,"e":2479.323,"p":false,"h":false},{"t":"저자가 청년 시절 새벽기도회에서 들었던 설교도 바로 이 길이었습니다.","s":2479.932,"e":2484.72,"p":false,"h":false},{"t":"한 사람의 입으로 전해진 말씀이 있었고, 그 말씀을 통해 믿어졌습니다.","s":2485.332,"e":2490.495,"p":false,"h":false},{"t":"그러니 선택은 전도를 불필요하게 만들지 않고 전도를 하나님이 쓰시는 방법으로 만듭니다.","s":2491.128,"e":2497.121,"p":false,"h":false},{"t":"전하는 사람은 자기가 누구를 택하셨는지 알 수 없으므로 모든 사람에게 전하고, 듣는 사람 가운데서 하나님이 일하십니다.","s":2497.752,"e":2506.049,"p":true,"h":false},{"t":"18절부터 21절은 이스라엘이 듣지 못해서 믿지 않은 것이 아니라고 말합니다.","s":2506.932,"e":2512.45,"p":false,"h":false},{"t":"그들이 듣지 아니하였느냐 하면 그렇지 아니하다고 합니다.","s":2513.016,"e":2516.824,"p":false,"h":false},{"t":"소리가 온 땅에 퍼졌습니다.","s":2517.444,"e":2519.46,"p":false,"h":false},{"t":"그러면 이스라엘이 알지 못하였느냐 하면, 이사야와 모세의 말씀대로 하나님이 이방인으로 시기 나게 하겠다고 이미 말씀하셨습니다.","s":2519.784,"e":2528.677,"p":false,"h":false},{"t":"그리고 21절이 이 장의 가장 마음 아픈 문장입니다.","s":2529.324,"e":2533.255,"p":false,"h":false},{"t":"순종하지 아니하고 거슬러 말하는 백성에게 종일 내 손을 내밀었노라.","s":2533.896,"e":2538.701,"p":false,"h":false},{"t":"종일 손을 내밀었다는 말에는 하나님의 오래 참으심과 안타까움이 담겨 있습니다.","s":2539.368,"e":2544.785,"p":false,"h":false},{"t":"하나님이 이스라엘을 향해 손을 내미셨고 이스라엘은 그 손을 밀어냈습니다.","s":2545.452,"e":2550.845,"p":false,"h":false},{"t":"9장에서 하나님의 선택을 들었고 10장에서 사람의 책임을 들었습니다.","s":2551.464,"e":2555.961,"p":false,"h":false},{"t":"바울은 이 둘을 한 장씩 따로 쓰지만 어느 쪽도 지우지 않습니다.","s":2556.612,"e":2560.981,"p":true,"h":false},{"t":"이제 11장입니다.","s":2561.904,"e":2563.465,"p":false,"h":false},{"t":"이스라엘이 이렇게 하나님의 손을 밀어냈다면 하나님은 그들을 버리신 것입니까.","s":2564.1,"e":2569.066,"p":false,"h":false},{"t":"1절은 바로 이 물음으로 시작합니다.","s":2569.68,"e":2572.34,"p":false,"h":false},{"t":"그러면 내가 말하노니 하나님이 그의 백성을 버리셨느냐.","s":2572.956,"e":2576.734,"p":false,"h":false},{"t":"그리고 곧바로 답합니다.","s":2577.384,"e":2579.251,"p":false,"h":false},{"t":"그럴 수 없느니라.","s":2579.832,"e":2581.19,"p":false,"h":false},{"t" 49.956,"e":3057.335,"p":false,"h":false},{"t":"로마서의 지금까지의 길이 이 외침을 위한 것이었습니다.","s":3057.948,"e":3061.875,"p":false,"h":false},{"t":"이해가 끝나는 지점에서 설명이 아니라 경배가 터져 나옵니다.","s":3062.16,"e":3066.479,"p":false,"h":false},{"t":"이해를 다 한 것이 아니라 이해할 수 있는 만큼 이해한 끝에서 이해할 수 없는 분 앞에 엎드리는 것입니다.","s":3067.128,"e":3073.42,"p":false,"h":false},{"t":"34절과 35절은 하나님께 조언할 자가 누구이며 하나님께 먼저 드려서 갚으심을 받을 자가 누구냐고 묻습니다.","s":3074.076,"e":3081.732,"p":false,"h":false},{"t":"이 물음에는 대답할 사람이 없습니다.","s":3082.248,"e":3085.007,"p":false,"h":false},{"t":"하나님은 아무에게도 빚지지 않으셨고 모든 것이 하나님에게서 나왔기 때문입니다.","s":3085.632,"e":3090.917,"p":true,"h":false},{"t":"그리고 36절이 이 긴 길의 끝에서 가장 짧게 마무리합니다.","s":3091.788,"e":3096.446,"p":false,"h":false},{"t":"이는 만물이 주에게서 나오고 주로 말미암고 주에게로 돌아감이라 그에게 영광이 세세에 있으리로다 아멘.","s":3097.008,"e":3104.106,"p":false,"h":false},{"t":"만물이 그분에게서 나왔고 그분으로 말미암고 그분에게로 돌아갑니다.","s":3104.676,"e":3109.692,"p":false,"h":false},{"t":"구원의 시작도 중간도 끝도 하나님이십니다.","s":3110.328,"e":3113.52,"p":false,"h":false},{"t":"우리가 로마서의 계단을 하나씩 오르면서 마지막에 도달한 자리는 내가 하나님을 이해한 자리가 아니라 하나님의 깊이 앞에 서 있는 자리입니다.","s":3114.18,"e":3122.94,"p":true,"h":false},{"t":"이 단락을 들은 뒤에 이렇게 기도해 보면 좋겠습니다.","s":3123.828,"e":3127.27,"p":false,"h":false},{"t":"주님, 내가 돌감람나무 가지였으나 주님의 뿌리에 접붙여져 진액을 받고 있음을 감사합니다.","s":3127.896,"e":3134.403,"p":false,"h":false},{"t":"내가 자랑할 것이 없고 오직 주님의 긍휼로 서 있음을 고백합니다.","s":3135.06,"e":3139.526,"p":false,"h":false},{"t":"주님의 판단은 측량할 수 없고 주님의 길은 찾을 수 없음을 인정하며 오늘 이 자리에서 주님께 영광을 돌립니다.","s":3140.064,"e":3147.895,"p":false,"h":false},{"t":"아멘.","s":3148.524,"e":3149.199,"p":true,"h":false}]},{"title":"15-1. 이 은혜를 받은 사람은 어떻게 사는가 (로마서 12장~13장)","audio":"book_2610310944_2.mp3","start":3150.432,"end":4038.912,"dur":888.5,"segs":[{"t":"15-1.","s":3150.432,"e":3151.45,"p":false,"h":false},{"t":"이 은혜를 받은 사람은 어떻게 사는가 (로마서 12장~13장)","s":3152.34,"e":3157.088,"p":true,"h":false},{"t":"11장은 송영으로 끝났습니다.","s":3157.596,"e":3159.99,"p":false,"h":false},{"t":"만물이 주에게서 나오고 주로 말미암고 주에게로 돌아간다고 했습니다.","s":3160.548,"e":3165.453,"p":false,"h":false},{"t":"그 높은 자리에서 내려오자마자 바울은 12장 1절을 이렇게 시작합니다.","s":3166.092,"e":3171.127,"p":false,"h":false},{"t":"그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니.","s":3171.744,"e":3176.191,"p":false,"h":false},{"t":"지금부터 나오는 모든 말은 명령이기 전에 권면이고, 그 권면의 근거는 \"자비하심\"입니다.","s":3176.82,"e":3183.213,"p":false,"h":false},{"t":"지난 열한 장 동안 우리가 들은 것이 바로 그 자비하심입니다.","s":3183.876,"e":3188.129,"p":false,"h":false},{"t":"진노 아래 있던 사람이 값없이 의롭다 함을 받고 아들의 자리에 서게 된 이야기를 다 듣고 난 뒤에, 바울은 비로소 그러면 어떻게 살 것인가를 말합니다.","s":3188.808,"e":3198.968,"p":false,"h":false},{"t":"6장에서 먼저 신분이 있고 그다음에 명령이 있었던 순서가 책 전체의 구조가 되어 여기서 다시 나타납니다.","s":3199.284,"e":3206.626,"p":false,"h":false},{"t":"삶의 가르침은 은혜의 설명 뒤에 붙은 부록이 아니라 은혜의 열매입니다.","s":3207.276,"e":3212.167,"p":true,"h":false},{"t":"그 권면의 첫 문장이 이렇습니다.","s":3213.036,"e":3215.432,"p":false,"h":false},{"t":"너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라.","s":3216.024,"e":3219.787,"p":false,"h":false},{"t":"이는 너희가 드릴 영적 예배니라.","s":3220.416,"e":3222.981,"p":false,"h":false},{"t":"구약의 제물은 죽은 짐승이었습니다.","s":3223.656,"e":3226.293,"p":false,"h":false},{"t":"그런데 바울은 죽은 제물이 아니라 산 제물을 말합니다.","s":3226.932,"e":3230.727,"p":false,"h":false},{"t":"죽어서 드리는 것이 아니라 살아서 드리는 것이라서, 한 번 드리고 끝나지 않고 날마다 드리게 됩니다.","s":3231.36,"e":3237.964,"p":false,"h":false},{"t":"그리고 드리는 것이 \"몸\"이라는 점을 눈여겨봐야 합니다.","s":3238.56,"e":3242.276,"p":false,"h":false},{"t":"마음이나 생각만이 아니라 몸 전체, 곧 일하고 말하고 걷고 쉬는 하루 전체입니다.","s":3242.88,"e":3249.028,"p":false,"h":false},{"t":"예배는 예배당 안에서만 드리는 시간이 아니라 삶 전체가 됩니다.","s":3249.684,"e":3253.978,"p":false,"h":false},{"t":"6장에서 우리 지체를 불의의 무기로 죄에 드리지 말고 의의 무기로 하나님께 드리라고 했던 말이 여기서 예배라는 이름을 얻습니다.","s":3254.616,"e":3262.482,"p":true,"h":false},{"t":"2절은 이 삶이 어떻게 시작되는지를 말합니다.","s":3263.364,"e":3266.66,"p":false,"h":false},{"t":"너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아.","s":3267.288,"e":3272.157,"p":false,"h":false},{"t":"본받지 말라는 말은 세상의 틀에 찍혀 나오지 말라는 뜻입니다.","s":3272.796,"e":3277.039,"p":false,"h":false},{"t":"우리는 가만히 있어도 주변의 생각에 물이 듭니다.","s":3277.692,"e":3281.057,"p":false,"h":false},{"t":"거기에 맞서는 방법은 억지로 버티 3994.812,"e":3999.902,"p":false,"h":false},{"t":"이 세대를 본받지 않게 하시고 마음을 새롭게 하셔서 주님의 뜻을 분별하게 하여 주십시오.","s":4000.5,"e":4006.489,"p":false,"h":false},{"t":"미워하는 마음이 올라올 때 원수 갚는 것을 주님께 맡기는 자유를 누리게 하시고, 오늘 주 예수 그리스도로 옷 입고 살게 하여 주십시오.","s":4007.052,"e":4015.667,"p":true,"h":false},{"t":"그런데 은혜 안에서 사랑으로 산다는 일에는 가장 어려운 시험이 하나 남아 있습니다.","s":4016.34,"e":4021.396,"p":false,"h":false},{"t":"같은 믿음을 가진 형제들끼리 생각이 다를 때입니다.","s":4022.028,"e":4025.394,"p":false,"h":false},{"t":"먹는 것이나 날을 지키는 것 같은 문제에서 서로 다른 확신을 가진 사람들이 한 교회 안에 있을 때, 은혜를 아는 사람은 어떻게 서로를 대해야 합니까.","s":4025.988,"e":4035.144,"p":false,"h":false},{"t":"14장이 이 물음을 다룹니다.","s":4035.78,"e":4038.012,"p":true,"h":false}]},{"title":"15-2. 은혜를 아는 사람들은 서로를 어떻게 대하는가 (로마서 14장~16장)","audio":"book_2610310944_2.mp3","start":4038.912,"end":5141.808,"dur":1102.9,"segs":[{"t":"15-2.","s":4038.912,"e":4039.981,"p":false,"h":false},{"t":"은혜를 아는 사람들은 서로를 어떻게 대하는가 (로마서 14장~16장)","s":4040.82,"e":4046.071,"p":true,"h":false},{"t":"13장은 주 예수 그리스도로 옷 입으라는 말로 끝났습니다.","s":4046.868,"e":4050.923,"p":false,"h":false},{"t":"그 옷을 입은 사람들이 한 교회 안에 모였는데, 뜻밖의 곳에서 갈등이 생깁니다.","s":4051.548,"e":4057.229,"p":false,"h":false},{"t":"14장 1절이 그 갈등을 이렇게 꺼냅니다.","s":4057.848,"e":4061.029,"p":false,"h":false},{"t":"믿음이 약한 자를 받되 그의 의견을 비판하지 말라.","s":4061.592,"e":4065.209,"p":true,"h":false},{"t":"바울이 든 예는 먹는 문제입니다.","s":4066.092,"e":4068.428,"p":false,"h":false},{"t":"어떤 사람은 무엇이든 먹을 수 있다고 믿고, 어떤 사람은 채소만 먹습니다.","s":4069.08,"e":4074.524,"p":false,"h":false},{"t":"어떤 사람은 어떤 날을 더 귀하게 여기고, 어떤 사람은 모든 날을 같게 여깁니다.","s":4075.2,"e":4080.855,"p":false,"h":false},{"t":"여기서 \"약한 자\"는 믿음이 적은 사람이 아니라 이런 문제에서 양심의 확신이 좁은 사람을 가리킵니다.","s":4081.5,"e":4088.515,"p":false,"h":false},{"t":"구원의 길이 어디냐는 문제가 아니라 음식과 절기처럼 복음의 중심이 아닌 문제입니다.","s":4089.168,"e":4094.961,"p":false,"h":false},{"t":"이 구절이 다루는 범위는 거기까지라고 봅니다.","s":4095.612,"e":4098.663,"p":true,"h":false},{"t":"바울의 첫 가르침은 양쪽 모두에게 향합니다.","s":4099.536,"e":4102.843,"p":false,"h":false},{"t":"먹는 사람은 먹지 않는 사람을 업신여기지 말고, 먹지 않는 사람은 먹는 사람을 비판하지 말라고 합니다.","s":4103.424,"e":4110.641,"p":false,"h":false},{"t":"업신여기는 쪽은 아는 것이 많다고 생각하는 사람이고, 비판하는 쪽은 경건하다고 생각하는 사람입니다.","s":4111.308,"e":4118.164,"p":false,"h":false},{"t":"둘 다 은혜를 놓치기 쉬운 자리입니다.","s":4118.796,"e":4121.443,"p":true,"h":false},{"t":"그리고 3절 끝이 이 모든 가르침의 뿌리입니다.","s":4122.36,"e":4125.83,"p":false,"h":false},{"t":"하나님이 그를 받으셨음이라.","s":4126.32,"e":4128.321,"p":false,"h":false},{"t":"내가 형제를 받아야 하는 이유는 그가 나와 생각이 같아서가 아니라 하나님이 이미 그를 받으셨기 때문입니다.","s":4128.948,"e":4135.9,"p":false,"h":false},{"t":"4절은 한 걸음 더 나아갑니다.","s":4136.544,"e":4138.897,"p":false,"h":false},{"t":"남의 하인을 비판하는 너는 누구냐.","s":4139.244,"e":4141.639,"p":false,"h":false},{"t":"그가 서 있든지 넘어지든지 자기 주인에게 달려 있으니, 그가 세움을 받으리라.","s":4142.268,"e":4147.721,"p":false,"h":false},{"t":"주께서 능히 그를 세우실 수 있다고 합니다.","s":4148.316,"e":4151.094,"p":false,"h":false},{"t":"형제를 붙들고 계신 분이 주인이시라면 내가 그를 판단할 자리에 서 있지 않습니다.","s":4151.772,"e":4157,"p":true,"h":false},{"t":"우리가 이 책 앞부분을 걸어온 사람이라면 이 말이 낯설지 않습니다.","s":4157.892,"e":4162.522,"p":false,"h":false},{"t":"3장에서 모든 입이 막혔습니다.","s":4163.184,"e":4165.478,"p":false,"h":false},{"t":"나도 하나님 앞에서 내세울 것이 하나도 없었습니다.","s":4166.028,"e":4169.35,"p":false,"h":false},{"t":"값없이 받은 사람이 형제의 부족을 비판할 자격은 어디서 나옵니까.","s":4169.952,"e":4174.284,"p":false,"h":false},{"t":"은혜를 깊이 아는 사람은 결국 남을 판단하는 일이 불편해집니다.","s":4174.92,"e":4179.348,"p":true,"h":false},{"t":"7절부터 9절은 이 모든 이야기를 한 자리에 모읍니다.","s":4180.248,"e":4183.99,"p":false,"h":false},{"t":"우리 중에 누구든지 자기를 위하여 사는 자가 없고 자기를 위하여 죽는 자도 없도다.","s":4184.604,"e":4189.976,"p":false,"h":false},{"t":"우리가 살아도 주를 위하여 살고 죽어도 주를 위하여 죽나니 그러므로 사나 죽으나 우리가 주의 것이로라.","s":4190.616,"e":4197.383,"p":false,"h":false},{"t":"8장의 마지막에서 아무것도 우리를 끊을 수 없다고 했던 말씀이 여기서 다른 방향에서 확인됩니다.","s":4198.032,"e":4204.311,"p":false,"h":false},{"t":"사는 것도 죽는 것도 주의 것이라면, 먹느냐 안 먹느냐는 그 안에서 벌어지는 작은 일입니다.","s":4204.944,"e":4211.563,"p":false,"h":false},{"t":"먹는 사람도 주를 위하여 먹고 감사하고, 먹지 않는 사람도 주를 위하여 먹지 않고 감사합니다.","s":4212.144,"e":4219.144,"p":false,"h":false},{"t":"방식은 달라도 같은 주인 앞에 서 있습니다.","s":4219.74,"e":4222.658,"p":true,"h":false},{"t":"10절에서 12절은 이렇게 말합니다.","s":4223.556,"e":4226.141,"p":false,"h":false},{"t":"우리가 다 하나님의 심판대 앞에 서리라.","s":4226.724,"e":4229.477,"p":false,"h":false},{"t":"각각 자기 일을 하나님께 직고하리라.","s":4230.108,"e":4232.713,"p":false,"h":false},{"t":"이 말씀이 8장 1절의 \"정죄함이 없다\"와 부딪히는 것처럼 들릴 수 있습니다.","s":4233.312,"e":4238.756,"p":false,"h":false},{"t":"저는 이 심판대를 구원받았느냐 아니냐를 다시 따지는 자리로 듣지 않습니다.","s":4239.432,"e":4244.814,"p":false,"h":false},{"t":"정죄는 이미 그리스도께서 받으셨기 때문입니다.","s":4245.444,"e":4248.762,"p":false,"h":false},{"t":"구원받은 자녀가 아버지 앞에 서서 자기가 산 삶을 아뢰는 자리로 듣습니다.","s":4249.296,"e":4254.254,"p":false,"h":false},{"t":"그리고 이 자리는 남을 판단하는 일을 그만두게 하는 이유가 됩니다.","s":4254.912,"e":4259.403,"p":false,"h":false},{"t":"나도 직고할 일이 있고, 형제도 자기 몫을 주 앞에 아뢸 것입니다.","s":4260.024,"e":4264.528,"p":false,"h":false},{"t":"심판석에는 이미 앉으신 분이 계십니다.","s":4265.172,"e":4268.006,"p":true,"h":false},{"t":"13절에서 바울은 방향을 바꿉니다.","s":4268.844,"e":4271.5,"p":false,"h":false},{"t":"다시는 서로 판단하지 말고 도리어 부딪칠 것이나 거칠 것을 형제 앞에 두지 아니하도록 주의하라.","s":4272.012,"e":4278.211,"p":false,"h":false},{"t":"이제 말씀은 자유로운 사람, 곧 강한 사람을 향합니다.","s":4278.924,"e":4283.12,"p":false,"h":false},{"t":"14절에서 바울은 자기의 확신을 밝힙니다.","s":4283.784,"e":4286.881,"p":false,"h":false},{"t":"주 예수 안에서 스스로 속된 것이 없는 줄을 알고 확신하노라.","s":4287.528,"e":4291.584,"p":false,"h":false},{"t":"음식 자체는 깨끗하다는 말입니다.","s":4292.244,"e":4294.892,"p":false,"h":false},{"t":"그러나 곧바로 덧붙입니다.","s":4295.448,"e":4297.415,"p":false,"h":false},{"t":"다만 속되다고 생각하는 그 사람에게는 속된 것이 된다고.","s":4297.968,"e":4301.966,"p":false,"h":false},{"t":"이 말을 이해하는 것이 어려운 대목입니다.","s":4302.612,"e":4305.501,"p":false,"h":false},{"t":"내게 문제가 없는 일이라도 그것을 보고 양심이 흔들리는 형제 앞에서는 문제가 될 수 있다는 뜻입니다.","s":4306.104,"e":4312.801,"p":true,"h":false},{"t":"15절은 이 문제를 아주 무겁게 다룹니다.","s":4313.7,"e":4316.965,"p":false,"h":false},{"t":"네 식물로 말미암아 형제가 근심하게 되면 네가 사랑으로 행하지 아니함이니, 그리스도께서 대신하여 죽으신 형제를 네 음식으로 망하게 하지 말라.","s":4317.588,"e":4326.828,"p":false,"h":false},{"t":"그리스도께서 목숨을 내놓고 위하신 형제입니다.","s":4327.416,"e":4330.783,"p":false,"h":false},{"t":"그 사람을 위해 십자가까지 가신 분 앞에서, 내 입맛 하나 때문에 그 형제를 넘어뜨리는 것이 얼마나 가벼운 일인지를 생각하게 됩니다.","s":4331.304,"e":4340.333,"p":false,"h":false},{"t":"은혜를 아는 사람은 자기의 자유를 주장하는 데서 기쁨을 찾지 않고 형제를 세우는 데서 기쁨을 찾습니다.","s":4340.988,"e":4348.17,"p":true,"h":false},{"t":"17절이 이 장의 중심입니다.","s":4349.088,"e":4351.372,"p":false,"h":false},{"t":"하나님의 나라는 먹는 것과 마시는 것이 아니요 오직 성령 안에 있는 의와 평강과 희락이라.","s":4351.968,"e":4357.982,"p":false,"h":false},{"t":"우리는 사소한 문제로 크게 다툽니다.","s":4358.7,"e":4361.457,"p":false,"h":false},{"t":"그러나 하나님 나라의 본질은 먹고 마시는 규칙에 있지 않고 의와 평강과 희락에 있습니다.","s":4362.084,"e":4368.149,"p":false,"h":false},{"t":"5장에서 우리가 하나님과 화평을 누린다고 했고, 11절에서 하나님 안에서 즐거워한다고 했던 그 평강과 희락이 이 자리에서 교회 공동체의 모습이 됩니다.","s":4368.78,"e":4378.946,"p":false,"h":false},{"t":"19절은 그러므로 화평의 일과 서로 덕을 세우는 일을 힘쓰라고 합니다.","s":4379.544,"e":4384.247,"p":false,"h":false},{"t":"음식 때문에 하나님의 일을 무너뜨리지 말라고 합니다.","s":4384.872,"e":4388.315,"p":true,"h":false},{"t":"그리고 22절과 23절에서 바울은 약한 자의 입장을 한 번 더 헤아립니다.","s":4389.192,"e":4394.752,"p":false,"h":false},{"t":"의심하고 먹는 자는 정죄된 것이니 이는 믿음으로 하지 아니하였음이라.","s":4395.384,"e":4399.929,"p":false,"h":false},{"t":"믿음으로 좇아 하지 아니하는 것은 다 죄니라.","s":4400.604,"e":4403.672,"p":false,"h":false},{"t":"이 말을 모든 일을 믿음의 확신이 있을 때만 해야 한다는 일반 원리로만 들으면 오해가 생깁니다.","s":4404.348,"e":4410.539,"p":false,"h":false},{"t":"이 문맥에서 바울은 자기 양심이 허락하지 않는다고 느끼면서 남이 하니까 따라서 하는 사람을 말하고 있습니다.","s":4411.188,"e":4418.268,"p":false,"h":false},{"t":"양심을 거슬러 행하는 것은 믿음의 자유가 아니라 자기 확신을 배신하는 일이라서 죄가 됩니다.","s":4418.928,"e":4425.088,"p":false,"h":false},{"t":"그러니 강한 사람은 약한 사람에게 \"너도 해도 된다\"고 압력을 넣어서도 안 됩니다.","s":4425.66,"e":4431.75,"p":false,"h":false},{"t":"확신은 억지로 만들어지지 않고 말씀과 성령 안에서 자라는 것입니다.","s":4432.356,"e":4437.236,"p":true,"h":false},{"t":"15장 1절부터 6절은 이 가르침을 그리스도의 모습으로 마무리합니다.","s":4438.08,"e":4443.07,"p":false,"h":false},{"t":"믿음이 강한 우리는 믿음이 약한 자의 약점을 담당하고 우리 자신만 기쁘게 하지 아니할 것이라.","s":4443.696,"e":4450.105,"p":false,"h":false},{"t":"그리스도께서도 자기를 기쁘시게 하지 아니하셨다고 합니다.","s":4450.752,"e":4454.549,"p":false,     pt.style.display = k > 0 ? '' : 'none'; if (k > 0) { pt.title = '앞 글: ' + TRACKS[k - 1].title; }
    nt.style.display = k < N - 1 ? '' : 'none'; if (k < N - 1) { nt.title = '다음 글: ' + TRACKS[k + 1].title; }
    if (k < N - 1) { $('nvname').textContent = TRACKS[k + 1].title; $('nvgo').href = '#' + (k + 2); $('nvcard').style.display = 'block'; } else { $('nvcard').style.display = 'none'; }
    /* 이어 듣기 */
    const r = $('resume'); r.style.display = 'none';
    const pos = parseFloat(pref('pos' + k));
    if (pos > 10 && pos < (t.dur || 1e9) - 5) {
      r.style.display = 'block';
      r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
      $('rb').onclick = () => { seek(t.start + pos); r.style.display = 'none'; play(); };
    }
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function go(nk, autoplay) {
    if (nk < 0 || nk >= N) { return; }
    try { history.pushState(null, '', '#' + (nk + 1)); } catch (e) { try { location.hash = '#' + (nk + 1); } catch (x) {} }
    render(nk);
    if (autoplay) { play(); }
  }
  function hashK() { const m = /^#(\d+)/.exec(location.hash || ''); if (m) { const q = parseInt(m[1], 10) - 1; if (q >= 0 && q < N) { return q; } } return 0; }
  window.addEventListener('hashchange', () => { const q = hashK(); if (q !== k) { render(q); } });
  (function () { const tl = $('tolist'); if (LIST) { tl.href = LIST; tl.style.display = 'inline-block'; } })();

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('pt').onclick = () => go(k - 1, false);
  $('nt').onclick = () => go(k + 1, true);
  $('nvgo').onclick = e => { e.preventDefault(); go(k + 1, true); };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); armEnd(); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); seek(T().start + ((e.clientX - r.left) / r.width) * (T().dur || 0)); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  render(hashK());

  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, go, seek, toggle, audio, TRACKS, state: () => ({ k, playing, curSrc }) };
})();
</script>
</body>
