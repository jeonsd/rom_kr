<script>
(function () {
  const TITLE = "로마서 깊이 들어가기", TRACKS = [{"title":"이 글에 대하여","audio":"book_2610310944_1.mp3","start":0,"end":114.264,"dur":114.3,"segs":[{"t":"이 글에 대하여","s":0,"e":1.195,"p":true,"h":false},{"t":"이 글은 로마서를 읽고 이해해 온 한 사람의 신학적 입장에서 쓴 것입니다.","s":1.98,"e":6.918,"p":true,"h":false},{"t":"이 앱의 필요성을 생각하고, 기획하고, 만들기로 결단한 사람은 전승대 선교사입니다.","s":7.776,"e":14.591,"p":false,"h":false},{"t":"글에 담긴 성경 이해와 신학은 여러 견해의 평균이 아니라, 제가 진리라고 판단하는 바를 따랐습니다.","s":15.192,"e":22.013,"p":false,"h":false},{"t":"글을 쓰는 데 AI의 도움을 받았지만, 무엇을 담을지는 제가 지시하고, 듣고 살펴서 확정했습니다.","s":22.68,"e":29.86,"p":false,"h":false},{"t":"그러므로 이 글의 내용에 대한 책임은 저에게 있습니다.","s":30.528,"e":34.243,"p":true,"h":false},{"t":"이 글은 계단처럼 짜여 있습니다.","s":35.1,"e":37.478,"p":false,"h":false},{"t":"은혜를 지식으로 외우는 것과 영혼 전체가 납득하는 것은 큰 차이가 있습니다.","s":38.016,"e":43.108,"p":false,"h":false},{"t":"저 자신이 여러 차례 반복되는 놀라움을 거쳐서야 은혜를 이해하게 되었습니다.","s":43.74,"e":48.781,"p":false,"h":false},{"t":"로마서는 바로 그런 이해가 한 단계씩 깊어지는 과정이 필요한 책이라고 생각합니다.","s":49.464,"e":55.099,"p":false,"h":false},{"t":"그래서 바울이 논증한 순서를 따라, 한 걸음씩 내려가고 한 걸음씩 올라가도록 만들었습니다.","s":55.764,"e":62.17,"p":true,"h":false},{"t":"한 가지를 미리 말씀드립니다.","s":63.036,"e":65.267,"p":false,"h":false},{"t":"이 계단은 바울이 논증한 순서입니다.","s":65.592,"e":68.326,"p":false,"h":false},{"t":"그러나 사람이 실제로 은혜를 만나는 순서는 다를 수 있습니다.","s":68.94,"e":72.983,"p":false,"h":false},{"t":"하나님의 사랑을 먼저 만나고, 그 사랑 앞에서 자신의 죄를 나중에 깨닫는 사람도 많습니다.","s":73.26,"e":79.554,"p":false,"h":false},{"t":"저도 그랬습니다.","s":80.172,"e":81.529,"p":false,"h":false},{"t":"그러니 정죄의 자리를 먼저 지나지 않으면 은혜가 아니라고 오해하지 않으시기 바랍니다.","s":82.152,"e":87.768,"p":false,"h":false},{"t":"같은 진리가 사람마다 다른 문으로 들어옵니다.","s":88.344,"e":91.588,"p":true,"h":false},{"t":"이 글은 길잡이일 뿐입니다.","s":92.448,"e":94.476,"p":false,"h":false},{"t":"들으시면서 반드시 성경 본문을 펴서 확인하시기 바랍니다.","s":95.076,"e":99.161,"p":false,"h":false},{"t":"그리고 글을 읽고 듣는 중에 깊이 생각하고 이해하는 순간마다, 우리의 눈을 열어 주시고 깨달음을 바른 길로 인도해 주시는 분은 성령이십니다.","s":99.828,"e":109.173,"p":false,"h":false},{"t":"이 글이 그 인도하심을 구하는 자리가 되기를 바랍니다.","s":109.836,"e":113.456,"p":true,"h":false}]},{"title":"1. 복음이 왜 진노에서 시작하는가 (로마서 1장 18절~32절)","audio":"book_2610310944_1.mp3","start":114.264,"end":502.92,"dur":388.7,"segs":[{"t":"1.","s":114.264,"e":114.822,"p":false,"h":false},{"t":"복음이 왜 진노에서 시작하는가 (로마서 1장 18절~32절)","s":116.172,"e":121.177,"p":true,"h":false},{"t":"로마서 1장 16절과 17절은 복음의 선언입니다.","s":121.932,"e":125.82,"p":false,"h":false},{"t":"복음은 믿는 모든 사람에게 구원을 주는 하나님의 능력이며, 그 안에 하나님의 의가 나타난다고 합니다.","s":126.432,"e":133.16,"p":false,"h":false},{"t":"여기까지는 우리가 아는 복음과 같은 소리입니다.","s":133.812,"e":137.177,"p":false,"h":false},{"t":"그런데 바로 다음 절을 보십시오.","s":137.808,"e":140.138,"p":false,"h":false},{"t":"18절은 이렇게 시작합니다.","s":140.652,"e":142.83,"p":false,"h":false},{"t":"하나님의 진노가 나타나나니.","s":143.424,"e":145.51,"p":false,"h":false},{"t":"17절에서 \"나타나나니\"라고 한 그 동사가 18절에서 똑같이 한 번 더 나옵니다.","s":146.124,"e":151.896,"p":false,"h":false},{"t":"바울이 일부러 맞춘 것입니다.","s":152.532,"e":154.673,"p":false,"h":false},{"t":"복음 안에서 하나님의 의가 나타나고, 같은 하나님의 진노도 나타납니다.","s":154.98,"e":160.02,"p":false,"h":false},{"t":"좋은 소식을 말하려던 사람이 바로 다음 문장에서 나쁜 소식을 꺼내 듭니다.","s":160.668,"e":165.621,"p":true,"h":false},{"t":"우리는 이 순서가 낯섭니다.","s":166.5,"e":168.691,"p":false,"h":false},{"t":"복음을 전할 때 하나님이 얼마나 사랑하시는지부터 말하고 싶고, 진노는 되도록 뒤로 미루거나 아예 말하지 않고 싶습니다.","s":169.344,"e":177.11,"p":false,"h":false},{"t":"바울은 반대로 합니다.","s":177.768,"e":179.486,"p":false,"h":false},{"t":"이유는 간단합니다.","s":180.036,"e":181.673,"p":false,"h":false},{"t":"진단 없이는 처방이 처방으로 들리지 않기 때문입니다.","s":182.304,"e":185.947,"p":false,"h":false},{"t":"건강하다고 믿는 사람에게 약을 주면 약이 귀한 줄 모릅니다.","s":186.552,"e":190.544,"p":false,"h":false},{"t":"은혜를 외우기는 했는데 왜 마음에 와닿지 않는지, 그 이유의 상당 부분이 여기에 있습니다.","s":191.196,"e":197.468,"p":false,"h":false},{"t":"은혜가 무엇인지는 알아도 은혜가 없으면 내가 어떤 자리에 있는지를 건너뛰었기 때문입니다.","s":198.108,"e":204.105,"p":false,"h":false},{"t":"그래서 바울은 은혜를 말하기 전에, 3장 20절까지 거의 세 장을 진단에 씁니다.","s":204.768,"e":210.403,"p":true,"h":false},{"t":"그러면 진노란 무엇입니까.","s":211.284,"e":213.372,"p":false,"h":false},{"t":"사람들은 진노를 하나님이 화가 나서 터뜨리는 감정으로 떠올립니다.","s":213.696,"e":218.231,"p":false,"h":false},{"t":"그러나 성경이 말하는 진노는 변덕이 아닙니다.","s":218.772,"e":222.089,"p":false,"h":false},{"t":"악을 악으로 보시는 거룩하고 의로우신 하나님의 변함없는 반응입니다.","s":222.408,"e":227.021,"p":false,"h":false},{"t":"악 앞에서 아무 반응이 없는 하나님이 있다면 그분은 선하신 분일 수 없습니다.","s":227.628,"e":232.822,"p":false,"h":false},{"t":"불의 앞에서 분노하지 않는 재판관을 우리는 좋은 재판관이라 부르지 않습니다.","s":233.424,"e":238.791,"p":false,"h":false},{"t":"그러니 진노는 하나님의 사랑과 반대편에 있는 성품이 아니라, 하나님이 선하시다는 것의 다른 얼굴입니다.","s":239.436,"e":246.278,"p":true,"h":false},{"t":"18절은 그 진노가 누구에게 향하는지 말합니다.","s":247.176,"e":250.662,"p":false,"h":false},{"t":"진리를 막는 사람들의 모든 경건하지 않음과 불의입니다.","s":251.244,"e":255.084,"p":false,"h":false},{"t":"여기서 \"막는다\"는 말에 귀를 기울여야 합니다.","s":255.636,"e":259.152,"p":false,"h":false},{"t":"바울은 사람이 진리를 몰라서 잘못한다고 하지 않습니다.","s":259.776,"e":263.48,"p":false,"h":false},{"t":"19절과 20절은 오히려 하나님을 알 만한 것이 이미 사람 속에, 또 지으신 세계 속에 분명히 드러나 있다고 합니다.","s":264.096,"e":271.94,"p":false,"h":false},{"t":"하늘과 땅과 사람의 양심이 말하고 있는데, 사람이 그것을 듣고도 눌러 버리는 것입니다.","s":272.556,"e":278.348,"p":false,"h":false},{"t":"모르는 것과 알면서 막는 것은 전혀 다른 죄입니다.","s":279,"e":282.754,"p":false,"h":false},{"t":"21절은 그 모습을 이렇게 그립니다.","s":283.392,"e":286.308,"p":false,"h":false},{"t":"하나님을 알되 하나님을 영화롭게도 아니하며 감사하지도 아니하고.","s":286.596,"e":290.734,"p":false,"h":false},{"t":"극악한 범죄가 아니라 감사하지 않는 것이 출발점이라는 사실이 놀랍습니다.","s":291.348,"e":296.529,"p":false,"h":false},{"t":"받은 것이 많은데 주신 분을 주신 분으로 대하지 않는 것, 바울은 거기서부터 인류의 무너짐이 시작되었다고 봅니다.","s":297.18,"e":304.614,"p":true,"h":false},{"t":"23절과 25절에 이르면 문제의 핵심이 더 분명해집니다.","s":305.46,"e":310.016,"p":false,"h":false},{"t":"사람들은 썩지 않는 하나님의 영광을 썩어질 것의 형상으로 바꾸고, 하나님의 진리를 거짓것으로 바꾸어, 창조주 대신 피조물을 경배하며 섬깁니다.","s":310.644,"e":320.504,"p":false,"h":false},{"t":"우리는 우상이라고 하면 나무와 돌로 만든 신상을 떠올립니다.","s":321.12,"e":325.223,"p":false,"h":false},{"t":"그러나 바울이 겨냥하는 것은 그것만이 아닙니다.","s":325.872,"e":329.305,"p":false,"h":false},{"t":"하나님이 앉으셔야 할 자리에 하나님이 아닌 무엇인가를 앉히는 것, 그것이 우상입니다.","s":329.616,"e":335.447,"p":false,"h":false},{"t":"돈이든 성취든 자기 자신이든 사랑하는 사람이든 마찬가지입니다.","s":336.096,"e":340.414,"p":false,"h":false},{"t":"사람은 예배하지 않는 존재가 아니라 무엇인가를 반드시 예배하는 존재입니다.","s":340.956,"e":346.023,"p":false,"h":false},{"t":"문제는 예배의 방향이 틀어져 있다는 것입니다.","s":346.68,"e":349.734,"p":true,"h":false},{"t":"그러면 진노는 어떻게 나타납니까.","s":350.604,"e":353.009,"p":false,"h":false},{"t":"이 대목을 읽는 방식이 이 단락의 열쇠입니다.","s":353.556,"e":356.989,"p":false,"h":false},{"t":"24절, 26절, 28절에 같은 말이 세 번 반복됩니다.","s":357.624,"e":362.87,"p":false,"h":false},{"t":"하나님께서 그들을 내버려 두사.","s":363.492,"e":365.78,"p":false,"h":false},{"t":"하늘에서 불이 떨어지거나 땅이 갈라지는 장면이 아닙니다.","s":366.444,"e":370.286,"p":false,"h":false},{"t":"하나님이 막고 계시던 손을 놓으시는 것입니다.","s":370.62,"e":373.588,"p":false,"h":false},{"t":"사람이 하나님을 밀어내고 자기 길로 가겠다고 하면, 하나님은 그 선택을 존중하시듯 그대로 두십니다.","s":373.896,"e":380.813,"p":false,"h":false},{"t":"겉으로는 조용합니다.","s":381.384,"e":383.112,"p":false,"h":false},{"t":"그런데 바로 그 조용함이 심판입니다.","s":383.724,"e":386.452,"p":false,"h":false},{"t":"하나님 없이 마음대로 살아 본 사람이 자기 욕망의 끝에서 무엇을 만나는지, 24절 이하는 그것을 보여 줍니다.","s":387.036,"e":394.715,"p":true,"h":false},{"t":"26절과 27절의 이야기는 가볍게 지나가면 안 되고 정직하게 들어야 합니다.","s":395.604,"e":401.284,"p":false,"h":false},{"t":"바울은 여기서 사람의 성적 혼란을 언급하는데, 이것을 모든 문제의 원인으로 놓지 않습니다.","s":401.904,"e":408.185,"p":false,"h":false},{"t":"순서를 보십시오.","s":408.816,"e":410.254,"p":false,"h":false},{"t":"먼저 하나님을 하나님으로 대하지 않는 일이 있었고, 그 결과로 내버려 두심이 있었으며, 그 끝에 이런 모습이 나타납니다.","s":410.724,"e":419.395,"p":false,"h":false},{"t":"원인은 예배의 방향이고, 이런 일들은 그 뒤틀림이 몸과 삶에 드러난 결과입니다.","s":420.012,"e":426.034,"p":false,"h":false},{"t":"그래서 바울이 28절 이하에서 나열하는 목록에는 탐욕과 시기와 험담과 부모에게 거역함이 성적인 문제와 같은 줄에 나란히 놓입니다.","s":426.672,"e":435.453,"p":false,"h":false},{"t":"어느 한 죄를 골라 \"저들의 문제\"라고 손가락질하라고 쓴 글이 아닙니다.","s":436.032,"e":440.864,"p":true,"h":false},{"t":"여기서 이 단락을 듣는 우리 자신에게 물음이 생깁니다.","s":441.756,"e":445.482,"p":false,"h":false},{"t":"1장 끝의 32절은, 이런 일을 하는 자들이 죽어 마땅하다는 하나님의 판결을 알면서도 그것을 행할 뿐 아니라 행하는 자들을 옳다고 한다고 말합니다.","s":446.148,"e":455.866,"p":false,"h":false},{"t":"우리는 이 목록을 들으며 자연스럽게 \"그들\"을 떠올립니다.","s":456.408,"e":460.661,"p":false,"h":false},{"t":"세상이 이렇게 어긋나 있다고 고개를 끄덕입니다.","s":461.304,"e":464.69,"p":false,"h":false},{"t":"바울은 그 끄덕임을 기다리고 있었습니다.","s":465.336,"e":468.196,"p":false,"h":false},{"t":"그렇게 끄덕이는 사람을 향해 2장 1절을 쓰기 위해서입니다.","s":468.792,"e":472.898,"p":false,"h":false},{"t":"그러므로 남을 판단하는 사람아 네가 핑계하지 못할 것은.","s":473.508,"e":477.489,"p":true,"h":false},{"t":"복음의 첫 번째 질문은 \"하나님이 나를 사랑하시는가\"가 아니라 \"나는 하나님 앞에 어떤 자리에 서 있는가\"입니다.","s":478.188,"e":485.567,"p":false,"h":false},{"t":"이 질문을 건너뛰면 은혜는 정의로 남고 체험이 되지 못합니다.","s":486.252,"e":490.821,"p":false,"h":false},{"t":"그렇다면 정직하게 물어보아야 합니다.","s":491.508,"e":494.202,"p":false,"h":false},{"t":"나는 지금 1장을 들으면서 \"그들\"의 이야기를 듣고 있습니까, 아니면 \"나\"의 이야기를 듣고 있습니까.","s":494.82,"e":502.014,"p":true,"h":false}]},{"title":"2. 도덕적으로 사는 나는 괜찮은가 (로마서 2장)","audio":"book_2610310944_1.mp3","start":502.92,"end":877.104,"dur":374.2,"segs":[{"t":"2.","s":502.92,"e":503.228,"p":false,"h":false},{"t":"도덕적으로 사는 나는 괜찮은가 (로마서 2장)","s":503.532,"e":507.202,"p":true,"h":false},{"t":"1장을 들으며 고개를 끄덕이던 사람에게 바울은 2장 1절에서 이렇게 말합니다.","s":507.924,"e":513.046,"p":false,"h":false},{"t":"그러므로 남을 판단하는 사람아 네가 누구이든지 핑계하지 못할 것은.","s":513.648,"e":518.378,"p":false,"h":false},{"t":"1장의 목록을 들으며 \"그래, 세상이 참 어긋났지\" 하던 바로 그 사람을 부르는 말입니다.","s":518.868,"e":525.436,"p":false,"h":false},{"t":"바울은 판단하는 사람을 따로 몰아세우지 않고, 판단하는 바로 그 일이 올가미가 된다고 말합니다.","s":526.068,"e":532.76,"p":false,"h":false},{"t":"남을 정죄하는 그 기준이 곧 나를 정죄하는 기준이 되기 때문입니다.","s":533.376,"e":537.977,"p":false,"h":false},{"t":"남의 죄를 정확히 알아볼 수 있다는 것은 나에게도 같은 기준이 있다는 증거이고, 그 기준 앞에서 나도 온전하지 못하다는 것이 이 단락의 논리입니다.","s":538.596,"e":548.979,"p":true,"h":false},{"t":"여기서 바울이 겨냥하는 사람은 막 살아온 사람이 아닙니다.","s":549.864,"e":553.78,"p":false,"h":false},{"t":"도덕적으로 반듯하게 산 사람, 옳고 그름을 분별할 줄 아는 사람입니다.","s":554.4,"e":559.871,"p":false,"h":false},{"t":"그리고 2장 후반에 가면 그 대상이 더 구체적으로 드러납니다.","s":560.52,"e":564.796,"p":false,"h":false},{"t":"율법을 가졌고 하나님을 자랑하는 사람, 곧 하나님의 말씀을 알고 가르치는 사람입니다.","s":565.416,"e":571.506,"p": 질문은 6장에서 다른 모습으로 다시 올라오므로 그때 제대로 다루겠습니다.","s":1036.872,"e":1042.303,"p":true,"h":false},{"t":"9절에서 바울은 지금까지의 논의를 모아 이렇게 묻습니다.","s":1043.208,"e":1047.125,"p":false,"h":false},{"t":"그러면 어떠하냐 우리는 나으냐.","s":1047.708,"e":1049.871,"p":false,"h":false},{"t":"그리고 답합니다.","s":1050.48,"e":1051.833,"p":false,"h":false},{"t":"결코 아니라.","s":1052.424,"e":1053.512,"p":false,"h":false},{"t":"유대인이나 헬라인이나 다 죄 아래 있다는 것입니다.","s":1054.332,"e":1057.851,"p":false,"h":false},{"t":"1장은 이방인, 2장은 유대인을 다루었고, 이제 양쪽을 합쳐 한 선고로 묶습니다.","s":1058.436,"e":1064.689,"p":false,"h":false},{"t":"누구도 예외가 없습니다.","s":1065.312,"e":1067.186,"p":true,"h":false},{"t":"10절부터 18절은 바울이 구약 여러 곳에서 모아 엮은 선언입니다.","s":1068.084,"e":1072.96,"p":false,"h":false},{"t":"의인은 없나니 하나도 없고, 깨닫는 자도 없고 하나님을 찾는 자도 없고, 다 치우쳐 한가지로 무익하게 되고, 선을 행하는 자는 없나니 하나도 없도다.","s":1073.592,"e":1084.091,"p":false,"h":false},{"t":"그리고 이어서 사람의 몸을 따라 내려갑니다.","s":1084.716,"e":1087.645,"p":false,"h":false},{"t":"목구멍, 혀, 입술, 입, 발, 눈.","s":1088.28,"e":1094.737,"p":false,"h":false},{"t":"말과 걸음과 시선까지 몸 전체가 죄의 도구가 되어 있다는 그림입니다.","s":1095.3,"e":1100.079,"p":false,"h":false},{"t":"이 구절들은 시편과 이사야에서 가져온 것인데, 바울은 이것을 자기 의견으로 말하지 않고 이미 너희가 가진 성경이 이렇게 말한다고 보여 줍니다.","s":1100.736,"e":1110.854,"p":false,"h":false},{"t":"율법을 자랑하던 사람들에게 가장 어울리는 증거를 율법 자신에게서 꺼내 온 것입니다.","s":1111.5,"e":1117.361,"p":true,"h":false},{"t":"여기서 한 가지를 조심해서 들어야 합니다.","s":1118.268,"e":1120.937,"p":false,"h":false},{"t":"\"선을 행하는 자는 없다\"는 말은 사람이 아무 선도 할 수 없다는 뜻이 아닙니다.","s":1121.256,"e":1126.478,"p":false,"h":false},{"t":"사람은 얼마든지 친절하고 정직하고 헌신적일 수 있습니다.","s":1127.088,"e":1131.347,"p":false,"h":false},{"t":"바울이 말하는 것은, 하나님 앞에서 그것이 자기를 의롭다고 내세울 근거가 되지는 못한다는 것입니다.","s":1131.984,"e":1138.836,"p":false,"h":false},{"t":"우리가 하는 선도 하나님을 향한 마음에서 나오지 않으면 같은 뿌리의 틀어짐 위에 있기 때문입니다.","s":1139.472,"e":1145.519,"p":false,"h":false},{"t":"이 구별은 뒤에 나올 7장과 8장을 이해하는 데에도 필요합니다.","s":1146.132,"e":1150.187,"p":true,"h":false},{"t":"19절과 20절이 이 긴 진단의 결론입니다.","s":1151.064,"e":1154.417,"p":false,"h":false},{"t":"율법이 말하는 바는 율법 아래 있는 자들에게 말하는 것인 줄 우리가 아노니, 이는 모든 입을 막고 온 세상으로 하나님의 심판 아래에 있게 하려는 것이라.","s":1154.988,"e":1164.503,"p":false,"h":false},{"t":"모든 입이 막힌다는 것은 변명이 끝난다는 뜻입니다.","s":1165.176,"e":1168.904,"p":false,"h":false},{"t":"재판정에서 피고가 더는 할 말이 없는 순간입니다.","s":1169.532,"e":1172.925,"p":false,"h":false},{"t":"우리는 평소에 얼마나 많은 변명을 안고 삽니까.","s":1173.564,"e":1176.708,"p":false,"h":false},{"t":"환경이 그랬다고, 남들도 그렇다고, 나는 그나마 낫다고, 하나님이 이해하시리라고.","s":1177.344,"e":1184.083,"p":false,"h":false},{"t":"바울은 그 모든 변명이 쓰러질 때까지 논증을 몰고 갑니다.","s":1184.688,"e":1188.923,"p":false,"h":false},{"t":"이것이 은혜를 받기 위한 준비라고 저는 봅니다.","s":1189.224,"e":1192.529,"p":false,"h":false},{"t":"변명할 말이 남아 있는 사람에게는 은혜가 필요하지 않습니다.","s":1193.148,"e":1197.029,"p":true,"h":false},{"t":"그리고 20절의 마지막 구절은 율법에 대한 우리의 오해를 정면으로 바로잡습니다.","s":1197.9,"e":1203.532,"p":false,"h":false},{"t":"율법으로는 죄의 깨달음이 있을 뿐이라.","s":1204.164,"e":1207.005,"p":false,"h":false},{"t":"우리는 율법을 구원에 이르는 사다리처럼 생각해 왔습니다.","s":1207.656,"e":1211.363,"p":false,"h":false},{"t":"열심히 지키면 올라간다고 말입니다.","s":1211.976,"e":1214.607,"p":false,"h":false},{"t":"그런데 율법의 역할은 사다리가 아니라 거울입니다.","s":1215.252,"e":1218.722,"p":false,"h":false},{"t":"거울은 얼굴의 얼룩을 보여 줄 수는 있어도 닦아 주지는 못합니다.","s":1219.356,"e":1223.678,"p":false,"h":false},{"t":"율법이 나를 비추면 나는 죄를 알게 되지만 율법이 나를 고쳐 주지는 않습니다.","s":1224.324,"e":1229.616,"p":false,"h":false},{"t":"이 사실을 받아들이지 못하면 사람은 거울을 닦으며 얼굴이 깨끗해지기를 기다리게 됩니다.","s":1230.264,"e":1236.319,"p":true,"h":false},{"t":"바울은 3장 20절에서 진단을 끝내고, 바로 다음 절에서 문장의 첫 단어를 바꿉니다.","s":1236.852,"e":1243.156,"p":false,"h":false},{"t":"이제는.","s":1243.8,"e":1244.569,"p":false,"h":false},{"t":"지금까지 이어 온 어두운 이야기가 여기서 한 번 꺾입니다.","s":1245.708,"e":1249.761,"p":false,"h":false},{"t":"모든 입이 막히고 더는 할 말이 없는 자리에서 하나님이 무엇을 하셨는지, 그것이 21절부터의 이야기입니다.","s":1250.388,"e":1258.183,"p":false,"h":false},{"t":"그 이야기를 듣기 전에, 먼저 스스로 물어보면 좋겠습니다.","s":1258.848,"e":1263.138,"p":false,"h":false},{"t":"나는 지금 하나님 앞에서 말할 변명을 몇 개나 쥐고 있습니까.","s":1263.78,"e":1267.651,"p":false,"h":false},{"t":"그 변명들이 다 쓰러졌을 때 내게 남는 것은 무엇입니까.","s":1268.28,"e":1272.374,"p":true,"h":false}]},{"title":"4-1. 하나님은 어떻게 죄인을 의롭다 하시면서 의로우실 수 있는가 (로마서 3장 21절~26절)","audio":"book_2610310944_1.mp3","start":1272.924,"end":1741.212,"dur":468.3,"segs":[{"t":"4-1.","s":1272.924,"e":1273.89,"p":false,"h":false},{"t":"하나님은 어떻게 죄인을 의롭다 하시면서 의로우실 수 있는가 (로마서 3장 21절~26절)","s":1274.832,"e":1281.648,"p":true,"h":false},{"t":"3장 20절까지 이어진 어두운 진단이 21절에서 꺾입니다.","s":1282.284,"e":1287.062,"p":false,"h":false},{"t":"이제는 율법 외에 하나님의 한 의가 나타났으니.","s":1287.72,"e":1290.767,"p":false,"h":false},{"t":"앞 장들에서 나타난 것은 진노였는데, 여기서 같은 동사가 다시 나옵니다.","s":1291.356,"e":1296.713,"p":false,"h":false},{"t":"1장 17절에서 복음 안에 하나님의 의가 나타난다고 했고, 18절에서 진노가 나타난다고 했는데, 이제 그 의가 어떤 모습으로 나타났는지를 드러내기 시작합니다.","s":1297.332,"e":1308.333,"p":false,"h":false},{"t":"바울은 3장 20절까지 모든 입을 막았고, 21절에서 입이 막힌 사람들 앞에 하나님이 하신 일을 내놓습니다.","s":1308.96,"e":1316.691,"p":false,"h":false},{"t":"어둠이 깊을수록 이 한 구절이 환해집니다.","s":1317.312,"e":1320.365,"p":true,"h":false},{"t":"먼저 \"하나님의 의\"가 무엇인지 짚어야 합니다.","s":1321.272,"e":1324.637,"p":false,"h":false},{"t":"우리는 의라고 하면 하나님이 가지신 공의로운 성품이라고만 생각하기 쉽습니다.","s":1325.304,"e":1330.459,"p":false,"h":false},{"t":"물론 그 뜻이 들어 있습니다.","s":1331.1,"e":1333.296,"p":false,"h":false},{"t":"그러나 이 맥락에서 바울이 더 강조하는 것은, 하나님이 죄인에게 주시는 의로운 신분, 곧 하나님 앞에서 의롭다고 인정받는 자리입니다.","s":1333.584,"e":1343.515,"p":false,"h":false},{"t":"하나님의 성품이면서 하나님이 주시는 선물이기도 한 것입니다.","s":1344.168,"e":1348.237,"p":false,"h":false},{"t":"이 두 면이 한 말에 담겨 있다는 점이 이 단락을 듣는 열쇠입니다.","s":1348.776,"e":1353.154,"p":true,"h":false},{"t":"그 의는 어떻게 받습니까.","s":1354.032,"e":1356.016,"p":false,"h":false},{"t":"22절이 답합니다.","s":1356.552,"e":1358.241,"p":false,"h":false},{"t":"곧 예수 그리스도를 믿음으로 말미암아 모든 믿는 자에게 미치는 하나님의 의니 차별이 없느니라.","s":1358.856,"e":1364.912,"p":false,"h":false},{"t":"믿음이라는 말이 처음 정면으로 나오는 대목입니다.","s":1365.588,"e":1368.921,"p":false,"h":false},{"t":"그런데 \"차별이 없다\"는 말이 바로 붙어 있는 것에 주목해야 합니다.","s":1369.224,"e":1373.566,"p":false,"h":false},{"t":"유대인이든 이방인이든, 도덕적인 사람이든 아닌 사람이든 받는 방법이 같다는 것입니다.","s":1374.192,"e":1380.341,"p":false,"h":false},{"t":"2장에서 율법을 가진 자가 받던 특권이 여기서 평평해집니다.","s":1380.996,"e":1385.051,"p":false,"h":false},{"t":"모두가 같은 입구로 들어갑니다.","s":1385.64,"e":1387.892,"p":true,"h":false},{"t":"23절은 차별이 없는 이유를 다시 한 번 짚습니다.","s":1388.772,"e":1392.444,"p":false,"h":false},{"t":"모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니.","s":1393.092,"e":1397.163,"p":false,"h":false},{"t":"3장 20절까지 쓴 긴 진단이 한 문장으로 요약됩니다.","s":1397.772,"e":1401.85,"p":false,"h":false},{"t":"흥미로운 것은 \"이르지 못한다\"는 표현입니다.","s":1402.452,"e":1405.901,"p":false,"h":false},{"t":"우리는 죄라고 하면 어긴 것만 생각하는데, 바울은 하나님이 지으신 사람의 목적이 하나님의 영광에 이르는 것인데 그 목적지에 닿지 못했다고 말합니다.","s":1406.556,"e":1416.441,"p":false,"h":false},{"t":"단순히 규칙을 어긴 것이 아니라 존재의 목적에서 빗나가 있는 것입니다.","s":1417.068,"e":1421.961,"p":false,"h":false},{"t":"이 구분이 중요한 것은, 우리를 구원하시는 것이 규칙 위반의 벌금을 대신 내는 일만이 아니라 빗나간 존재 전체를 회복하시는 일임을 뒤에 가서 보게 되기 때문입니다.","s":1422.576,"e":1433.391,"p":true,"h":false},{"t":"그런데 24절의 첫 구절이 이 모든 것을 뒤집습니다.","s":1434.24,"e":1438.096,"p":false,"h":false},{"t":"그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 말미암아 값없이 의롭다 하심을 얻은 자 되었느니라.","s":1438.704,"e":1446.207,"p":false,"h":false},{"t":"여기에 세 가지 말이 들어 있습니다.","s":1446.876,"e":1449.154,"p":false,"h":false},{"t":"하나씩 보겠습니다.","s":1449.792,"e":1451.285,"p":true,"h":false},{"t":"\"값없이\"는 대가 없이라는 뜻입니다.","s":1452.132,"e":1454.866,"p":false,"h":false},{"t":"은혜의 정의를 외울 때 \"자격 없는 자에게 주어지는 호의\"라고 말하는 그 뜻이 바로 이 말입니다.","s":1455.444,"e":1461.861,"p":false,"h":false},{"t":"그런데 여기서 그 뜻이 구체적으로 보입니다.","s":1462.5,"e":1465.773,"p":false,"h":false},{"t":"우리 쪽에서는 한 푼도 내지 않았습니다.","s":1466.424,"e":1469.146,"p":false,"h":false},{"t":"다만 값이 없었다는 것이 값이 치러지지 않았다는 뜻은 아닙니다.","s":1469.772,"e":1474.354,"p":false,"h":false},{"t":"이 구별이 바로 이 단락의 중심입니다.","s":1474.956,"e":1477.813,"p":true,"h":false},{"t":"\"의롭다 하심\"은 재판정에서 쓰는 말입니다.","s":1478.736,"e":1481.851,"p":false,"h":false},{"t":"죄가 없는 사람으로 만들어 준다는 뜻이 아니라, 재판관이 이 사람을 의롭다고 선언한다는 뜻입니다.","s":1482.444,"e":1489.167,"p":false,"h":false},{"t":"우리 안에 의가 생겨서 의롭다고 불리는 것이 아니라, 하나님이 우리를 의롭다고 선고하시는 것입니다.","s":1489.824,"e":1496.278,"p":false,"h":false},{"t":"이 선언은 법적인 신분을 바꿉니다.","s":1496.952,"e":1499.581,"p":false,"h":false},{"t":"정죄를 받아야 할 자리에서 받아들여지는 자리로 옮겨지는 것입니다.","s":1500.228,"e":1504.557,"p":false,"h":false},{"t":"이 점은 나중에 8장 1절의 \"정죄함이 없다\"를 이해할 때 다시 중요해집니다.","s":1505.232,"e":1510.613,"p":true,"h":false},{"t":"\"속량\"은 대가를 지불하고 값을 치러 풀어 준다는 뜻입니다.","s":1511.496,"e":1515.605,"p":false,"h":false},{"t":"노예 시장에서 몸값을 치르고 노예를 풀어 주는 장면에서 가져온 말입니다.","s":1516.248,"e":1521.17,"p":false,"h":false},{"t":"값없이 받았는데 속량이라는 값을 치르는 말이 들어 있는 것이 이상해 보이지만, 바로 그것이 핵심입니다.","s":1521.792,"e":1528.911,"p":false,"h":false},{"t":"우리는 값없이 받았고, 값은 다른 분이 치르셨습니다.","s":1529.568,"e":1533.733,"p":true,"h":false},{"t":"25절은 그 값을 치른 방식을 말합니다.","s":1534.608,"e":1537.778,"p":false,"h":false},{"t":"하나님이 그를 화목제물로 세우셨으니 곧 그의 피로써 믿음으로 말미암는 것이라.","s":1538.424,"e":1543.957,"p":false,"h":false},{"t":"여기서 \"세우셨다\"는 동사에 귀를 기울여야 합니다.","s":1544.616,"e":1548.382,"p":false,"h":false},{"t":"십자가는 하나님의 의도하지 않은 사고가 아니라 하나님이 미리 세우신 계획이라는 뜻입니다.","s":1548.972,"e":1555.006,"p":false,"h":false},{"t":"그리고 \"화목제물\"이라는 말에는 죄를 덮어 없애는 뜻과 함께, 하나님의 진노를 돌이키는 뜻이 들어 있다고 저는 읽습니다.","s":1555.668,"e":1563.661,"p":false,"h":false},{"t":"로마서가 1장 18절에서 진노로 시작해서 여기에 이르렀다는 흐름을 따라가 보면, 진노의 문제를 푸는 뜻이 이 말에 들어 있다고 읽는 것이 가장 자연스럽기 때문입니다.","s":1564.308,"e":1575.539,"p":false,"h":false},{"t":"그리고 이것은 하나님의 진노를 달래기 위해 사람이 무엇인가를 바친 것이 아닙니다.","s":1576.152,"e":1581.756,"p":false,"h":false},{"t":"하나님이 자기가 세우신 제물로 스스로 진노를 담당하신 것입니다.","s":1582.38,"e":1586.797,"p":false,"h":false},{"t":"이 방향이 이방 종교의 제사와 전혀 다른 점입니다.","s":1587.42,"e":1590.971,"p":true,"h":false},{"t":"그리고 25절 후반부에서 바울은 이 십자가가 무엇을 보이기 위한 것이었는지를 말합니다.","s":1591.848,"e":1598.145,"p":false,"h":false},{"t":"이는 하나님께서 길이 참으시는 중에 전에 지은 죄를 간과하심으로 자기의를 나타내려 하심이라.","s":1598.796,"e":1604.915,"p":false,"h":false},{"t":"이 구절이 어렵지만 중요합니다.","s":1605.492,"e":1607.845,"p":false,"h":false},{"t":"구약 시대 내내 하나님은 죄인들을 즉각 심판하지 않고 참으셨고, 짐승의 제사로 죄를 덮어 주셨습니다.","s":1608.444,"e":1615.624,"p":false,"h":false},{"t":"그런데 이것을 보는 사람은 이런 의문을 품을 수 있습니다.","s":1616.292,"e":1620.321,"p":false,"h":false},{"t":"하나님은 정말 죄를 그냥 넘기시는 분인가.","s":1620.9,"e":1624.083,"p":false,"h":false},{"t":"죄에 대한 정의가 느슨한 분인가.","s":1624.716,"e":1627.022,"p":false,"h":false},{"t":"십자가는 이 의문에 대한 하나님의 답이라는 것입니다.","s":1627.668,"e":1631.174,"p":false,"h":false},{"t":"하나님은 죄를 그냥 넘기신 적이 없고, 그 값을 치를 때가 올 것을 미리 아시고 지나간 죄들을 참고 계셨다는 것입니다.","s":1631.844,"e":1639.874,"p":true,"h":false},{"t":"그리고 26절에서 이 단락 전체가 한 문장으로 닫힙니다.","s":1640.772,"e":1644.953,"p":false,"h":false},{"t":"곧 이때에 자기의를 나타내사 자기도 의로우시며 또한 예수 믿는 자를 의롭다 하려 하심이라.","s":1645.56,"e":1651.65,"p":false,"h":false},{"t":"이 문장이 로마서의 심장이라고 한 이유가 여기에 있습니다.","s":1652.292,"e":1656.295,"p":false,"h":false},{"t":"하나님은 자기도 의로우시고, 동시에 죄인을 의롭다 하십니다.","s":1656.936,"e":1661.487,"p":false,"h":false},{"t":"이 둘이 함께 성립해야 합니다.","s":1662.12,"e":1664.235,"p":false,"h":false},{"t":"죄인을 그냥 풀어 주면 하나님이 의롭지 않게 되고, 의로움을 지키려고 죄인을 벌하면 우리에게 소망이 없습니다.","s":1664.892,"e":1672.597,"p":false,"h":false},{"t":"이 딜레마를 하나님은 어떻게 풀었는가.","s":1673.244,"e":1675.921,"p":false,"h":false},{"t":"십자가에서 의로움이 지켜졌고 그 값이 죄인을 위해 치러졌다는 것이 바울의 답입니다.","s":1676.52,"e":1682.6,"p":false,"h":false},{"t":"우리가 용서받은 것은 하나님이 눈감아 주셨기 때문이 아니라, 하나님의 공의가 다 채워졌기 때문입니다.","s":1683.252,"e":1690.062,"p":true,"h":false},{"t":"우리는 용서를 흔히 하나님이 마음이 넓으셔서 눈감아 주시는 것으로 이해합니다.","s":1690.956,"e":1696.123,"p":false,"h":false},{"t":"그 이해로는 십자가가 필요한 이유를 설명할 수 없습니다.","s":1696.752,"e":1700.72,"p":false,"h":false},{"t":"바울이 보여 주는 용서는 훨씬 더 무겁고 훨씬 더 확실합니다.","s":1701.36,"e":1705.804,"p":false,"h":false},{"t":"죄가 없는 척하는 용서가 아니라, 죄를 정확히 심판하신 위에서의 용서입니다.","s":1706.4,"e":1711.929,"p":false,"h":false},{"t":"그래서 흔들리지 않습니다.","s":1712.592,"e":1714.485,"p":false,"h":false},{"t":"눈감아 주시는 용서라면 하나님의 기분이 바뀔 때 뒤집힐 수 있지만, 값이 치러진 용서는 뒤집히지 않습니다.","s":1714.788,"e":1722.143,"p":false,"h":false},{"t":"그런데 한 가지가 남습니다.","s":1722.78,"e":1724.832,"p":false,"h":false},{"t":"이 값이 정말 다른 분에게서 치러졌다면, 그것이 어떻게 나에게 속한 것이 됩니까.","s":1725.084,"e":1730.669,"p":false,"h":false},{"t":"그리고 이 의가 내가 받아야 하는 것이라면 나는 거기에 무엇을 더해야 합니까.","s":1731.312,"e":1736.428,"p":false,"h":false},{"t":"이 물음은 이어지는 이야기에서 다루겠습니다.","s":1737.072,"e":1740.299,"p":true,"h":false}]},{"title":"4-2. 그 값이 어떻게 내 것이 되는가 (로마서 3장 24절~31절)","audio":"book_2610310944_1.mp3","start":1741.212,"end":2157.372,"dur":416.2,"segs":[{"t":"4-2.","s":1741.212,"e":1742.208,"p":false,"h":false},{"t":"그 값이 어떻게 내 것이 되는가 (로마서 3장 24절~31절)","s":1743.12,"e":1748.2,"p":true,"h":false},{"t":"앞에서 우리는 하나님이 자기도 의로우시면서 죄인을 의롭다 하시는 길을 보았습니다.","s":1748.988,"e":1754.445,"p":false,"h":false},{"t":"십자가에서 값이 치러졌고, 그 값은 다른 분이 치르셨습니다.","s":1755.072,"e":1759.8,"p":false,"h":false},{"t":"그러면 곧바로 이런 물음이 생깁니다.","s":1760.436,"e":1763.203,"p":false,"h":false},{"t":"다른 분이 치른 값이 어떻게 나에게 속한 것이 됩니까.","s":1763.496,"e":1767.011,"p":false,"h":false},{"t":"법정에서 남이 낸 벌금이 내 벌금을 지워 주는 일은 일상에서 쉽게 보지 못합니다.","s":1767.6,"e":1772.758,"p":false,"h":false},{"t":"이 물음을 건너뛰면 은혜는 아름다운 이야기로만 남고 내 이야기가 되지 않습니다.","s":1773.396,"e":1779.2,"p":true,"h":false},{"t":"바울은 그 답을 이미 24절의 짧은 구절 안에 넣어 두었습니다.","s":1780.092,"e":1784.584,"p":false,"h":false},{"t":"그리스도 예수 안에 있는 속량.","s":1785.24,"e":1787.306,"p":false,"h":false},{"t":"이 \"안에\"라는 말이 열쇠입니다.","s":1787.832,"e":1790.249,"p":false,"h":false},{"t":"속량은 그리스도가 홀로 이루신 일로 허공에 떠 있지 않고, 그분 안에 있는 사람에게 속합니다.","s":1790.928,"e":1797.176,"p":false,"h":false},{"t":"바울은 이 책의 뒤쪽, 특히 5장과 6장에서 이 \"안에\"가 무슨 뜻인지를 본격적으로 풀어 줍니다.","s":1797.804,"e":1804.884,"p":false,"h":false},{"t":"한 사람 아담 안에서 모두가 죽었듯이 한 사람 그리스도 안에서 모두가 산다는 것이고, 대표자가 서면 그 대표가 한 일이 그에게 속한 사람들의 일이 된다는 원리입니다.","s":1805.508,"e":1816.768,"p":false,"h":false},{"t":"여기서는 그 문이 열리는 자리까지만 가서 확인해 두겠습니다.","s":1817.424,"e":1821.584,"p":false,"h":false},{"t":"값이 내게 속하는 것은 내가 그 값에 무언가를 보태서가 아니라, 그분 안에 있기 때문입니다.","s":1822.212,"e":1828.457,"p":true,"h":false},{"t":"그렇다면 그분 안에 들어가는 길은 무엇입니까.","s":1829.34,"e":1832.482,"p":false,"h":false},{"t":"22절과 25절과 26절이 같은 말을 반복합니다.","s":1833.048,"e":1837.079,"p":false,"h":false},{"t":"믿음으로.","s":1837.656,"e":1838.559,"p":false,"h":false},{"t":"로마서 3장 21절부터 31절까지 \"믿음\"이라는 말이 줄줄이 나옵니다.","s":1839.564,"e":1845.51,"p":false,"h":false},{"t":"그런데 여기서 믿음이 무엇을 하는지를 정확히 보아야 합니다.","s":1846.152,"e":1850.158,"p":false,"h":false},{"t":"믿음은 의를 만들어 내는 공장이 아니라 의를 받는 손입니다.","s":1850.832,"e":1855.108,"p":false,"h":false},{"t":"22절은 믿음으로 말미암아 \"미치는\" 하나님의 의라고 합니다.","s":1855.728,"e":1860.088,"p":false,"h":false},{"t":"의는 밖에서 와서 내게 미치는 것이지 내 안에서 자라 나오는 것이 아닙니다.","s":1860.732,"e":1865.599,"p":false,"h":false},{"t":"구걸하는 사람이 내민 손이 빵을 만들지 못하는 것과 같습니다.","s":1866.276,"e":1870.469,"p":false,"h":false},{"t":"손은 받을 뿐입니다.","s":1871.1,"e":1872.72,"p":false,"h":false},{"t":"그리고 이 의가 \"나의 의\"가 아니라 \"하나님의 의\"라는 점이 우리의 안전을 만듭니다.","s":1873.26,"e":1879.591,"p":false,"h":false},{"t":"내 안에서 만들어진 의라면 내 상태에 따라 오르내리겠지만, 밖에서 주어진 의는 내 기분이나 내 실패에 따라 흔들리지 않습니다.","s":1880.244,"e":1888.924,"p":true,"h":false},{"t":"이 점을 바울이 더 분명히 쓴 것이 27절입니다.","s":1889.82,"e":1893.585,"p":false,"h":false},{"t":"그런즉 자랑할 데가 어디냐 있을 수 없느니라.","s":1894.248,"e":1897.33,"p":false,"h":false},{"t":"이 구절은 은혜에 대한 모든 설명을 시험하는 시금석입니다.","s":1897.992,"e":1901.83,"p":false,"h":false},{"t":"어떤 설명이 옳은지 알려면 그 설명 위에서 사람이 자랑할 수 있는 자리가 남는지를 보면 됩니다.","s":1902.456,"e":1908.634,"p":false,"h":false},{"t":"만약 구원이 하나님의 도움에 내 노력을 보태서 이루어진다면, 보탠 만큼의 자랑이 남습니다.","s":1909.26,"e":1915.357,"p":false,"h":false},{"t":"만약 믿음이 내가 잘 판단해서 내린 선택이고 그 선택 덕분에 구원받았다면, 그 믿음이 자랑이 됩니다.","s":1915.992,"e":1923.473,"p":false,"h":false},{"t":"바울은 그런 자랑이 들어설 틈을 모두 막습니다.","s":1924.092,"e":1927.421,"p":false,"h":false},{"t":"어떤 법으로 막습니까.","s":1927.98,"e":1929.65,"p":false,"h":false},{"t":"행위의 법이 아니라 믿음의 법이라고 28절은 말합니다.","s":1930.248,"e":1934.415,"p":false,"h":false},{"t":"사람이 의롭다 하심을 얻는 것은 율법의 행위와 상관없이 믿음으로 되는 줄 우리가 인정하노라.","s":1935.036,"e":1941.459,"p":true,"h":false},{"t":"여기서 한 가지를 분명히 해 둡니다.","s":1942.416,"e":1944.794,"p":false,"h":false},{"t":"믿음 자체도 우리가 만들어 낸 것이 아니라 하나님이 주신 선물입니다.","s":1945.368,"e":1949.899,"p":false,"h":false},{"t":"이 점은 이어지는 이야기에서 더 자세히 듣게 되는데, 지금은 이것만 기억해 두시면 됩니다.","s":1950.516,"e":1956.932,"p":false,"h":false},{"t":"믿음마저 하나님이 주셨다면 자랑은 완전히 사라집니다.","s":1957.572,"e":1961.542,"p":false,"h":false},{"t":"반대로 믿음을 내 공로로 쥐고 있으면, 율법의 행위를 내려놓았는데 믿음이라는 이름의 새 행위를 쥐게 되는 셈입니다.","s":1962.18,"e":1969.833,"p":false,"h":false},{"t":"이 함정은 우리가 모르는 사이에 빠지기 쉬워서, 다음에 아브라함의 이야기로 들여다보겠습니다.","s":1970.496,"e":1976.955,"p":true,"h":false},{"t":"29절과 30절은 이 가르침이 가져오는 또 하나의 결과를 말합니다.","s":1977.876,"e":1983.055,"p":false,"h":false},{"t":"하나님은 유대인만의 하나님이시냐 이방인의 하나님도 되시지 아니하냐.","s":1983.636,"e":1988.205,"p":false,"h":false},{"t":"하나님이 한 분이시라면 사람을 의롭게 하시는 길도 하나여야 합니다.","s":1988.82,"e":1993.213,"p":false,"h":false},{"t":"바울은 여기서 가장 기본적인 신앙고백, 곧 하나님은 한 분이시라는 고백을 논증의 근거로 가져옵니다.","s":1993.824,"e":2001.146,"p":false,"h":false},{"t":"한 분 하나님이 두 가지 구원의 길을 두실 수는 없다는 것입니다.","s":2001.816,"e":2006.02,"p":false,"h":false},{"t":"이 한 길이 유대인과 이방인, 도덕적인 사람과 그렇지 못한 사람을 같은 입구에 세웁니다.","s":2006.64,"e":2013.03,"p":false,"h":false},{"t":"22절의 \"차별이 없느니라\"가 여기서 다시 확인됩니다.","s":2013.66,"e":2017.842,"p":true,"h":false},{"t":"그런데 31절이 한 가지 염려를 불러일으킵니다.","s":2018.736,"e":2022.22,"p":false,"h":false},{"t":"그러면 우리가 믿음으로 율법을 폐하느냐.","s":2022.84,"e":2025.705,"p":false,"h":false},{"t":"율법의 행위가 아니라 믿음이라면, 율법은 이제 쓸모없는 것이 아닙니까.","s":2026.332,"e":2031.222,"p":false,"h":false},{"t":"이 물음은 아주 자연스러운 오해입니다.","s":2031.84,"e":2034.706,"p":false,"h":false},{"t":"바울은 단호하게 아니라고 하고, 도리어 율법을 굳게 세운다고 합니다.","s":2035.368,"e":2040.246,"p":false,"h":false},{"t":"어떻게 그렇습니까.","s":2040.912,"e":2042.395,"p":false,"h":false},{"t":"제가 듣는 바로는 세 가지 방식으로 율법이 서게 됩니다.","s":2042.964,"e":2046.723,"p":false,"h":false},{"t":"첫째, 율법이 요구한 죄의 값이 십자가에서 실제로 치러졌습니다.","s":2047.356,"e":2052.378,"p":false,"h":false},{"t":"율법을 무시하고 덮어 준 것이 아니라 율법이 요구한 것을 다 채웠으니 율법이 존중된 것입니다.","s":2053.044,"e":2059.716,"p":false,"h":false},{"t":"둘째, 21절이 이미 말했듯이 이 의는 율법과 선지자들이 증언해 온 것입니다.","s":2060.388,"e":2066.473,"p":false,"h":false},{"t":"율법은 처음부터 이 길을 가리키고 있었습니다.","s":2067.156,"e":2070.56,"p":false,"h":false},{"t":"셋째, 이것은 앞으로 8장에서 가장 분명해지는데, 믿는 자 안에서 성령이 일하셔서 율법이 요구하던 것이 이루어지게 하십니다.","s":2071.152,"e":2080.433,"p":false,"h":false},{"t":"율법을 이루는 방식이 달라졌을 뿐 율법이 사라진 것이 아닙니다.","s":2081.088,"e":2085.375,"p":false,"h":false},{"t":"마지막 이 점은 6장과 8장에서 본격적으로 열리므로, 지금은 이렇게 문이 열려 있다는 것만 기억해 두시면 됩니다.","s":2085.984,"e":2093.734,"p":true,"h":false},{"t":"은혜는 내가 \"받는\" 것이지만 내가 \"한\" 것은 아닙니다.","s":2094.66,"e":2098.528,"p":false,"h":false},{"t":"이 두 가지가 한 문장에 함께 있는 것이 은혜의 모양입니다.","s":2099.196,"e":2103.118,"p":false,"h":false},{"t":"받는다는 말만 붙잡고 나면 믿음을 새로운 업적처럼 쥘 수 있고, 내가 하지 않았다는 말만 붙잡고 나면 내 책임이 사라진 것처럼 느낄 수 있습니다.","s":2103.732,"e":2113.561,"p":false,"h":false},{"t":"바울은 양쪽 모두를 막습니다.","s":2114.208,"e":2116.48,"p":false,"h":false},{"t":"값은 그분이 치르셨고, 나는 그분 안에서 받습니다.","s":2117.088,"e":2121.121,"p":false,"h":false},{"t":"그리고 그 받음이 내 삶에서 어떤 모양이 되는가는 6장 이후의 이야기입니다.","s":2121.732,"e":2126.984,"p":true,"h":false},{"t":"그런데 한 가지가 아직 남아 있습니다.","s":2127.852,"e":2130.474,"p":false,"h":false},{"t":"바울은 믿음이 공로가 아니라고 선언했지만, 우리 속에는 여전히 이런 속삭임이 있습니다.","s":2131.128,"e":2137.168,"p":false,"h":false},{"t":"그래도 믿는 것은 내가 하는 일이지 않은가.","s":2137.824,"e":2140.525,"p":false,"h":false},{"t":"믿는 사람과 믿지 않는 사람 사이에는 무엇인가 차이가 있지 않은가.","s":2141.172,"e":2145.685,"p":false,"h":false},{"t":"바울은 이 물음을 피하지 않고, 율법을 가장 사랑한 민족의 조상 아브라함을 불러 증인석에 세웁니다.","s":2146.32,"e":2153.211,"p":false,"h":false},{"t":"4장에서 우리가 만날 이야기입니다.","s":2153.88,"e":2156.475,"p":true,"h":false}]},{"title":"5. 믿음은 내가 이룬 공로가 아닌가 (로마서 4장)","audio":"book_2610310944_1.mp3","start":2157.372,"end":3008.268,"dur":850.9,"segs":[{"t":"5.","s":2157.372,"e":2157.809,"p":false,"h":false},{"t":"믿음은 내가 이룬 공로가 아닌가 (로마서 4장)","s":2159.28,"e":2163.007,"p":true,"h":false},{"t":"바울은 3장 끝에서 믿음으로 의롭다 함을 받는다고 선언했습니다.","s":2163.636,"e":2168.18,"p":false,"h":false},{"t":"그런데 듣는 사람 마음에는 곧바로 이런 속삭임이 올라옵니다.","s":2168.784,"e":2173.28,"p":false,"h":false},{"t":"그래도 믿는 것은 내가 하는 일이지 않은가.","s":2173.896,"e":2176.597,"p":false,"h":false},{"t":"믿는 사람과 안 믿는 사람 사이에는 무언가 차이가 있지 않은가.","s":2177.244,"e":2181.538,"p":false,"h":false},{"t":"바울은 이 물음을 피하지 않습니다.","s":2182.176,"e":2184.792,"p":false,"h":false},{"t":"4장 1절에서 유대인이 가장 존경하는 사람, 곧 조상 아브라함을 증인석에 세웁니다.","s":2185.416,"e":2191.587,"p":true,"h":false},{"t":"아브라함은 행위의 사람으로 알려져 있었습니다.","s":2192.508,"e":2195.577,"p":false,"h":false},{"t":"그는 하나님이 말씀하시면 고향을 떠났고, 외아들을 바치라 하셔도 순종하려 했습니다.","s":2196.216,"e":2201.921,"p":false,"h":false},{"t":"만약 누군가 행위로 의롭다 함을 받을 수 있다면 아브라함이 그 사람일 것입니다.","s":2202.516,"e":2207.845,"p":false,"h":false},{"t":"바울은 그래서 2절에서 말합니다.","s":2208.492,"e":2210.952,"p":false,"h":false},{"t":"아브라함이 행위로 의롭다 함을 받았다면 자랑할 것이 있겠으나 하나님 앞에서는 없다고.","s":2211.624,"e":2217.448,"p":false,"h":false},{"t":"사람 앞에서는 자랑할 만한 삶이었을지 몰라도, 하나님 앞에서는 한 줄도 내세울 수 없었다는 말입니다.","s":2218.104,"e":2225.023,"p":true,"h":false},{"t":"그러면 성경은 아브라함에 대해 무엇이라 말합니까.","s":2225.952,"e":2229.218,"p":false,"h":false},{"t":"3절입니다.","s":2229.84,"e":2230.891,"p":false,"h":false},{"t":"아브라함이 하나님을 믿으매 그것을 그에게 의로 여기셨다.","s":2231.748,"e":2235.744,"p":false,"h":false},{"t":"바울은 창세기 15장의 이 한 구절을 이 장 전체의 기둥으로 삼습니다.","s":2236.032,"e":2241.087,"p":false,"h":false},{"t":"이 구절에서 가장 조심해서 들어야 할 말은 \"여기셨다\"입니다.","s":2241.72,"e":2246.131,"p":false,"h":false},{"t":"이 말은 원래 회계에서 쓰는 말로, 장부에 어떤 금액을 계산해 올려 준다는 뜻입니다.","s":2246.76,"e":2252.618,"p":false,"h":false},{"t":"하나님이 아브라함의 장부에 의를 올려 주셨다는 것입니다.","s":2253.24,"e":2256.984,"p":false,"h":false},{"t":"그런데 어디서 올려 주셨습니까.","s":2257.632,"e":2259.843,"p":false,"h":false},{"t":"아브라함이 의로웠기 때문이 아닙니다.","s":2260.188,"e":2262.793,"p":false,"h":false},{"t":"아브라함의 믿음이라는 행위가 훌륭해서 그 대가로 의를 얹어 주신 것도 아닙니다.","s":2263.356,"e":2268.774,"p":false,"h":false},{"t":"그렇다면 믿음이 또 하나의 공로가 될 뿐입니다.","s":2269.404,"e":2272.681,"p":false,"h":false},{"t":"바울은 4절과 5절에서 이 오해를 정확히 막습니다.","s":2273.292,"e":2277.046,"p":true,"h":false},{"t":"일하는 자에게는 품삯이 은혜로 여겨지지 않고 빚으로 여겨집니다.","s":2277.828,"e":2282.57,"p":false,"h":false},{"t":"한 달을 일한 사람이 월급을 받는 것은 은혜가 아니라 받아야 할 몫입니다.","s":2283.156,"e":2287.584,"p":false,"h":false},{"t":"그런데 5절은 이렇게 말합니다.","s":2288.16,"e":2290.492,"p":false,"h":false},{"t":"일을 아니할지라도 경건하지 아니한 자를 의롭다 하시는 이를 믿는 자에게는 그의 믿음을 의로 여기시나니.","s":2291.112,"e":2297.669,"p":false,"h":false},{"t":"이 구절에는 충격적인 말이 들어 있습니다.","s":2298.132,"e":2300.979,"p":false,"h":false},{"t":"하나님은 \"경건하지 아니한 자를 의롭다 하시는 분\"이라는 것입니다.","s":2301.588,"e":2305.92,"p":false,"h":false},{"t":"우리가 평생 들어 온 하나님은 경건한 사람을 의롭게 인정하시는 분인데, 바울은 하나님이 경건하지 않은 사람을 의롭다 하시는 분이라고 말합니다.","s":2306.52,"e":2315.866,"p":false,"h":false},{"t":"이것이 은혜의 정의가 실제로 어떤 모습인지를 보여 줍니다.","s":2316.204,"e":2320.163,"p":false,"h":false},{"t":"자격 없는 자에게 주어지는 호의라고 외웠던 그 말이 여기서 살아 움직입니다.","s":2320.776,"e":2325.699,"p":false,"h":false},{"t":"자격이 있어서가 아니라 자격이 없는 바로 그 자리의 사람을 하나님이 의롭다 하십니다.","s":2326.356,"e":2331.96,"p":true,"h":false},{"t":"그렇다면 믿음의 자리는 어디입니까.","s":2332.836,"e":2335.431,"p":false,"h":false},{"t":"믿음은 의로움을 만들어 내는 힘이 아니라 하나님이 의롭다 하신다는 선언을 받아들이는 자리입니다.","s":2335.968,"e":2342.194,"p":false,"h":false},{"t":"의의 근거는 내 믿음이 아니라 그리스도이고, 믿음은 그 의가 내게 이르는 통로입니다.","s":2342.808,"e":2349.023,"p":false,"h":false},{"t":"그래서 \"믿음을 의로 여기셨다\"는 말은 믿음이라는 내 행위의 값을 쳐 주셨다는 뜻이 아니라, 그리스도의 의가 믿음으로 말미암아 내 장부에 올려졌다는 뜻으로 들어야 합니다.","s":2349.648,"e":2361.101,"p":true,"h":false},{"t":"6절부터 8절에서 바울은 두 번째 증인으로 다윗을 부릅니다.","s":2361.996,"e":2366.392,"p":false,"h":false},{"t":"다윗은 왕이었으나 간음하고 사람을 죽게 한 죄인이었습니다.","s":2367.036,"e":2371.266,"p":false,"h":false},{"t":"그가 시편 32편에서 노래한 것은 자기의 업적이 아니라 용서입니다.","s":2371.932,"e":2376.697,"p":false,"h":false},{"t":"불법이 사함을 받고 죄가 가려진 자는 복이 있도다.","s":2377.26,"e":2380.851,"p":false,"h":false},{"t":"주께서 죄를 인정하지 아니하실 사람은 복이 있도다.","s":2381.472,"e":2385.055,"p":false,"h":false},{"t":"여기서 \"인정하지 아니하신다\"는 말이 앞의 \"여기셨다\"와 짝을 이루는 같은 계산의 말입니다.","s":2385.684,"e":2392.187,"p":false,"h":false},{"t":"하나님은 장부에 의를 올려 주시기도 하시고, 죄를 장부에 올리지 않으시기도 합니다.","s":2392.848,"e":2398.439,"p":false,"h":false},{"t":"의를 계산해 주시는 것과 죄를 계산하지 않으시는 것은 한 은혜의 두 면입니다.","s":2399.076,"e":2404.482,"p":false,"h":false},{"t":"다윗은 이것을 자기 삶의 밑바닥에서 경험했습니다.","s":2405.052,"e":2408.758,"p":true,"h":false},{"t":"이 대목에서 우리는 한 가지를 기억해 두어야 합니다.","s":2409.66,"e":2413.077,"p":false,"h":false},{"t":"3장에서 우리는 하나님이 자기도 의로우시고 죄인을 의롭다 하시는 길을 보았습니다.","s":2413.692,"e":2419.395,"p":false,"h":false},{"t":"값이 치러졌기 때문에 죄를 계산하지 않으실 수 있다는 것입니다.","s":2420.064,"e":2424.338,"p":false,"h":false},{"t":"4장 전체가 그 값이 내게 속하는 과정을 보여 줍니다.","s":2424.996,"e":2428.587,"p":false,"h":false},{"t":"계산이 바뀌는 근거는 하나님의 선언이지 내 상태의 변화가 아닙니다.","s":2429.244,"e":2433.836,"p":true,"h":false},{"t":"그러면 이 복은 누구에게 속합니까.","s":2434.716,"e":2437.347,"p":false,"h":false},{"t":"9절부터 12절은 유대인을 겨냥한 질문입니다.","s":2437.92,"e":2441.386,"p":false,"h":false},{"t":"이 복이 할례를 받은 사람에게만 해당합니까.","s":2442.024,"e":2444.866,"p":false,"h":false},{"t":"바울은 창세기의 시간표를 짚습니다.","s":2445.516,"e":2448.308,"p":false,"h":false},{"t":"아브라함이 의롭다 여김을 받은 것은 15장이고, 할례를 받은 것은 17장입니다.","s":2448.972,"e":2454.703,"p":false,"h":false},{"t":"의가 먼저였고 할례는 나중이었다는 것입니다.","s":2455.344,"e":2458.571,"p":false,"h":false},{"t":"그러니 할례는 의롭게 만드는 도구가 아니라 이미 받은 의에 찍힌 도장이었습니다.","s":2459.16,"e":2464.742,"p":false,"h":false},{"t":"이것이 11절의 말입니다.","s":2465.424,"e":2467.427,"p":false,"h":false},{"t":"아브라함이 할례의 표를 받은 것은 무할례 때에 있던 믿음의 의를 인친 것이라고.","s":2468.052,"e":2473.19,"p":false,"h":false},{"t":"이 시간표 하나로 바울은 두 가지를 얻습니다.","s":2473.812,"e":2477.142,"p":false,"h":false},{"t":"하나는 의롭다 함이 종교적 의식이나 혈통에서 오지 않는다는 것이고, 다른 하나는 할례를 받지 않은 이방인도 같은 믿음의 길로 아브라함의 자손이 될 수 있다는 것입니다.","s":2477.772,"e":2488.515,"p":false,"h":false},{"t":"아브라함은 한 민족의 조상이기 이전에 믿는 모든 사람의 조상입니다.","s":2489.184,"e":2493.828,"p":true,"h":false},{"t":"13절부터 16절은 그 약속의 성격을 말합니다.","s":2494.728,"e":2498.643,"p":false,"h":false},{"t":"하나님이 아브라함에게 세상의 상속자가 되리라고 약속하셨는데, 그 약속이 율법으로 말미암은 것이라면 믿음은 헛된 것이 되고 약속은 폐하여집니다.","s":2499.192,"e":2509.088,"p":false,"h":false},{"t":"약속이 내 순종에 달려 있다면 약속은 내 실패와 함께 무너집니다.","s":2509.74,"e":2514.543,"p":false,"h":false},{"t":"그래서 16절이 이 장의 핵심을 말합니다.","s":2515.176,"e":2518.209,"p":false,"h":false},{"t":"그러므로 상속자가 되는 것은 믿음으로 되나니 이는 은혜에 속하게 하려 함이라.","s":2518.74,"e":2523.456,"p":false,"h":false},{"t":"믿음은 은혜에 속하기 위한 방식입니다.","s":2524.068,"e":2526.852,"p":false,"h":false},{"t":"믿음은 은혜에 맞게 설계된 문입니다.","s":2527.452,"e":2530.155,"p":false,"h":false},{"t":"행위는 자랑을 남기지만 믿음은 받는 손이라서 자랑할 자리를 남기지 않습니다.","s":2530.728,"e":2536,"p":false,"h":false},{"t":"그리고 16절 후반이 이어서 말합니다.","s":2536.632,"e":2539.336,"p":false,"h":false},{"t":"그래서 약속이 모든 후손에게 굳게 보장된다고.","s":2539.872,"e":2543.22,"p":false,"h":false},{"t":"내 믿음의 힘에 달린 약속이라면 보장될 수 없고, 은혜에 달린 약속이므로 확실합니다.","s":2543.868,"e":2549.71,"p":true,"h":false},{"t":"여기서 한 가지를 더 물어보아야 합니다.","s":2550.6,"e":2553.262,"p":false,"h":false},{"t":"믿음은 내가 한 일이 아닙니까.","s":2553.804,"e":2555.859,"p":false,"h":false},{"t":"어느 날 내가 마음을 정하고 믿기로 결단했으니 적어도 그것만큼은 내 몫이 아닙니까.","s":2556.468,"e":2562.021,"p":false,"h":false},{"t":"구원은 하나님이 주셨지만 받아들이는 결정은 내가 했다고 생각하기 쉽습니다.","s":2562.624,"e":2567.621,"p":true,"h":false},{"t":"바울은 에베소서 2장에서 이렇게 말합니다.","s":2568.528,"e":2571.569,"p":false,"h":false},{"t":"너희가 은혜에 의하여 믿음으로 말미암아 구원을 받았으니, 이것은 너희에게서 난 것이 아니요 하나님의 선물이라.","s":2572.2,"e":2579.483,"p":false,"h":false},{"t":"그러고는 이어서 말합니다.","s":2580.084,"e":2582.048,"p":false,"h":false},{"t":"행위에서 난 것이 아니니, 이는 누구든지 자랑하지 못하게 함이라.","s":2582.676,"e":2587.254,"p":true,"h":false},{"t":"여기서 \"이것\"이 가리키는 말이 믿음 하나인지 구원 전체인지는 문법만으로는 단정하기 어렵습니다.","s":2588.148,"e":2594.795,"p":false,"h":false},{"t":"그러나 문맥은 분명합니다.","s":2595.42,"e":2597.517,"p":false,"h":false},{"t":"바울은 행위가 아니라고 말한 이유를 자랑하지 못하게 하려는 것이라고 밝힙니다.","s":2597.796,"e":2602.594,"p":false,"h":false},{"t":"만약 믿음이 내 결정에서 나온 것이라면, 그 결정 하나만큼은 내가 자랑할 수 있습니다.","s":2603.268,"e":2609.428,"p":false,"h":false},{"t":"나는 어리석지 않아서 믿었다고 말할 수 있기 때문입니다.","s":2610.108,"e":2613.889,"p":false,"h":false},{"t":"자랑할 자리가 단 한 곳이라도 남으면 은혜는 은혜가 아닙니다.","s":2614.536,"e":2618.792,"p":false,"h":false},{"t":"그래서 믿음마저도 하나님의 선물이라고 읽는 것이 이 문맥에 가장 맞습니다.","s":2619.432,"e":2624.567,"p":true,"h":false},{"t":"물론 믿는 것은 내가 믿습니다.","s":2625.408,"e":2627.869,"p":false,"h":false},{"t":"성경은 믿으라고 명령하고, 사람이 믿었다고 말합니다.","s":2628.468,"e":2632.577,"p":false,"h":false},{"t":"다만 그 믿음이 어디서 왔는가를 묻는다면, 성경의 대답은 일관되게 하나님께로 향합니다.","s":2633.22,"e":2639.335,"p":true,"h":false},{"t":"사도행전 16장 14절에서 루디아는 바울의 말을 듣고 있었는데, 주께서 그 마음을 열어 바울의 말을 따르게 하셨다고 합니다.","s":2640.24,"e":2648.719,"p":false,"h":false},{"t":"듣는 귀는 있었지만 마음을 여신 분은 주님이십니다.","s":2649.348,"e":2653.156,"p":false,"h":false},{"t":"빌립보서 1장 29절은 그리스도를 위하여 너희에게 은혜를 주신 것은 다만 그를 믿을 뿐 아니라 또한 그를 위하여 고난도 받게 하려 하심이라고 말합니다.","s":2653.776,"e":2663.856,"p":false,"h":false},{"t":"믿는 것도 고난받는 것도 함께 주어진 은혜입니다.","s":2664.396,"e":2668.177,"p":false,"h":false},{"t":"요한복음 6장 44절에서 예수님은 나를 보내신 아버지께서 이끌지 아니하시면 아무도 내게 올 수 없다고 하셨고, 65절에서는 아버지께서 오게 허락하신 자가 아니면 아무도 내게 올 수 없다고 다시 말씀하십니다.","s":2668.464,"e":2683.154,"p":false,"h":false},{"t":"사도행전 13장 48절은 영생을 주시기로 작정된 사람은 다 믿더라고 기록합니다.","s":2683.8,"e":2689.811,"p":false,"h":false},{"t":"믿은 사람이 먼저 있고 작정이 뒤따른 것이 아니라, 작정된 사람이 믿었다는 순서입니다.","s":2690.424,"e":2696.927,"p":true,"h":false},{"t":"고린도전서 12장 3절은 성령으로 말하지 않고는 누구든지 예수를 주라 할 수 없다고 합니다.","s":2697.804,"e":2703.921,"p":false,"h":false},{"t":"예수님이 주님이시라는 고백도 성령의 일입니다.","s":2704.572,"e":2707.843,"p":false,"h":false},{"t":"베드로가 예수를 그리스도라고 고백했을 때, 예수님은 마태복음 16장 17절에서 이를 네게 알게 한 이는 혈육이 아니요 하늘에 계신 내 아버지시라고 하셨습니다.","s":2708.424,"e":2719.065,"p":false,"h":false},{"t":"요한복음 1장 12절과 13절은 그를 영접한 자들에게 하나님의 자녀가 되는 권세를 주셨다고 하면서, 그들은 혈통이나 육정이나 사람의 뜻으로 난 것이 아니라 오직 하나님께로서 난 자들이라고 합니다.","s":2719.764,"e":2733.311,"p":false,"h":false},{"t":"베드로후서 1장 1절은 성도를 우리와 같은 보배로운 믿음을 받은 자들이라고 부르는데, 믿음을 \"받았다\"고 표현합니다.","s":2733.876,"e":2742.166,"p":false,"h":false},{"t":"히브리서 12장 2절은 예수를 믿음의 주요 또 온전하게 하시는 이라고 부릅니다.","s":2742.84,"e":2748.035,"p":false,"h":false},{"t":"믿음은 그분이 시작하시고 그분이 이루십니다.","s":2748.672,"e":2751.829,"p":false,"h":false},{"t":"고린도전서 4장 7절의 물음은 이 모든 것을 한마디로 모읍니다.","s":2752.416,"e":2756.944,"p":false,"h":false},{"t":"네게 있는 것 중에 받지 아니한 것이 무엇이냐.","s":2757.492,"e":2760.414,"p":false,"h":false},{"t":"네가 받았은즉 어찌하여 받지 아니한 것같이 자랑하느냐.","s":2761.056,"e":2764.637,"p":true,"h":false},{"t":"여러분은 언제, 어떻게 믿게 되었는지 돌이켜 보십시오.","s":2765.52,"e":2769.796,"p":false,"h":false},{"t":"대부분의 사람은 이렇게 말합니다.","s":2770.128,"e":2772.514,"p":false,"h":false},{"t":"내가 어느 날 마음을 정했다기보다, 어느 순간 믿어지게 되었다고.","s":2773.116,"e":2777.866,"p":false,"h":false},{"t":"전에는 들리지 않던 말씀이 들리고, 이해되지 않던 십자가가 이해되고, 의심하던 것이 사실로 받아들여졌습니다.","s":2778.444,"e":2786.323,"p":false,"h":false},{"t":"내가 만든 확신이 아니라 밖에서 안으로 들어온 빛이었습니다.","s":2786.94,"e":2791.255,"p":false,"h":false},{"t":"그리고 그 빛은 흔들리는 날에도 꺼지지 않았습니다.","s":2791.908,"e":2795.525,"p":false,"h":false},{"t":"믿음이 약해진 날에도 하나님을 떠나지 못하고 돌아온 경험이 있다면, 그것은 내가 믿음을 붙들고 있었다기보다 믿음이 나를 붙들고 있었다는 증거입니다.","s":2796.048,"e":2805.884,"p":false,"h":false},{"t":"바울이 말한 대로, 어두운 데 빛이 비치라 하셨던 하나님이 우리 마음에 비추셨기 때문입니다.","s":2806.56,"e":2812.777,"p":false,"h":false},{"t":"이 이야기는 다음 이야기에서 저 자신의 경험으로 다시 듣게 됩니다.","s":2813.436,"e":2818.103,"p":true,"h":false},{"t":"그러므로 아브라함이 믿은 것도 그의 의지력이 아니라, 먼저 말씀하시고 약속하신 하나님께서 그의 마음에 일하셨기 때문입니다.","s":2818.98,"e":2827.856,"p":false,"h":false},{"t":"아브라함은 이것을 자랑하지 않았고, 우리도 자랑할 수 없습니다.","s":2828.52,"e":2833.038,"p":true,"h":false},{"t":"17절부터 22절은 아브라함의 믿음이 어떤 모습이었는지를 그립니다.","s":2833.92,"e":2838.886,"p":false,"h":false},{"t":"이 대목이 앞의 오해를 마지막까지 막아 줍니다.","s":2839.536,"e":2842.793,"p":false,"h":false},{"t":"아브라함은 약 백 세였고 아내 사라의 태는 죽은 것과 같았습니다.","s":2843.424,"e":2847.931,"p":false,"h":false},{"t":"사람의 눈으로는 약속이 이루어질 가능성이 전혀 없었습니다.","s":2848.644,"e":2852.816,"p":false,"h":false},{"t":"그런데 19절과 20절은 그가 자기 몸이 죽은 것 같음을 알면서도 믿음이 약해지지 않았고, 하나님의 약속을 불신앙으로 의심하지 않았다고 말합니다.","s":2853.432,"e":2863.347,"p":false,"h":false},{"t":"여기서 중요한 것은 그의 믿음이 강했다는 사실이 아니라 그 믿음의 대상입니다.","s":2863.872,"e":2869.074,"p":false,"h":false},{"t":"17절이 말합니다.","s":2869.74,"e":2871.293,"p":false,"h":false},{"t":"그가 믿은 하나님은 죽은 자를 살리시며 없는 것을 있는 것같이 부르시는 이라고.","s":2871.9,"e":2877.224,"p":false,"h":false},{"t":"아브라함은 자기 믿음의 힘을 믿은 것이 아니라 하나님의 능력을 믿었습니다.","s":2877.876,"e":2882.738,"p":false,"h":false},{"t":"21절은 그 믿음의 내용을 이렇게 요약합니다.","s":2883.384,"e":2886.924,"p":false,"h":false},{"t":"약속하신 그것을 또한 능히 이루실 줄을 확신하였으니.","s":2887.56,"e":2891.19,"p":true,"h":false},{"t":"이 점이 믿음을 공로로 바꾸려는 마지막 속삭임을 잠재웁니다.","s":2892.06,"e":2896.063,"p":false,"h":false},{"t":"우리는 믿음이 강한 사람과 약한 사람을 나누고 믿음이 강하면 구원도 확실하다고 생각하기 쉽습니다.","s":2896.668,"e":2903.649,"p":false,"h":false},{"t":"그러나 구원의 확실성은 내 믿음의 세기에서 오지 않고 믿음의 대상이신 하나님의 능력에서 옵니다.","s":2904.3,"e":2910.932,"p":false,"h":false},{"t":"믿음이 떨리는 날에도 구원이 흔들리지 않는 이유는 구원이 내 손에 쥔 힘에 달려 있지 않기 때문입니다.","s":2911.536,"e":2917.779,"p":true,"h":false},{"t":"23절부터 25절이 이 장을 마칩니다.","s":2918.628,"e":2922.088,"p":false,"h":false},{"t":"바울은 그것이 아브라함만을 위해 기록된 것이 아니고 우리를 위한 것이라고 말합니다.","s":2922.732,"e":2928.267,"p":false,"h":false},{"t":"그리고 이렇게 끝맺습니다.","s":2928.924,"e":2930.877,"p":false,"h":false},{"t":"예수는 우리 범죄 때문에 내줌이 되고 또한 우리를 의롭게 하시기 위하여 살아나셨느니라.","s":2931.48,"e":2937.234,"p":false,"h":false},{"t":"믿음의 내용이 마지막에 정확히 드러납니다.","s":2937.852,"e":2940.769,"p":false,"h":false},{"t":"우리가 믿는 대상은 우리의 죄를 위해 넘겨지시고 우리를 의롭게 하시려고 살아나신 분입니다.","s":2941.38,"e":2947.752,"p":false,"h":false},{"t":"아브라함이 약속을 믿었다면 우리는 그 약속이 이루어진 분을 믿습니다.","s":2948.4,"e":2953.38,"p":false,"h":false},{"t":"십자가에서 값이 치러졌고 부활로 그것이 받아들여졌다는 선언이 있습니다.","s":2954.016,"e":2959.183,"p":false,"h":false},{"t":"우리의 믿음은 이 선언 위에 서 있습니다.","s":2959.812,"e":2962.681,"p":true,"h":false},{"t":"3장에서 우리는 믿음이 받는 손이라고 했는데, 4장은 그 손이 받는 것이 무엇인지를 보여 줍니다.","s":2963.592,"e":2970.411,"p":false,"h":false},{"t":"경건하지 않은 자를 의롭다 하시는 하나님, 죽은 자를 살리시는 하나님, 우리를 위해 살아나신 그리스도입니다.","s":2971.044,"e":2978.937,"p":false,"h":false},{"t":"믿음은 이분을 바라보는 것이지 믿음 자체를 바라보는 것이 아닙니다.","s":2979.576,"e":2984.345,"p":false,"h":false},{"t":"믿음을 점검하느라 자기 안을 들여다보면 늘 부족해 보이지만, 믿음의 대상을 바라보면 안식이 옵니다.","s":2984.94,"e":2991.603,"p":false,"h":false},{"t":"그런데 한 가지가 아직 이해되지 않은 채 남아 있습니다.","s":2992.14,"e":2995.737,"p":false,"h":false},{"t":"이렇게 값없이 의롭다 하심을 받은 사람은 하나님과 어떤 관계에 서게 됩니까.","s":2996.388,"e":3001.594,"p":false,"h":false},{"t":"아직도 두려움으로 서 있습니까.","s":3002.22,"e":3004.341,"p":false,"h":false},{"t":"5장은 이 물음에서 시작합니다.","s":3004.956,"e":3007.387,"p":true,"h":false}]},{"title":"6. 사랑받을 자격이 생긴 뒤에 사랑받는 것이 아니라면 (로마서 5장 1절~11절)","audio":"book_2610310944_1.mp3","start":3008.268,"end":3479.328,"dur":471.1,"segs":[{"t":"6.","s":3008.268,"e":3008.857,"p":false,"h":false},{"t":"사랑받을 자격이 생긴 뒤에 사랑받는 것이 아니라면 (로마서 5장 1절~11절)","s":3010.176,"e":3015.69,"p":true,"h":false},{"t":"바울은 5장을 \"그러므로\"로 시작합니다.","s":3016.476,"e":3019.369,"p":false,"h":false},{"t":"3장과 4장에서 말한 모든 것을 한데 묶는 말입니다.","s":3020.004,"e":3023.621,"p":false,"h":false},{"t":"우리가 믿음으로 의롭다 하심을 받았으니, 이제 어떻게 된 것입니까.","s":3024.252,"e":3028.931,"p":false,"h":false},{"t":"하나님과 더불어 화평을 누린다고 합니다.","s":3029.58,"e":3032.405,"p":true,"h":false},{"t":"이 말은 1장 18절과 나란히 놓고 들어야 합니다.","s":3032.964,"e":3036.783,"p":false,"h":false},{"t":"로마서는 하나님의 진노로 시작했습니다.","s":3037.428,"e":3040.345,"p":false,"h":false},{"t":"그런데 다섯 장에 이르러 화평이라는 말이 나옵니다.","s":3040.632,"e":3043.999,"p":false,"h":false},{"t":"진노 아래 있던 사람이 화평 가운데 서 있게 되었다는 것입니다.","s":3044.304,"e":3048.596,"p":false,"h":false},{"t":"여기서 화평은 마음이 편안한 느낌을 가리키지 않습니다.","s":3049.236,"e":3053.039,"p":false,"h":false},{"t":"하나님과 나 사이의 관계가 바뀌었다는 사실을 말합니다.","s":3053.664,"e":3057.424,"p":false,"h":false},{"t":"감정은 날마다 오르내리지만 관계는 하나님이 정하신 대로 서 있습니다.","s":3058.056,"e":3062.937,"p":false,"h":false},{"t":"불안한 날에도 화평은 거기 있습니다.","s":3063.492,"e":3065.933,"p":false,"h":false},{"t":"내가 느끼지 못하는 날에도 그렇습니다.","s":3066.48,"e":3069.111,"p":true,"h":false},{"t":"바울은 이어서 우리가 이 은혜 안에 \"서 있다\"고 말합니다.","s":3069.936,"e":3073.803,"p":false,"h":false},{"t":"쓰러지지 않고 서 있다는 그림입니다.","s":3074.472,"e":3077.12,"p":false,"h":false},{"t":"우리는 은혜를 간신히 붙들고 있는 것처럼 생각하기 쉬운데, 바울은 은혜라는 단단한 땅 위에 이미 서 있다고 말합니다.","s":3077.388,"e":3085.17,"p":false,"h":false},{"t":"붙드는 쪽은 내가 아니라 땅입니다.","s":3085.812,"e":3088.34,"p":true,"h":false},{"t":"그런데 이 땅 위에 서 있는 사람이 환난을 만납니다.","s":3089.196,"e":3092.677,"p":false,"h":false},{"t":"3절에서 바울은 놀라운 말을 합니다.","s":3093.228,"e":3095.85,"p":false,"h":false},{"t":"환난 중에도 즐거워한다고 합니다.","s":3096.468,"e":3098.843,"p":false,"h":false},{"t":"고통이 좋아서가 아닙니다.","s":3099.132,"e":3101.173,"p":false,"h":false},{"t":"환난이 인내를 낳고, 인내가 연단된 성품을 낳고, 그것이 소망을 낳는다는 것을 알기 때문입니다.","s":3101.832,"e":3109.151,"p":false,"h":false},{"t":"그리고 그 소망이 부끄럽게 되지 않는 이유가 5절에 있습니다.","s":3109.752,"e":3113.933,"p":false,"h":false},{"t":"하나님의 사랑이 성령으로 말미암아 우리 마음에 부어졌기 때문입니다.","s":3114.504,"e":3119.292,"p":false,"h":false},{"t":"소망의 근거가 내 인내나 성품에 있지 않고, 마음에 부어진 하나님의 사랑에 있습니다.","s":3119.904,"e":3125.746,"p":false,"h":false},{"t":"부어졌다는 말은 밖에서 안으로 쏟아져 들어왔다는 뜻입니다.","s":3126.384,"e":3130.443,"p":false,"h":false},{"t":"내가 길어 올린 것이 아니라 부어 주신 것입니다.","s":3131.1,"e":3134.229,"p":true,"h":false},{"t":"그러면 그 사랑은 어떻게 알 수 있습니까.","s":3135.132,"e":3137.888,"p":false,"h":false},{"t":"바울은 6절에서 8절까지 세 걸음으로 보여 줍니다.","s":3138.444,"e":3142.04,"p":false,"h":false},{"t":"첫 번째는 \"우리가 아직 연약할 때\"입니다.","s":3142.62,"e":3145.723,"p":false,"h":false},{"t":"연약하다는 것은 스스로를 구할 힘이 없다는 뜻입니다.","s":3146.364,"e":3150.07,"p":false,"h":false},{"t":"두 번째는 \"경건하지 않은 자를 위하여\"입니다.","s":3150.684,"e":3153.953,"p":false,"h":false},{"t":"힘만 없는 것이 아니라 하나님을 존중하지도 않던 사람들입니다.","s":3154.608,"e":3158.836,"p":false,"h":false},{"t":"세 번째는 \"우리가 아직 죄인 되었을 때\"입니다.","s":3159.468,"e":3163.056,"p":false,"h":false},{"t":"죄를 지은 사람들, 정죄받아 마땅한 사람들입니다.","s":3163.68,"e":3167.648,"p":true,"h":false},{"t":"바울은 여기서 잠시 사람의 세상을 돌아봅니다.","s":3168.54,"e":3171.857,"p":false,"h":false},{"t":"의로운 사람을 위해서도 죽는 자가 드물고, 선한 사람을 위해서라면 용감히 죽는 자가 혹 있을 것입니다.","s":3172.5,"e":3179.528,"p":false,"h":false},{"t":"사람의 사랑은 대개 사랑할 만한 사람을 향합니다.","s":3180.168,"e":3183.476,"p":false,"h":false},{"t":"그런데 그리스도는 반대로 오셨습니다.","s":3184.128,"e":3186.922,"p":false,"h":false},{"t":"연약한 자, 경건하지 않은 자, 죄인을 위해 죽으셨습니다.","s":3187.224,"e":3192.34,"p":false,"h":false},{"t":"8절은 그래서 말합니다.","s":3192.984,"e":3194.901,"p":false,"h":false},{"t":"하나님이 우리에 대한 자기의 사랑을 확증하셨다고.","s":3195.432,"e":3198.52,"p":false,"h":false},{"t":"우리가 사랑스러워져서가 아니라, 우리가 사랑받을 만한 구석이 하나도 없던 때에 확증하셨습니다.","s":3199.068,"e":3205.4,"p":true,"h":false},{"t":"우리는 마음 깊은 곳에서 이런 생각을 놓지 못합니다.","s":3206.304,"e":3209.975,"p":false,"h":false},{"t":"내가 좀 더 나아지면, 좀 더 순종하면, 하나님이 나를 더 사랑하시겠지.","s":3210.552,"e":3215.902,"p":false,"h":false},{"t":"바울은 이 생각이 뿌리째 틀렸다고 말합니다.","s":3216.456,"e":3219.573,"p":false,"h":false},{"t":"하나님의 사랑은 우리가 나아진 뒤에 온 것이 아니라 가장 나쁜 자리에서 먼저 왔습니다.","s":3220.2,"e":3225.691,"p":false,"h":false},{"t":"그러니 나아진 것이 사랑의 조건이 될 수 없고, 나빠진 것이 사랑을 거둘 이유도 될 수 없습니다.","s":3226.284,"e":3232.965,"p":false,"h":false},{"t":"이미 가장 나쁜 때에 사랑받았기 때문입니다.","s":3233.628,"e":3236.763,"p":true,"h":false},{"t":"9절과 10절은 이 사랑에 대한 확신을 한 걸음 더 나아가게 합니다.","s":3237.624,"e":3241.969,"p":false,"h":false},{"t":"바울은 \"더욱\"이라는 말을 두 번 씁니다.","s":3242.592,"e":3245.434,"p":false,"h":false},{"t":"그리스도의 피로 의롭다 하심을 받은 우리가 그로 말미암아 진노하심에서 구원을 받을 것이 \"더욱\" 확실하다고 합니다.","s":3246.084,"e":3253.693,"p":false,"h":false},{"t":"또 우리가 원수 되었을 때에 그의 아들의 죽으심으로 하나님과 화목되었은즉, 화목된 자로서 그의 살아나심으로 구원을 받을 것이 \"더욱\" 확실하다고 합니다.","s":3254.328,"e":3264.881,"p":true,"h":false},{"t":"논리는 이렇습니다.","s":3265.776,"e":3267.344,"p":false,"h":false},{"t":"원수였을 때 하나님은 가장 어려운 일을 하셨습니다.","s":3267.864,"e":3271.494,"p":false,"h":false},{"t":"아들을 내어 주셨습니다.","s":3272.148,"e":3273.852,"p":false,"h":false},{"t":"그렇다면 이제 화목하게 된 자녀를 끝까지 구원하시는 일은 그보다 쉬운 일입니다.","s":3274.488,"e":3280.094,"p":false,"h":false},{"t":"가장 어려운 것을 이미 하신 분이 쉬운 것을 하지 않으실 리 없습니다.","s":3280.716,"e":3285.125,"p":false,"h":false},{"t":"이 논리가 구원의 확신을 받치는 한 기둥입니다.","s":3285.792,"e":3289.034,"p":false,"h":false},{"t":"내 믿음의 세기도, 내 순종의 정도도 아닙니다.","s":3289.644,"e":3293.25,"p":false,"h":false},{"t":"하나님이 원수에게 하신 일이 근거입니다.","s":3293.892,"e":3296.621,"p":true,"h":false},{"t":"원수라는 말도 짚어 둡니다.","s":3297.456,"e":3299.515,"p":false,"h":false},{"t":"바울은 우리가 단순히 하나님을 몰랐던 정도가 아니라, 하나님께 맞서 있던 자리에 있었다고 말합니다.","s":3300.048,"e":3306.633,"p":false,"h":false},{"t":"1장에서 본 진리를 막는 자의 모습이 그것입니다.","s":3307.284,"e":3310.728,"p":false,"h":false},{"t":"그런데 그 원수를 위해 하나님이 먼저 손을 내미셨습니다.","s":3311.28,"e":3315.236,"p":false,"h":false},{"t":"화목이 이루어지기 위해 우리가 먼저 화해를 청한 것이 아니라, 하나님이 아들의 죽으심으로 이루셨습니다.","s":3315.744,"e":3322.623,"p":true,"h":false},{"t":"11절이 이 단락의 끝입니다.","s":3323.52,"e":3325.873,"p":false,"h":false},{"t":"그뿐 아니라 우리가 또한 우리 주 예수 그리스도로 말미암아 하나님 안에서 즐거워한다고 합니다.","s":3326.472,"e":3332.392,"p":false,"h":false},{"t":"여기서 즐거움의 대상이 달라진 것에 귀를 기울여 보십시오.","s":3333.06,"e":3336.963,"p":false,"h":false},{"t":"앞에서는 환난 중에 즐거워했고 소망을 즐거워했는데, 이제는 하나님 자신을 즐거워합니다.","s":3337.524,"e":3344.146,"p":false,"h":false},{"t":"하나님이 주시는 것 이전에 하나님 그분이 기쁨이 됩니다.","s":3344.724,"e":3348.433,"p":false,"h":false},{"t":"진노 아래 있던 사람이 하나님을 기뻐하는 사람이 되었습니다.","s":3349.044,"e":3353.037,"p":false,"h":false},{"t":"이것이 로마서가 우리를 데려가는 방향의 하나의 완성입니다.","s":3353.364,"e":3357.236,"p":true,"h":false},{"t":"여기서 잠시 제 이야기를 하나 하겠습니다.","s":3358.116,"e":3361,"p":false,"h":false},{"t":"이 글을 쓰는 저는 청년 시절에 한 부흥회 새벽기도회에서 이 말씀을 처음 제대로 들었습니다.","s":3361.644,"e":3367.886,"p":false,"h":false},{"t":"강사는 하나님이 우리가 하나님을 찾기도 전에 먼저 우리를 사랑하셨고, 우리를 위해 그리스도께서 십자가를 지셨다고 전했습니다.","s":3368.52,"e":3376.801,"p":false,"h":false},{"t":"제가 하나님을 찾기도 전에, 알기도 전에, 부르기도 전에 하나님이 먼저 저를 아셨고 먼저 사랑하셨다는 말이었습니다.","s":3377.412,"e":3385.602,"p":false,"h":false},{"t":"그 말을 처음 들었을 때 저는 매우 놀랐습니다.","s":3386.232,"e":3389.701,"p":true,"h":false},{"t":"설교가 끝나고 각자 통성으로 기도하는 시간에 갑자기 하나님이 나를 사랑하신다는 사실이 강하게 깨달아지기 시작했습니다.","s":3390.588,"e":3398.573,"p":false,"h":false},{"t":"환상을 본 것도 아니고 무슨 소리를 들은 것도 아니었지만, 그 감동을 주체할 수 없었습니다.","s":3399.192,"e":3405.485,"p":false,"h":false},{"t":"하나님이 나를 어마어마하게 사랑하시는데 나는 그 하나님께 너무나 잘못하고 있었다는 사실이 한꺼번에 깨달아졌습니다.","s":3406.14,"e":3413.655,"p":false,"h":false},{"t":"저는 그 감동을 이기지 못하고 엄청나게 울었습니다.","s":3414.276,"e":3417.98,"p":false,"h":false},{"t":"새벽에 시작한 기도가 한낮이 되도록 이어졌습니다.","s":3418.632,"e":3422.134,"p":false,"h":false},{"t":"그리고 하나님이 나를 사랑하신다는 사실이 믿어졌습니다.","s":3422.736,"e":3426.517,"p":true,"h":false},{"t":"돌이켜 보면 저는 그날 믿기로 결심하지 않았습니다.","s":3427.092,"e":3430.844,"p":false,"h":false},{"t":"믿어졌습니다.","s":3431.484,"e":3432.74,"p":false,"h":false},{"t":"제가 하나님을 찾아 나선 것이 아니라 이미 와 계신 사랑이 저를 붙드셨습니다.","s":3433.392,"e":3438.702,"p":false,"h":false},{"t":"바울이 말하는 하나님의 사랑이 부어졌다는 말이 제게는 문자 그대로의 경험이었습니다.","s":3439.368,"e":3444.877,"p":true,"h":false},{"t":"여기서 잠시 멈춰 서서 자기 자신에게 묻게 됩니다.","s":3445.776,"e":3449.307,"p":false,"h":false},{"t":"나는 하나님이 나를 사랑하시는 이유를 어디서 찾고 있습니까.","s":3449.952,"e":3453.84,"p":false,"h":false},{"t":"내가 한 일에서 찾고 있습니까, 아니면 내가 가장 연약하고 가장 경건하지 않았을 때에 하나님이 이미 내어 주신 아들에게서 찾고 있습니까.","s":3454.416,"e":3463.32,"p":false,"h":false},{"t":"기도하는 자리에서 한 번 이렇게 말씀드려 보면 좋겠습니다.","s":3463.884,"e":3467.919,"p":false,"h":false},{"t":"주님, 내가 사랑스러워서가 아니라 주님이 먼저 사랑하셨음을 믿습니다.","s":3468.528,"e":3473.641,"p":false,"h":false},{"t":"그 사랑이 내 마음에 부어진 것을 오늘 더 알게 하여 주십시오.","s":3474.288,"e":3478.574,"p":true,"h":false}]},{"title":"7. 한 사람으로 모두가 죽고 한 사람으로 모두가 사는 것은 공정한가 (로마서 5장 12절~21절)","audio":"book_2610310944_1.mp3","start":3479.328,"end":3951.648,"dur":472.3,"segs":[{"t":"7.","s":3479.328,"e":3479.999,"p":false,"h":false},{"t":"한 사람으로 모두가 죽고 한 사람으로 모두가 사는 것은 공정한가 (로마서 5장 12절~21절)","s":3481.236,"e":3488.165,"p":true,"h":false},{"t":"5장 11절까지는 우리가 하나님과 화목하게 되었다는 이야기였습니다.","s":3488.904,"e":3493.713,"p":false,"h":false},{"t":"그런데 12절에서 바울은 갑자기 아담의 이야기를 꺼냅니다.","s":3494.376,"e":3498.592,"p":false,"h":false},{"t":"한 사람으로 말미암아 죄가 세상에 들어오고, 죄로 말미암아 사망이 들어왔다고 합니다.","s":3499.236,"e":3505.055,"p":false,"h":false},{"t":"이 문장은 \"그러므로\"로 시작합니다.","s":3505.68,"e":3508.411,"p":false,"h":false},{"t":"우리가 받은 화평과 구원을 설명하려면 거슬러 올라가야 한다는 말입니다.","s":3509.028,"e":3513.806,"p":false,"h":false},{"t":"우리가 왜 그리스도 안에서 구원받을 수 있는지를 이해하려면, 먼저 왜 우리가 한 사람 안에서 무너졌는지를 알아야 한다는 것입니다.","s":3514.428,"e":3522.445,"p":true,"h":false},{"t":"12절은 사망이 모든 사람에게 이르렀다고 하고, 그 이유를 모든 사람이 죄를 범했기 때문이라고 합니다.","s":3523.356,"e":3530.491,"p":false,"h":false},{"t":"우리는 이 말을 가볍게 지나가기 쉽습니다.","s":3531.132,"e":3534.191,"p":false,"h":false},{"t":"그런데 바울은 이 말을 풀어서 13절과 14절에서 이상한 사실 하나를 짚습니다.","s":3534.804,"e":3540.509,"p":false,"h":false},{"t":"모세의 율법이 주어지기 전에도 세상에는 죄가 있었고, 아담부터 모세까지 사망이 왕 노릇을 했다고 합니다.","s":3541.176,"e":3548.76,"p":false,"h":false},{"t":"더 주목할 것은 아담처럼 명령을 직접 어기지 않은 사람들도 죽었다는 사실입니다.","s":3549.384,"e":3555.074,"p":false,"h":false},{"t":"어린아이도 죽고, 율법을 한 번도 받아 보지 못한 사람도 죽었습니다.","s":3555.756,"e":3560.696,"p":false,"h":false},{"t":"이들이 죽은 것은 자기가 어긴 율법 때문이 아닙니다.","s":3561.336,"e":3564.955,"p":false,"h":false},{"t":"그렇다면 무엇 때문입니까.","s":3565.584,"e":3567.588,"p":false,"h":false},{"t":"바울의 답은 한 사람 아담의 범죄입니다.","s":3567.888,"e":3570.83,"p":false,"h":false},{"t":"사망은 개인의 범죄 기록을 따라 오는 것이 아니라, 한 사람 안에서 모두가 함께 떨어진 결과라는 것입니다.","s":3571.488,"e":3578.38,"p":true,"h":false},{"t":"그런데 14절 끝에서 바울은 중요한 말을 합니다.","s":3579.264,"e":3582.795,"p":false,"h":false},{"t":"아담은 장차 오실 자의 모형이라고 합니다.","s":3583.44,"e":3586.359,"p":false,"h":false},{"t":"아담이 어떤 의미에서 그리스도와 짝이 된다는 말입니다.","s":3587.004,"e":3590.637,"p":false,"h":false},{"t":"그리고 15절부터 바울은 이 둘을 나란히 세웁니다.","s":3591.324,"e":3595.265,"p":false,"h":false},{"t":"한 사람의 범죄로 많은 사람이 죽었다면, 한 사람 예수 그리스도의 은혜로 말미암은 선물은 더욱 많은 사람에게 넘쳤다고 합니다.","s":3595.896,"e":3604.305,"p":false,"h":false},{"t":"이 \"더욱\"이라는 말이 이 단락을 듣는 열쇠입니다.","s":3604.932,"e":3608.525,"p":false,"h":false},{"t":"둘이 같은 구조이지만 같은 크기가 아닙니다.","s":3609.18,"e":3612.163,"p":false,"h":false},{"t":"범죄는 정죄에 이르게 했지만 은사는 많은 범죄를 거쳐 의롭다 하심에 이릅니다.","s":3612.816,"e":3618.462,"p":false,"h":false},{"t":"사망이 한 사람으로 말미암아 왕 노릇 했다면 은혜와 의의 선물을 넘치게 받는 자들은 한 사람 예수 그리스도로 말미암아 생명 안에서 왕 노릇 할 것이라고 합니다.","s":3619.08,"e":3629.397,"p":false,"h":false},{"t":"죽음이 왕이던 자리에서 우리가 왕이 되는 자리로 옮겨졌다는 말입니다.","s":3630.024,"e":3634.753,"p":true,"h":false},{"t":"여기서 이성이 저항합니다.","s":3635.676,"e":3637.691,"p":false,"h":false},{"t":"아담이 지은 죄를 내가 왜 책임져야 합니까.","s":3638.34,"e":3641.225,"p":false,"h":false},{"t":"나는 거기 있지도 않았는데, 이것은 공정하지 않다고 생각합니다.","s":3641.868,"e":3646.783,"p":false,"h":false},{"t":"이 항의는 진지하게 받아들여야 합니다.","s":3647.412,"e":3650.055,"p":false,"h":false},{"t":"바울도 이 항의가 나올 것을 알고 있었습니다.","s":3650.652,"e":3653.784,"p":true,"h":false},{"t":"그런데 이 항의를 끝까지 따라가 보면 놀라운 일이 일어납니다.","s":3654.72,"e":3658.973,"p":false,"h":false},{"t":"대표 원리가 불공정하다면, 우리가 그리스도 안에서 구원받은 것도 불공정합니다.","s":3659.616,"e":3665.481,"p":false,"h":false},{"t":"두 일은 같은 구조로 되어 있습니다.","s":3666.132,"e":3668.511,"p":false,"h":false},{"t":"아담이 우리의 대표로 서서 실패했고 그 결과가 우리에게 돌아왔다면, 그리스도가 우리의 대표로 서서 순종하셨고 그 결과가 우리에게 돌아온 것입니다.","s":3669.084,"e":3679.903,"p":false,"h":false},{"t":"우리가 한 일이 아니라 대표가 한 일이 우리의 일로 계산된다는 점에서 둘은 똑같습니다.","s":3680.568,"e":3686.31,"p":false,"h":false},{"t":"그러니 아담의 대표를 거부하면서 그리스도의 대표만 받아들일 수는 없습니다.","s":3686.94,"e":3692.23,"p":false,"h":false},{"t":"만약 내가 스스로의 행위만으로 서야 한다면, 나는 3장에서 이미 입이 막힌 사람입니다.","s":3692.808,"e":3699,"p":false,"h":false},{"t":"그러니 이 원리는 우리를 억울하게 하는 원리가 아니라, 우리가 구원받을 수 있는 유일한 길을 열어 주는 원리입니다.","s":3699.648,"e":3707.451,"p":false,"h":false},{"t":"내가 스스로 서야 했다면 소망이 없었지만, 대표가 서 주신다면 소망이 있습니다.","s":3708.108,"e":3713.617,"p":true,"h":false},{"t":"이 원리가 우리에게 전혀 낯선 것도 아닙니다.","s":3714.48,"e":3717.724,"p":false,"h":false},{"t":"우리는 한 나라의 대통령이 선언한 전쟁에 국민 모두가 들어가는 것을 이상하다고 하지 않습니다.","s":3718.368,"e":3724.224,"p":false,"h":false},{"t":"부모가 지은 빚이 자녀의 삶을 짓누르는 것도 압니다.","s":3724.812,"e":3728.343,"p":false,"h":false},{"t":"대표는 우리가 선택하지 않았지만 우리를 대신해 서고, 그의 행위가 우리의 운명이 됩니다.","s":3728.988,"e":3735.293,"p":false,"h":false},{"t":"아담은 그런 자리에 서 있었습니다.","s":3735.936,"e":3738.355,"p":false,"h":false},{"t":"그리고 아담은 우리보다 더 나쁜 사람이 아니었습니다.","s":3738.996,"e":3742.798,"p":false,"h":false},{"t":"죄가 없는 환경에서, 하나님과 직접 대화하는 자리에서, 단 하나의 금지만 있는 곳에서 시험을 받았습니다.","s":3743.46,"e":3750.964,"p":false,"h":false},{"t":"그런 자리에서도 무너졌다면 우리가 거기 서 있었다고 해서 다르게 했으리라고 장담할 수 있겠습니까.","s":3751.596,"e":3757.928,"p":true,"h":false},{"t":"그리고 한 가지를 덧붙여야 합니다.","s":3758.832,"e":3761.225,"p":false,"h":false},{"t":"이 죄책은 우리에게 밖에서 덮어씌워진 이야기로 끝나지 않습니다.","s":3761.748,"e":3766.329,"p":false,"h":false},{"t":"12절은 모든 사람이 죄를 범했다고 합니다.","s":3766.968,"e":3770.032,"p":false,"h":false},{"t":"우리도 실제로 죄를 짓습니다.","s":3770.568,"e":3772.734,"p":false,"h":false},{"t":"아담 안에서 받은 죄책과 부패한 본성이 우리의 실제 죄로 열매를 맺습니다.","s":3773.376,"e":3778.645,"p":false,"h":false},{"t":"그래서 우리는 억울한 피해자가 아니라, 대표의 실패와 자신의 실제 죄가 겹쳐 있는 자리에 서 있습니다.","s":3779.28,"e":3786.222,"p":false,"h":false},{"t":"그렇기에 3장의 \"모든 입이 막힌다\"는 말이 정확하게 들어맞습니다.","s":3786.876,"e":3791.621,"p":true,"h":false},{"t":"18절과 19절은 이 대비의 절정입니다.","s":3792.492,"e":3795.685,"p":false,"h":false},{"t":"한 범죄로 많은 사람이 죄인 되었듯이 한 사람의 순종으로 많은 사람이 의인이 되리라고 합니다.","s":3796.344,"e":3802.798,"p":false,"h":false},{"t":"여기서 그리스도의 순종이라는 말을 새겨 들어야 합니다.","s":3803.4,"e":3806.742,"p":false,"h":false},{"t":"아담은 불순종으로 우리를 무너뜨렸고, 그리스도는 순종으로 우리를 세우십니다.","s":3807.324,"e":3812.977,"p":false,"h":false},{"t":"그리스도의 순종에는 십자가에서 죽기까지 순종하신 것뿐 아니라, 평생 율법을 온전히 지키신 삶도 들어 있습니다.","s":3813.624,"e":3821.353,"p":false,"h":false},{"t":"그분은 우리가 하지 못한 순종을 우리를 대신해 하셨고, 그 순종이 우리의 것으로 계산됩니다.","s":3822.012,"e":3828.304,"p":false,"h":false},{"t":"그래서 우리는 죄를 용서받은 데서 멈추지 않고, 의롭다고 인정받는 자리까지 올려집니다.","s":3828.924,"e":3835.416,"p":true,"h":false},{"t":"한 가지 조심해서 들어야 할 말이 있습니다.","s":3836.304,"e":3839.046,"p":false,"h":false},{"t":"18절은 \"모든 사람\"이라고 합니다.","s":3839.58,"e":3842.222,"p":false,"h":false},{"t":"이 말은 아담 안에 있는 모든 사람이 정죄를 받았고, 그리스도 안에 있는 모든 사람이 의롭다 하심을 받는다는 뜻으로 들어야 합니다.","s":3842.856,"e":3851.459,"p":false,"h":false},{"t":"17절은 은혜와 의의 선물을 \"받는 자들\"이 생명 안에서 왕 노릇 한다고 말하기 때문입니다.","s":3852.072,"e":3858.002,"p":false,"h":false},{"t":"아담 안에 태어나는 것은 우리가 선택하지 않았지만, 그리스도 안으로 옮겨지는 것은 하나님이 믿음으로 이끄시는 은혜의 일입니다.","s":3858.624,"e":3867.094,"p":true,"h":false},{"t":"마지막으로 20절과 21절이 이 단락을 닫습니다.","s":3867.984,"e":3871.924,"p":false,"h":false},{"t":"율법이 들어온 것은 범죄를 많게 하려는 것이라고 합니다.","s":3872.556,"e":3876.358,"p":false,"h":false},{"t":"율법은 죄를 만든 것이 아니라 드러냈습니다.","s":3877.02,"e":3880.148,"p":false,"h":false},{"t":"어둠 속에 있던 죄가 율법의 빛 아래 선명해졌고, 우리는 우리가 얼마나 죄인인지를 더 정확히 알게 되었습니다.","s":3880.8,"e":3888.581,"p":false,"h":false},{"t":"그런데 이어지는 말이 이 장의 가장 아름다운 문장입니다.","s":3889.224,"e":3893.276,"p":false,"h":false},{"t":"죄가 더한 곳에 은혜가 더욱 넘쳤나니.","s":3893.832,"e":3896.547,"p":false,"h":false},{"t":"죄가 많은 곳이 은혜가 모자란 곳이 아니라 은혜가 더 크게 드러나는 곳이라는 것입니다.","s":3897.18,"e":3902.889,"p":false,"h":false},{"t":"죄가 사망 안에서 왕 노릇 한 것같이 은혜도 의로 말미암아 왕 노릇 하여 영생에 이르게 한다고 합니다.","s":3903.516,"e":3910.372,"p":false,"h":false},{"t":"두 왕이 맞서 있었는데, 은혜가 이겼습니다.","s":3911.04,"e":3914.477,"p":true,"h":false},{"t":"이 단락을 듣고 나서 한 번 이렇게 기도해 보면 좋겠습니다.","s":3915.396,"e":3919.363,"p":false,"h":false},{"t":"주님, 내가 아담 안에서 무너진 자임을 인정합니다.","s":3920.004,"e":3924.044,"p":false,"h":false},{"t":"그리고 내가 한 일이 아니라 한 사람 그리스도께서 이루신 순종 때문에 의롭다 하심을 받았음을 감사합니다.","s":3924.684,"e":3931.857,"p":false,"h":false},{"t":"내 힘으로 서야 했다면 나는 서지 못했을 것입니다.","s":3932.496,"e":3936.002,"p":true,"h":false},{"t":"그런데 이 은혜가 이렇게 크다면, 다음 물음이 자연스럽게 따라옵니다.","s":3936.888,"e":3941.891,"p":false,"h":false},{"t":"은혜가 죄가 더한 곳에 넘친다면, 죄를 더 지어도 되는 것 아닙니까.","s":3942.54,"e":3947.395,"p":false,"h":false},{"t":"6장이 정면으로 이 물음을 받습니다.","s":3948.048,"e":3950.751,"p":true,"h":false}]},{"title":"8. 그렇다면 죄를 더해도 되는가 (로마서 6장)","audio":"book_2610310944_1.mp3","start":3951.648,"end":4556.448,"dur":604.8,"segs":[{"t":"8.","s":3951.648,"e":3952.215,"p":false,"h":false},{"t":"그렇다면 죄를 더해도 되는가 (로마서 6장)","s":3953.556,"e":3957.282,"p":true,"h":false},{"t":"5장은 이렇게 끝났습니다.","s":3958.128,"e":3960.156,"p":false,"h":false},{"t":"죄가 더한 곳에 은혜가 더욱 넘쳤다고.","s":3960.792,"e":3963.549,"p":false,"h":false},{"t":"이 말을 듣고 나면 마음속에 그럴듯한 생각이 하나 올라옵니다.","s":3964.176,"e":3968.57,"p":false,"h":false},{"t":"그렇다면 죄를 더 지을수록 은혜가 더 커지는 것이 아닌가.","s":3969.18,"e":3973.176,"p":false,"h":false},{"t":"바울은 이 물음을 피하지 않고 6장 첫 절에서 먼저 꺼냅니다.","s":3973.824,"e":3978.356,"p":false,"h":false},{"t":"그리고 곧바로 답합니다.","s":3978.972,"e":3980.839,"p":false,"h":false},{"t":"결코 그럴 수 없다고.","s":3981.42,"e":3983.137,"p":true,"h":false},{"t":"이 물음은 은혜를 제대로 들은 사람에게서만 나옵니다.","s":3984.048,"e":3987.608,"p":false,"h":false},{"t":"행위로 구원받는다고 믿는 사람은 이런 물음을 하지 않습니다.","s":3988.224,"e":3992.403,"p":false,"h":false},{"t":"구원이 정말 값없이 주어진다는 말을 알아들었기 때문에, 그렇다면 삶은 어떻게 되는 것이냐는 물음이 생깁니다.","s":3993.012,"e":4000.443,"p":false,"h":false},{"t":"바울은 이 물음을 두려워하지 않았습니다.","s":4001.04,"e":4003.872,"p":false,"h":false},{"t":"이 물음이 나오지 않는 복음이라면 은혜를 충분히 전하지 못한 것이라고 생각했을 것입니다.","s":4004.532,"e":4010.345,"p":true,"h":false},{"t":"그런데 바울의 답은 의외입니다.","s":4011.264,"e":4013.708,"p":false,"h":false},{"t":"그는 \"그러면 조심하라\"고 하지 않습니다.","s":4014.324,"e":4017.347,"p":false,"h":false},{"t":"대신 2절에서 이렇게 묻습니다.","s":4017.96,"e":4020.376,"p":false,"h":false},{"t":"죄에 대하여 죽은 우리가 어찌 그 가운데 더 살리요.","s":4020.948,"e":4024.587,"p":false,"h":false},{"t":"우리는 이미 죄에 대하여 죽은 사람이라는 것입니다.","s":4025.232,"e":4028.585,"p":false,"h":false},{"t":"앞으로 죽어야 할 사람이 아니라, 이미 죽은 사람입니다.","s":4029.192,"e":4033.095,"p":false,"h":false},{"t":"이것이 6장 전체의 출발점입니다.","s":4033.764,"e":4036.446,"p":false,"h":false},{"t":"먼저 우리가 누구인가가 말해지고, 그다음에 어떻게 살 것인가가 말해집니다.","s":4037.076,"e":4042.439,"p":true,"h":false},{"t":"어떻게 죄에 대하여 죽었다는 것입니까.","s":4043.34,"e":4045.966,"p":false,"h":false},{"t":"3절부터 5절이 답합니다.","s":4046.58,"e":4048.661,"p":false,"h":false},{"t":"그리스도 예수와 합하여 세례를 받은 우리가 그의 죽으심에 합하여 세례를 받은 줄을 알지 못하느냐.","s":4048.956,"e":4055.302,"p":false,"h":false},{"t":"5장에서 우리는 한 사람 아담 안에 있던 사람이 한 사람 그리스도 안으로 옮겨졌다는 것을 들었습니다.","s":4055.976,"e":4062.455,"p":false,"h":false},{"t":"6장은 그 \"안에 있다\"는 말이 무슨 뜻인지를 풀어 줍니다.","s":4063.104,"e":4067.051,"p":false,"h":false},{"t":"그리스도 안에 있다는 것은 그분이 하신 일에 함께 들어갔다는 뜻입니다.","s":4067.712,"e":4072.481,"p":false,"h":false},{"t":"그분이 죽으실 때 나도 함께 죽은 것으로 계산되고, 그분이 살아나실 때 나도 함께 새 생명 가운데 살게 된 것으로 계산됩니다.","s":4073.112,"e":4081.671,"p":false,"h":false},{"t":"세례는 이 연합을 눈에 보이게 보여 주는 표지입니다.","s":4082.292,"e":4085.923,"p":false,"h":false},{"t":"물 자체가 사람을 바꾸는 것이 아니라, 그리스도와 하나가 되었다는 사실이 사람을 바꾸고 세례는 그것을 증언합니다.","s":4086.576,"e":4094.078,"p":true,"h":false},{"t":"6절과 7절은 이 일을 더 구체적으로 말합니다.","s":4094.964,"e":4098.46,"p":false,"h":false},{"t":"우리의 옛 사람이 그와 함께 십자가에 못 박혔다고 합니다.","s":4099.104,"e":4102.923,"p":false,"h":false},{"t":"이것은 죄의 몸이 멸하여 우리가 다시 죄에 종노릇하지 않게 하려는 것이라고 합니다.","s":4103.568,"e":4108.921,"p":false,"h":false},{"t":"여기서 정확히 들어야 할 점이 있습니다.","s":4109.544,"e":4112.166,"p":false,"h":false},{"t":"죄가 없어졌다는 말이 아닙니다.","s":4112.748,"e":4115.036,"p":false,"h":false},{"t":"죄가 왕 노릇하던 자리에서 쫓겨났다는 말입니다.","s":4115.664,"e":4119.106,"p":false,"h":false},{"t":"5장에서 죽음이 아담 안에서 왕 노릇 했다고 했는데, 이제 그 왕의 통치에서 풀려난 것입니다.","s":4119.732,"e":4126.097,"p":false,"h":false},{"t":"7절은 죽은 자는 죄에서 벗어났다고 합니다.","s":4126.752,"e":4129.86,"p":false,"h":false},{"t":"죽은 사람은 더 이상 옛 주인의 명령에 응하지 않아도 됩니다.","s":4130.496,"e":4134.442,"p":false,"h":false},{"t":"종이 죽으면 주인은 더 이상 그를 부릴 수 없습니다.","s":4135.068,"e":4138.725,"p":false,"h":false},{"t":"우리의 옛 주인은 우리가 그리스도와 함께 죽었을 때 우리에 대한 권리를 잃었습니다.","s":4139.388,"e":4145.218,"p":true,"h":false},{"t":"8절부터 10절은 이 연합의 반대편을 말합니다.","s":4146.12,"e":4149.667,"p":false,"h":false},{"t":"우리가 그리스도와 함께 죽었으면 또한 그와 함께 살 줄을 믿는다고 합니다.","s":4150.296,"e":4155.561,"p":false,"h":false},{"t":"그리스도께서 죽은 자 가운데서 살아나셨으니 다시 죽지 않으시고 사망이 다시 그를 주장하지 못한다고 합니다.","s":4156.128,"e":4163.538,"p":false,"h":false},{"t":"그분이 죽으신 것은 죄에 대하여 단번에 죽으신 것이고, 그분이 사시는 것은 하나님을 향하여 사시는 것입니다.","s":4164.192,"e":4171.451,"p":false,"h":false},{"t":"그분과 하나 된 우리도 같은 자리에 서 있습니다.","s":4172.112,"e":4175.29,"p":false,"h":false},{"t":"죽음이 끝이 아니라 새 생명이 시작이라는 것입니다.","s":4175.928,"e":4179.322,"p":true,"h":false},{"t":"그리고 11절에서 바울은 처음으로 우리에게 명령합니다.","s":4180.248,"e":4184.167,"p":false,"h":false},{"t":"이와 같이 너희도 너희 자신을 죄에 대하여는 죽은 자요 그리스도 예수 안에서 하나님을 향하여는 산 자로 여길지어다.","s":4184.748,"e":4192.14,"p":false,"h":false},{"t":"여기서 \"여길지어다\"라는 말을 짚어야 합니다.","s":4192.74,"e":4196.18,"p":false,"h":false},{"t":"이 말은 4장에서 하나님이 아브라함의 믿음을 의로 \"여기셨다\"고 할 때 쓴 말과 같은 계산의 말입니다.","s":4196.808,"e":4203.793,"p":false,"h":false},{"t":"하나님이 이미 계산해 주신 장부를 우리도 그대로 받아 적으라는 것입니다.","s":4204.44,"e":4209.327,"p":false,"h":false},{"t":"없는 것을 있다고 상상하라는 말이 아닙니다.","s":4209.912,"e":4213.027,"p":false,"h":false},{"t":"이미 있는 사실을 사실로 받아들이고 그 위에서 생각하라는 말입니다.","s":4213.656,"e":4218.3,"p":true,"h":false},{"t":"바울이 우리에게 시키는 순서는 이렇습니다.","s":4219.2,"e":4222.131,"p":false,"h":false},{"t":"먼저 사실이 있습니다.","s":4222.764,"e":4224.498,"p":false,"h":false},{"t":"너희는 이미 죄에 대하여 죽었고 하나님을 향하여 산 자다.","s":4225.104,"e":4229.132,"p":false,"h":false},{"t":"그다음에 명령이 옵니다.","s":4229.748,"e":4231.556,"p":false,"h":false},{"t":"그러므로 여기라.","s":4231.872,"e":4233.163,"p":false,"h":false},{"t":"그러므로 죄가 너희 죽을 몸에 왕 노릇 하지 못하게 하라.","s":4233.78,"e":4237.407,"p":false,"h":false},{"t":"그러므로 너희 지체를 불의의 무기로 죄에 드리지 말고 산 자같이 하나님께 드려라.","s":4238.064,"e":4243.426,"p":false,"h":false},{"t":"명령은 사실을 만들어 내기 위한 것이 아니라 이미 이루어진 사실 위에서 살아가라는 초대입니다.","s":4244.076,"e":4250.33,"p":false,"h":false},{"t":"이 순서가 뒤집히면 은혜가 아니라 율법이 됩니다.","s":4250.952,"e":4254.583,"p":false,"h":false},{"t":"사실이 아직 만들어지지 않았다고 생각하면, 노력해서 죽어야 하고 노력해서 살아야 합니다.","s":4255.2,"e":4261.406,"p":false,"h":false},{"t":"그러나 바울은 이미 죽었고 이미 살았다고 말하기 때문에 우리의 싸움은 새로 지위를 얻기 위한 싸움이 아니라 이미 얻은 지위에 걸맞게 살아가는 싸움입니다.","s":4262.076,"e":4272.336,"p":true,"h":false},{"t":"그러면 여기서 우리는 정직하게 물어야 합니다.","s":4273.236,"e":4276.49,"p":false,"h":false},{"t":"이미 죄에 대하여 죽었다는데 왜 나는 여전히 죄를 짓습니까.","s":4277.124,"e":4281.387,"p":false,"h":false},{"t":"12절이 이 물음을 이미 예상합니다.","s":4282.02,"e":4284.737,"p":false,"h":false},{"t":"죄가 \"왕 노릇 하지 못하게 하라\"고 합니다.","s":4285.404,"e":4287.991,"p":false,"h":false},{"t":"죄가 아직 우리 안에 살아 있다는 것을 바울도 알고 있습니다.","s":4288.608,"e":4292.535,"p":false,"h":false},{"t":"다만 죄가 왕이 아니라는 것입니다.","s":4293.18,"e":4295.675,"p":false,"h":false},{"t":"왕이 쫓겨난 나라에도 한동안 반란군이 남아 있고 저항이 일어납니다.","s":4296.312,"e":4301.365,"p":false,"h":false},{"t":"그러나 그 나라의 주인은 이미 바뀌었습니다.","s":4302,"e":4305.143,"p":false,"h":false},{"t":"우리에게 남은 죄는 왕이 아니라 패배한 적의 잔당입니다.","s":4305.744,"e":4309.597,"p":false,"h":false},{"t":"이 싸움을 이기는 사람은 새로 왕이 되려고 싸우는 사람이 아니라 이미 왕이신 분의 편에서 싸우는 사람입니다.","s":4310.244,"e":4317.5,"p":false,"h":false},{"t":"이 싸움의 어려움은 7장에서 더 깊이 다루겠습니다.","s":4318.164,"e":4322.008,"p":true,"h":false},{"t":"14절은 이 모든 것의 근거를 한 문장으로 말합니다.","s":4322.88,"e":4326.564,"p":false,"h":false},{"t":"죄가 너희를 주장하지 못하리니 이는 너희가 법 아래 있지 아니하고 은혜 아래 있음이라.","s":4327.164,"e":4332.68,"p":false,"h":false},{"t":"여기서 우리는 처음에 던진 물음의 답을 정면으로 만납니다.","s":4333.356,"e":4337.3,"p":false,"h":false},{"t":"방종은 은혜의 결과가 아니라 은혜를 이해하지 못한 결과입니다.","s":4337.856,"e":4341.975,"p":false,"h":false},{"t":"은혜 아래 있는 사람이 죄를 이기는 이유는 법이 무서워서가 아니라 은혜가 주인이 되었기 때문입니다.","s":4342.572,"e":4348.95,"p":false,"h":false},{"t":"법 아래 있으면 죄가 법을 통해 우리를 더 자극하지만, 은혜 아래 있으면 죄가 우리를 주장하지 못합니다.","s":4349.592,"e":4356.265,"p":true,"h":false},{"t":"15절에서 바울은 같은 물음을 다시 꺼냅니다.","s":4357.152,"e":4360.458,"p":false,"h":false},{"t":"그러면 어떠하냐 우리가 법 아래 있지 아니하고 은혜 아래 있으니 죄를 지을까 보냐.","s":4361.076,"e":4366.347,"p":false,"h":false},{"t":"앞에서는 죄에 대하여 죽었다는 신분으로 답했고, 이번에는 누구의 종이냐는 물음으로 답합니다.","s":4366.98,"e":4373.436,"p":false,"h":false},{"t":"16절은 너희가 누구에게 자신을 종으로 내주면 그 종이 되는 줄 알지 못하느냐 하고 묻습니다.","s":4374.036,"e":4380.041,"p":false,"h":false},{"t":"사람은 주인 없이 사는 존재가 아니라는 것입니다.","s":4380.696,"e":4384.038,"p":false,"h":false},{"t":"죄의 종이든 순종의 종이든 누군가의 종으로 삽니다.","s":4384.62,"e":4388.35,"p":false,"h":false},{"t":"그리고 17절과 18절은 놀라운 감사로 흐릅니다.","s":4388.904,"e":4392.677,"p":false,"h":false},{"t":"너희가 전에는 죄의 종이더니 너희에게 전하여 준 바 교훈의 본을 마음으로 순종하여 죄로부터 해방되어 의에게 종이 되었다고 합니다.","s":4393.296,"e":4401.595,"p":false,"h":false},{"t":"여기서도 순서를 보아야 합니다.","s":4402.224,"e":4404.491,"p":false,"h":false},{"t":"바울은 순종하여 해방된 것이 아니라 해방되어 순종하게 되었다고 말합니다.","s":4404.816,"e":4409.695,"p":false,"h":false},{"t":"순종이 해방의 원인이 아니라 해방의 열매입니다.","s":4410.36,"e":4413.582,"p":true,"h":false},{"t":"19절의 \"종\"이라는 말이 이상하게 들릴 수 있습니다.","s":4414.464,"e":4417.841,"p":false,"h":false},{"t":"은혜는 자유를 주는 것인데 왜 종이라고 하는가.","s":4418.496,"e":4421.927,"p":false,"h":false},{"t":"바울은 사람의 이해를 돕기 위해 일상의 말을 쓴다고 인정합니다.","s":4422.564,"e":4427.179,"p":false,"h":false},{"t":"중요한 것은 주인이 누구냐입니다.","s":4427.46,"e":4430.014,"p":false,"h":false},{"t":"죄를 주인으로 모시던 삶은 부끄러운 열매를 맺고 끝이 사망이었습니다.","s":4430.628,"e":4435.813,"p":false,"h":false},{"t":"의를 주인으로 모시는 삶은 거룩에 이르는 열매를 맺고 끝이 영생입니다.","s":4436.424,"e":4441.558,"p":false,"h":false},{"t":"이것은 자유를 빼앗는 말이 아니라 진짜 자유가 어디 있는지를 말하는 것입니다.","s":4442.148,"e":4447.328,"p":false,"h":false},{"t":"사람은 누구에게도 종이 아닌 자유를 가진 적이 없었고, 그리스도 안에서 비로소 사랑으로 섬기는 자유를 얻었습니다.","s":4447.98,"e":4455.434,"p":true,"h":false},{"t":"이 장의 마지막 절은 로마서에서 가장 많이 외우는 구절 가운데 하나입니다.","s":4456.332,"e":4461.592,"p":false,"h":false},{"t":"죄의 삯은 사망이요 하나님의 은사는 영생이니라.","s":4462.236,"e":4465.659,"p":false,"h":false},{"t":"한쪽은 삯이고 한쪽은 은사라는 말에 귀를 기울여 보십시오.","s":4466.304,"e":4470.385,"p":false,"h":false},{"t":"죄는 일한 만큼 받는 삯을 줍니다.","s":4470.66,"e":4473.35,"p":false,"h":false},{"t":"그러나 영생은 일하지 않은 사람에게 주어지는 선물입니다.","s":4473.9,"e":4477.728,"p":false,"h":false},{"t":"죄를 오래 섬긴 사람은 정확히 그만큼의 삯을 받고, 하나님을 섬기게 된 사람은 일한 것이 아니라 받은 것으로 영생을 얻습니다.","s":4478.328,"e":4486.821,"p":false,"h":false},{"t":"바울은 이 한 문장으로 방종과 율법주의를 함께 막습니다.","s":4487.472,"e":4491.807,"p":false,"h":false},{"t":"방종은 죄의 삯이 사망임을 모르는 것이고, 율법주의는 영생이 선물임을 모르는 것입니다.","s":4492.476,"e":4498.543,"p":true,"h":false},{"t":"그러므로 처음의 물음에 이렇게 답할 수 있습니다.","s":4499.46,"e":4502.713,"p":false,"h":false},{"t":"은혜 아래 있는 사람이 죄를 더 짓고 싶어 하지 않는 이유는 지켜야 할 규칙이 늘어서가 아니라 자기가 누구인지 알기 때문입니다.","s":4503.24,"e":4511.493,"p":false,"h":false},{"t":"나는 이미 죽었고 이미 살았습니다.","s":4512.096,"e":4514.802,"p":false,"h":false},{"t":"내 옛 주인은 쫓겨났고 새 주인이 나를 사셨습니다.","s":4515.408,"e":4519.112,"p":true,"h":false},{"t":"기도하는 자리에서 한 번 이렇게 말씀드려 보면 좋겠습니다.","s":4520.016,"e":4524.051,"p":false,"h":false},{"t":"주님, 내가 죄 아래서 일하던 종이었으나 주님이 나를 사셔서 의의 종이 되게 하셨음을 믿습니다.","s":4524.66,"e":4531.216,"p":false,"h":false},{"t":"오늘 내 손과 발과 입을 주님께 드립니다.","s":4531.824,"e":4534.706,"p":false,"h":false},{"t":"내가 이미 얻은 자유 위에서 살게 하여 주십시오.","s":4535.352,"e":4538.392,"p":true,"h":false},{"t":"그런데 이렇게 새로운 신분을 얻었는데도 우리는 여전히 넘어집니다.","s":4539.204,"e":4543.935,"p":false,"h":false},{"t":"사도 바울도 7장에서 자기 안에서 일어나는 싸움을 숨기지 않고 털어놓습니다.","s":4544.568,"e":4549.36,"p":false,"h":false},{"t":"왜 은혜 아래 있는 사람이 이런 싸움을 겪는가는 이어지는 이야기에서 들어 보겠습니다.","s":4550.004,"e":4555.541,"p":true,"h":false}]},{"title":"9. 율법이 죄인가 (로마서 7장 1절~13절)","audio":"book_2610310944_1.mp3","start":4556.448,"end":5061.708,"dur":505.3,"segs":[{"t":"9.","s":4556.448,"e":4556.991,"p":false,"h":false},{"t":"율법이 죄인가 (로마서 7장 1절~13절)","s":4558.356,"e":4562.301,"p":true,"h":false},{"t":"5장 끝에서 바울은 율법이 들어온 것은 범죄를 많게 하려는 것이라고 했습니다.","s":4563.072,"e":4568.094,"p":false,"h":false},{"t":"6장에서는 우리가 법 아래 있지 않고 은혜 아래 있다고 했습니다.","s":4568.724,"e":4573.196,"p":false,"h":false},{"t":"7장 5절에서는 우리가 육신에 있을 때에는 율법으로 말미암는 죄의 정욕이 우리 지체 속에서 작용하여 사망을 위하여 열매를 맺었다고 합니다.","s":4573.836,"e":4583.419,"p":false,"h":false},{"t":"이 말들을 이어서 들으면 마음에 불편한 생각이 올라옵니다.","s":4584.06,"e":4588.226,"p":false,"h":false},{"t":"율법이 죄를 일으키고 사망에 이르게 했다면, 율법이 죄라는 말입니까.","s":4588.848,"e":4593.711,"p":false,"h":false},{"t":"7장 7절에서 바울은 이 물음을 스스로 꺼내고 곧바로 대답합니다.","s":4594.32,"e":4599.103,"p":false,"h":false},{"t":"결코 아니라고.","s":4599.756,"e":4601.007,"p":true,"h":false},{"t":"그런데 이 대답에 이르기 전에, 바울은 먼저 결혼의 이야기를 꺼냅니다.","s":4601.88,"e":4607.058,"p":false,"h":false},{"t":"1절에서 6절입니다.","s":4607.712,"e":4609.38,"p":false,"h":false},{"t":"아내는 남편이 살아 있는 동안에는 법으로 남편에게 매여 있지만, 남편이 죽으면 그 법에서 풀려납니다.","s":4609.98,"e":4616.786,"p":false,"h":false},{"t":"그러면 다른 남자에게 가도 간음이 아닙니다.","s":4617.432,"e":4620.604,"p":false,"h":false},{"t":"법은 한 번도 바뀌지 않았습니다.","s":4621.212,"e":4623.618,"p":false,"h":false},{"t":"다만 한쪽이 죽었기 때문에 관계가 끝난 것입니다.","s":4624.2,"e":4627.629,"p":true,"h":false},{"t":"바울은 이 그림을 우리에게 그대로 적용합니다.","s":4628.484,"e":4631.827,"p":false,"h":false},{"t":"우리가 그리스도의 몸을 통하여 율법에 대하여 죽임을 당했다고 합니다.","s":4632.48,"e":4637.12,"p":false,"h":false},{"t":"율법이 나빠서 떠난 것이 아닙니다.","s":4637.772,"e":4640.266,"p":false,"h":false},{"t":"율법은 그대로 있고, 우리가 죽었기 때문에 율법의 요구가 우리를 더는 붙잡지 못합니다.","s":4640.94,"e":4647.293,"p":false,"h":false},{"t":"6장에서 우리가 죄에 대하여 죽었다고 했는데, 7장은 율법에 대하여도 죽었다고 말하는 것입니다.","s":4647.96,"e":4654.514,"p":false,"h":false},{"t":"그리고 죽은 것으로 끝나지 않고, 죽은 자 가운데서 살아나신 다른 이에게 속하게 되었다고 합니다.","s":4655.16,"e":4662.013,"p":false,"h":false},{"t":"이는 하나님을 위하여 열매를 맺게 하려는 것입니다.","s":4662.648,"e":4666.365,"p":false,"h":false},{"t":"옛 율법 아래서 우리는 사망을 위한 열매를 맺었는데, 이제는 하나님을 위한 열매를 맺습니다.","s":4667.004,"e":4673.981,"p":false,"h":false},{"t":"그 방식도 달라졌습니다.","s":4674.636,"e":4676.627,"p":false,"h":false},{"t":"6절은 우리가 이제는 율법 조문의 묵은 것으로 섬기지 않고 영의 새로운 것으로 섬긴다고 말합니다.","s":4676.94,"e":4683.331,"p":true,"h":false},{"t":"여기서 한 가지를 놓치면 안 됩니다.","s":4684.212,"e":4686.756,"p":false,"h":false},{"t":"바울은 결혼의 그림에서 새 남편이 누구인지를 분명히 말합니다.","s":4687.308,"e":4691.475,"p":false,"h":false},{"t":"죽은 자 가운데서 살아나신 그리스도입니다.","s":4692.06,"e":4695.241,"p":false,"h":false},{"t":"율법에서 풀려난 우리는 주인 없는 자유로 풀려난 것이 아니라 새 남편에게 간 것입니다.","s":4695.876,"e":4701.595,"p":false,"h":false},{"t":"율법은 요구하고 판단하지만, 그리스도는 사랑하시고 우리 안에 영을 주십니다.","s":4702.248,"e":4707.969,"p":false,"h":false},{"t":"같은 하나님의 뜻이 이제는 밖에서 명령으로 오지 않고 안에서 열매로 맺힙니다.","s":4708.62,"e":4714.056,"p":true,"h":false},{"t":"그러면 율법은 무엇이었습니까.","s":4714.848,"e":4717.191,"p":false,"h":false},{"t":"7절의 물음이 바로 그 물음입니다.","s":4717.8,"e":4720.402,"p":false,"h":false},{"t":"율법이 죄냐.","s":4721.04,"e":4722.122,"p":false,"h":false},{"t":"바울의 답은 율법이 오히려 죄를 알게 했다는 것입니다.","s":4722.948,"e":4726.492,"p":false,"h":false},{"t":"율법이 아니었다면 내가 죄를 알지 못했을 것이라고 합니다.","s":4727.124,"e":4731.244,"p":false,"h":false},{"t":"그리고 한 가지 예를 듭니다.","s":4731.912,"e":4733.932,"p":false,"h":false},{"t":"탐내지 말라 하는 계명입니다.","s":4734.468,"e":4736.588,"p":false,"h":false},{"t":"십계명의 마지막 계명은 행동이 아니라 마음을 다룹니다.","s":4737.24,"e":4740.987,"p":false,"h":false},{"t":"남을 해치지 않고 훔치지 않아도 마음속 탐욕은 눈에 보이지 않습니다.","s":4741.632,"e":4746.385,"p":false,"h":false},{"t":"그런데 \"탐내지 말라\"는 한마디가 그 속을 비춥니다.","s":4746.888,"e":4750.629,"p":false,"h":false},{"t":"사람이 자기 속의 탐욕을 아는 것은 계명이 비추었기 때문입니다.","s":4751.28,"e":4755.52,"p":true,"h":false},{"t":"그런데 8절에서 이상한 일이 일어납니다.","s":4756.284,"e":4759.165,"p":false,"h":false},{"t":"죄가 그 계명으로 말미암아 기회를 타서 내 속에 온갖 탐심을 이루었다고 합니다.","s":4759.776,"e":4764.97,"p":false,"h":false},{"t":"금지하는 말이 오히려 욕망을 일깨운다는 것입니다.","s":4765.608,"e":4769.079,"p":false,"h":false},{"t":"어떤 문 앞에 \"들어가지 마시오\"라는 팻말이 있을 때 그 문이 갑자기 더 궁금해지는 경험이 누구에게나 있습니다.","s":4769.64,"e":4776.932,"p":false,"h":false},{"t":"율법은 죄를 만든 것이 아니라 이미 우리 안에 있던 죄를 일으켜 세웠습니다.","s":4777.56,"e":4782.689,"p":false,"h":false},{"t":"율법이 없을 때는 죄가 죽은 것과 같았다고 바울은 말합니다.","s":4783.32,"e":4787.561,"p":false,"h":false},{"t":"있기는 했지만 아직 정체가 드러나지 않았다는 뜻입니다.","s":4788.216,"e":4792.109,"p":true,"h":false},{"t":"9절과 10절은 바울의 가장 깊은 고백 중 하나입니다.","s":4793.004,"e":4796.851,"p":false,"h":false},{"t":"내가 전에 율법이 없을 때에는 살았더니 계명이 이르매 죄는 살아나고 나는 죽었도다.","s":4797.468,"e":4803.021,"p":false,"h":false},{"t":"우리는 어린 시절을 돌아보면 이해가 됩니다.","s":4803.66,"e":4806.619,"p":false,"h":false},{"t":"어린아이는 자기가 잘못한다는 의식이 없을 때가 있습니다.","s":4807.26,"e":4811.127,"p":false,"h":false},{"t":"그러다 어느 날 \"이것을 하지 마라\"는 말을 정확히 알아듣게 되었을 때 비로소 자기 속의 반항이 보이기 시작합니다.","s":4811.796,"e":4819.202,"p":false,"h":false},{"t":"그때 나는 살아 있다고 생각했는데 사실은 죽어 가고 있었던 것입니다.","s":4819.86,"e":4824.729,"p":false,"h":false},{"t":"이 말은 아담의 이야기와도 닮았습니다.","s":4825.332,"e":4828.089,"p":false,"h":false},{"t":"계명이 왔고, 죄가 살아났고, 속았고, 죽었습니다.","s":4828.752,"e":4833.767,"p":false,"h":false},{"t":"사람이 율법 앞에서 겪는 일은 어느 시대에나 같은 모양을 하고 있습니다.","s":4834.368,"e":4839.108,"p":true,"h":false},{"t":"11절은 죄가 어떻게 일하는지를 밝힙니다.","s":4839.876,"e":4842.891,"p":false,"h":false},{"t":"죄가 계명으로 말미암아 기회를 타서 나를 속이고 그것으로 나를 죽였다고 합니다.","s":4843.404,"e":4848.726,"p":false,"h":false},{"t":"여기서 범인은 계명이 아니라 죄입니다.","s":4849.344,"e":4852.015,"p":false,"h":false},{"t":"에덴동산의 뱀이 \"하나님이 정말 그렇게 말씀하셨느냐\" 하며 하나님의 금지를 도리어 하나님을 의심하는 재료로 썼듯이, 죄는 선한 계명을 도구로 삼아 사람을 속입니다.","s":4852.656,"e":4863.719,"p":false,"h":false},{"t":"칼이 나쁜 것이 아니라 칼을 쓰는 손이 나쁜 것입니다.","s":4864.356,"e":4868.087,"p":false,"h":false},{"t":"율법이 칼처럼 쓰였을 때 칼날 아래 쓰러진 것은 나였지만, 칼을 휘두른 것은 죄였습니다.","s":4868.676,"e":4874.941,"p":true,"h":false},{"t":"그래서 12절이 이 단락의 선언입니다.","s":4875.84,"e":4878.668,"p":false,"h":false},{"t":"그러므로 율법은 거룩하고 계명도 거룩하고 의롭고 선하도다.","s":4879.296,"e":4883.842,"p":false,"h":false},{"t":"바울은 여기서 율법에 대해 세 마디를 쌓습니다.","s":4884.372,"e":4887.7,"p":false,"h":false},{"t":"거룩하고, 의롭고, 선하다.","s":4888.332,"e":4891.634,"p":false,"h":false},{"t":"율법은 하나님에게서 났기 때문에 거룩하고, 하나님의 뜻에 맞기 때문에 의롭고, 사람을 위한 것이기 때문에 선합니다.","s":4892.256,"e":4899.986,"p":false,"h":false},{"t":"우리는 은혜를 높이려다가 율법을 깎아내리는 실수를 하기 쉽습니다.","s":4900.608,"e":4905.206,"p":false,"h":false},{"t":"그러나 바울은 은혜를 말하면서 한 번도 율법을 깎아내리지 않습니다.","s":4905.828,"e":4910.649,"p":false,"h":false},{"t":"율법은 깨끗한 거울이고 잘못은 거울 앞에 선 사람 쪽에 있기 때문입니다.","s":491
