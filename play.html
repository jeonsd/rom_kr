(function () {
  const TITLE = "로마서 해설서", TRACKS = [{"title":"로마서 시작하기 전에","audio":"book_2611040800_1.mp3","start":0,"end":366.516,"dur":366.5,"segs":[{"t":"로마서 시작하기 전에","s":0,"e":1.745,"p":true,"h":false},{"t":"이 해설서는 이렇게 쓰십시오","s":2.484,"e":4.809,"p":true,"h":false},{"t":"이 해설서는 성경 로마서를 대신하는 글이 아닙니다.","s":5.472,"e":9.106,"p":false,"h":false},{"t":"성경을 더 잘 읽게 하려고 만든 글입니다.","s":9.648,"e":12.657,"p":false,"h":false},{"t":"쓰는 방법은 간단합니다.","s":13.176,"e":15.17,"p":false,"h":false},{"t":"해설서 한 장을 듣고, 이어서 성경 로마서 같은 장을 읽거나 유튜브로 들으십시오.","s":15.768,"e":21.72,"p":false,"h":false},{"t":"그리고 다시 다음 장 해설서를 듣고, 다음 장 성경을 읽으십시오.","s":22.212,"e":27.076,"p":false,"h":false},{"t":"이렇게 한 장씩 번갈아 가면 됩니다.","s":27.54,"e":29.973,"p":true,"h":false},{"t":"성경은 정독해야 제 맛이 납니다.","s":30.816,"e":33.369,"p":false,"h":false},{"t":"그런데 잘 모르는 내용이 섞여 있으면, 자꾸 그냥 지나치며 대충 읽게 됩니다.","s":33.984,"e":39.633,"p":false,"h":false},{"t":"해설서는 그 걸리는 곳을 미리 알려 드립니다.","s":40.176,"e":43.493,"p":false,"h":false},{"t":"그러니 성경을 읽다가 모르는 곳이 나와도 지나치지 마시고 붙잡고 읽으십시오.","s":44.028,"e":48.974,"p":false,"h":false},{"t":"해설서에서 들은 표지가 거기 서 있을 것입니다.","s":49.608,"e":52.839,"p":true,"h":false},{"t":"로마서는 어떤 편지인가","s":53.676,"e":55.686,"p":true,"h":false},{"t":"로마서는 바울이 로마에 있는 신자들에게 보낸 편지입니다.","s":56.556,"e":60.475,"p":false,"h":false},{"t":"바울은 고린도에 머물 때 이 편지를 썼다고 읽는 것이 일반적이고, 서기 오십 년대의 일입니다.","s":61.056,"e":67.541,"p":false,"h":false},{"t":"바울은 로마에 가 본 적이 없었습니다.","s":68.184,"e":70.991,"p":false,"h":false},{"t":"그래서 얼굴도 모르는 신자들에게 자기가 전하는 복음이 무엇인지를 처음부터 차근차근 설명한 글이 로마서입니다.","s":71.604,"e":78.851,"p":true,"h":false},{"t":"로마서가 어려운 이유는 세 가지입니다.","s":79.74,"e":82.426,"p":false,"h":false},{"t":"첫째, 이야기가 아니라 논증이기 때문입니다.","s":83.016,"e":86.644,"p":false,"h":false},{"t":"그러므로, 왜냐하면, 그런즉 같은 말로 이어지기 때문에 한 구절을 놓치면 뒤가 이해되지 않습니다.","s":87.264,"e":94.495,"p":false,"h":false},{"t":"둘째, 낯선 낱말이 많기 때문입니다.","s":95.184,"e":98.465,"p":false,"h":false},{"t":"셋째, 질문과 대답이 섞여 있기 때문입니다.","s":99.036,"e":102.689,"p":false,"h":false},{"t":"바울은 가상의 반대자를 세워 놓고 그러면 어떠하냐, 그러면 죄에 머물러도 2,"p":false,"h":false},{"t":"빈손을 내미는 것과 같습니다.","s":1358.748,"e":1360.876,"p":false,"h":false},{"t":"이 점은 4장에서 아브라함을 통해 더 자세히 풀립니다.","s":1361.484,"e":1365.343,"p":true,"h":false},{"t":"3장 24절의 의롭다 하심은 법정의 말입니다.","s":1366.236,"e":1369.753,"p":false,"h":false},{"t":"죄가 없는 사람으로 변했다는 말이 아니라, 하나님이 의롭다고 선언해 주신다는 말입니다.","s":1370.412,"e":1376.306,"p":false,"h":false},{"t":"속량은 노예를 값을 치르고 풀어 주는 일을 가리키는 말입니다.","s":1376.928,"e":1380.868,"p":false,"h":false},{"t":"죄의 종노릇하던 사람을 값을 치르고 풀어 주셨다는 뜻입니다.","s":1381.464,"e":1385.53,"p":true,"h":false},{"t":"3장 25절의 화목제물은 번역을 두고 의견이 갈리는 말입니다.","s":1386.324,"e":1390.796,"p":false,"h":false},{"t":"하나님의 진노를 가라앉히는 제물이라는 뜻으로 읽는 견해가 있고, 죄를 덮어 없애는 제물이라는 뜻으로 읽는 견해가 있으며, 구약의 속죄소를 가리킨다고 읽는 견해도 있습니다.","s":1391.436,"e":1403.089,"p":false,"h":false},{"t":"어느 쪽이든 핵심은 같습니다.","s":1403.604,"e":1405.735,"p":false,"h":false},{"t":"하나님이 직접 세우셨고, 죄 문제가 피로써 해결되었다는 것입니다.","s":1406.376,"e":1411.224,"p":false,"h":false},{"t":"또 하나 중요한 것은, 이 일을 시작하신 분이 하나님이라는 점입니다.","s":1411.848,"e":1416.528,"p":false,"h":false},{"t":"사람이 하나님께 바친 것이 아닙니다.","s":1417.176,"e":1419.784,"p":true,"h":false},{"t":"3장 31절의 율법을 굳게 세운다는 말은, 믿음이 율법을 없애는 것이 아니라 율법이 요구한 것을 그리스도께서 이루셨다는 뜻으로 읽는 견해가 일반적입니다.","s":1420.56,"e":1431.205,"p":true,"h":false},{"t":"이 장을 읽을 때","s":1431.972,"e":1433.375,"p":true,"h":false},{"t":"성경 로마서 3장을 읽으실 때 붙잡을 것은 두 곳입니다.","s":1434.24,"e":1438.256,"p":false,"h":false},{"t":"하나는 1절부터 8절의 문답입니다.","s":1438.92,"e":1441.642,"p":false,"h":false},{"t":"질문하는 사람과 대답하는 바울을 구분하며 읽으십시오.","s":1442.268,"e":1446.104,"p":false,"h":false},{"t":"다른 하나는 21절입니다.","s":1446.624,"e":1448.755,"p":false,"h":false},{"t":"20절까지 읽어 내려가며 마음이 무거워졌다면, 21절에서 그 무게가 한꺼번에 풀리는 것을 느끼며 읽으십시오.","s":1449.324,"e":1457.54,"p":true,"h":false},{"t":"다음 4장에서는 바울이 한 가지 질문을 받습니다.","s":1458.324,"e":1461.696,"p":false,"h":false},{"t":"이것이 새로 생긴 가르침이 아니냐는 질문입니다.","s":1462.356,"e":1465.753,"p":false,"h":false},{"t":"바울은 유대인이 가장 존경하는 조상, 아브라함의 이야기를 가져와 대답합니다.","s":1466.388,"e":1471.932,"p":true,"h":false},{"t":"이제 성경 로마서 3장을 읽으십시오.","s":1472.832,"e":1475.585,"p":true,"h":false}]},{"title":"로마서 4장","audio":"book_2611040800_1.mp3","start":1476.396,"end":1882.008,"dur":405.6,"segs":[{"t":"로마서 4장","s":1476.396,"e":1477.657,"p":true,"h":false},{"t":"전체 흐름","s":1478.484,"e":1479.618,"p":true,"h":false},{"t":"지난 3장에서 바울은 로마서 전체의 열쇠를 열었습니다.","s":1480.5,"e":1484.557,"p":false,"h":false},{"t":"하나님의 의가 율법과 상관없이 나타났고, 그것이 값없이 은혜로, 믿는 모든 사람에게 주어진다고 했습니다.","s":1485.18,"e":1493.346,"p":false,"h":false},{"t":"그리고 사람에게는 자랑할 것이 없다고 했습니다.","s":1494,"e":1497.267,"p":true,"h":false},{"t":"이 말을 들은 유대인은 이렇게 반문할 것입니다.","s":1498.068,"e":1501.362,"p":false,"h":false},{"t":"그것은 우리 조상들이 믿어 온 것과 다른 새로운 가르침이 아닙니까.","s":1501.992,"e":1506.528,"p":false,"h":false},{"t":"우리가 가장 존경하는 조상 아브라함은 어떻습니까.","s":1507.14,"e":1510.446,"p":false,"h":false},{"t":"아브라함은 순종으로 인정받은 사람이 아닙니까.","s":1511.1,"e":1514.183,"p":false,"h":false},{"t":"4장은 이 질문에 대한 대답입니다.","s":1514.772,"e":1517.303,"p":false,"h":false},{"t":"바울은 새로운 가르침이라고 의심하는 사람에게, 가장 오래된 증거를 가져옵니다.","s":1517.976,"e":1523.735,"p":false,"h":false},{"t":"바로 아브라함입니다.","s":1524.348,"e":1526.001,"p":true,"h":false},{"t":"바울은 창세기 15장 6절을 가져옵니다.","s":1526.904,"e":1529.885,"p":false,"h":false},{"t":"아브라함이 하나님을 믿으니, 그것이 그에게 의로 여겨졌다는 말씀입니다.","s":1530.432,"e":1535.778,"p":false,"h":false},{"t":"여기서 여겨졌다는 말은 장부에 기록한다는 뜻의 계산하는 말입니다.","s":1536.408,"e":1540.786,"p":false,"h":false},{"t":"아브라함이 의로운 일을 해서 의로운 사람이 된 것이 아니라, 하나님이 그의 장부에 의를 적어 넣어 주셨다는 것입니다.","s":1541.412,"e":1549.03,"p":true,"h":false},{"t":"그리고 4절과 5절이 이 장에서 가장 놀라운 구절입니다.","s":1549.908,"e":1553.814,"p":false,"h":false},{"t":"일한 사람에게 주는 품삯은 은혜가 아니라 마땅히 받을 빚입니다.","s":1554.408,"e":1558.59,"p":false,"h":false},{"t":"그러나 일하지 않아도, 경건하지 않은 사람을 의롭다 하시는 분을 믿는 사람은, 그 믿음이 의로 여겨집니다.","s":1559.16,"e":1566.687,"p":false,"h":false},{"t":"사람의 상식은 이렇습니다.","s":1567.296,"e":1569.238,"p":false,"h":false},{"t":"하나님이 의롭다고 해 주시는 대상은 경건한 사람, 착하게 산 사람이어야 합니다.","s":1569.564,"e":1575.345,"p":false,"h":false},{"t":"그런데 바울은 경건하지 않은 자를 의롭다 하시는 분이라고 합니다.","s":1576.008,"e":1580.196,"p":false,"h":false},{"t":"이 말을 처음 들으면 숨이 멎을 만큼 놀랍습니다.","s":1580.832,"e":1584.435,"p":false,"h":false},{"t":"하나님은 착한 사람이 아니라 죄인을 의롭다 하시는 분입니다.","s":1585.044,"e":1589.374,"p":true,"h":false},{"t":"바울은 이어서 다윗을 증인으로 세웁니다.","s":1590.192,"e":1592.988,"p":false,"h":false},{"t":"다윗은 시편에서, 행위와 상관없이 하나님께 의를 인정받는 사람의 복을 말했습니다.","s":1593.612,"e":1599.734,"p":false,"h":false},{"t":"죄가 가려진 사람, 주께서 죄를 계산하지 않으시는 사람이 복이 있다고 합니다.","s":1600.38,"e":1605.76,"p":true,"h":false},{"t":"그다음 질문은 이것입니다.","s":1606.68,"e":1608.621,"p":false,"h":false},{"t":"이 복이 할례받은 사람에게만 해당합니까.","s":1609.236,"e":1612.027,"p":false,"h":false},{"t":"바울은 순서를 짚습니다.","s":1612.656,"e":1614.635,"p":false,"h":false},{"t":"아브라함이 의롭다고 여김을 받은 것은 창세기 15장이고, 할례를 받은 것은 17장입니다.","s":1615.284,"e":1621.651,"p":false,"h":false},{"t":"의롭다는 판결이 먼저였고, 할례는 그 뒤에 받은 표였습니다.","s":1622.34,"e":1626.941,"p":false,"h":false},{"t":"그래서 아브라함은 할례받지 않고 믿는 사람들의 조상도 되고, 할례받은 사람들 가운데 믿음의 길을 따르는 사람들의 조상도 됩니다.","s":1627.56,"e":1636.252,"p":true,"h":false},{"t":"약속도 같습니다.","s":1637.136,"e":1638.619,"p":false,"h":false},{"t":"약속이 율법을 통해 온 것이라면, 믿음은 쓸모없어지고 약속은 무효가 됩니다.","s":1639.26,"e":1645.014,"p":false,"h":false},{"t":"그러나 믿음으로 받는 것이므로 은혜이고, 그래서 모든 후손에게 확실합니다.","s":1645.596,"e":1650.886,"p":true,"h":false},{"t":"17절부터 22절은 아브라함의 믿음이 어떤 것인지를 보여 줍니다.","s":1651.788,"e":1656.557,"p":false,"h":false},{"t":"아브라함은 약속을 받았을 때 거의 백 살이었고, 아내 사라의 태, 곧 아이를 가질 몸도 이미 죽은 것과 같았습니다.","s":1657.224,"e":1665.893,"p":false,"h":false},{"t":"사람의 눈으로 볼 때는 소망이 없는 자리였습니다.","s":1666.548,"e":1669.915,"p":false,"h":false},{"t":"그러나 그는 바랄 수 없는 중에도 바라고 믿었다고 합니다.","s":1670.184,"e":1674.06,"p":false,"h":false},{"t":"이 믿음은 자기 안에서 짜낸 힘이 아닙니다.","s":1674.684,"e":1677.675,"p":false,"h":false},{"t":"죽은 자를 살리시고, 없는 것을 있는 것처럼 부르시는 하나님을 바라보는 것입니다.","s":1678.32,"e":1683.929,"p":false,"h":false},{"t":"믿음의 크기가 아니라 믿음의 대상이 이 장의 중심입니다.","s":1684.584,"e":1688.717,"p":true,"h":false},{"t":"마지막 23절부터 25절에서 바울은, 이 말씀이 아브라함만을 위해 기록된 것이 아니라 우리를 위한 것이라고 합니다.","s":1689.624,"e":1698.164,"p":false,"h":false},{"t":"예수님을 죽은 자 가운데서 살리신 분을 믿는 우리에게도 의로 여겨진다는 것입니다.","s":1698.84,"e":1704.496,"p":false,"h":false},{"t":"예수님은 우리의 범죄 때문에 내주신 바 되었고, 우리를 의롭다 하시기 위해 살아나셨습니다.","s":1705.14,"e":1711.295,"p":true,"h":false},{"t":"구절 풀이","s":1712.16,"e":1713.213,"p":true,"h":false},{"t":"4장 3절의 여겨졌다는 말은, 계산하다, 장부에 기록하다는 뜻입니다.","s":1714.068,"e":1719.756,"p":false,"h":false},{"t":"이 장에서 여러 번 되풀이되는 열쇠 단어입니다.","s":1720.44,"e":1723.73,"p":false,"h":false},{"t":"의를 얻은 사람이 의로운 사람으로 변했다는 뜻이 아니라, 하나님이 그에게 의를 계산해 주셨다는 뜻입니다.","s":1724.364,"e":1731.537,"p":true,"h":false},{"t":"4장 5절의 경건하지 않은 자를 의롭다 하신다는 말은, 읽는 사람이 가장 걸리는 구절입니다.","s":1732.428,"e":1738.575,"p":false,"h":false},{"t":"하나님이 불의를 눈감아 주신다는 말이 아닙니다.","s":1739.232,"e":1742.373,"p":false,"h":false},{"t":"3장 25절에서 본 것처럼, 죄의 값이 그리스도 안에서 이미 치러졌기 때문에, 그 위에서 의롭다고 선언하시는 것입니다.","s":1742.904,"e":1751.65,"p":true,"h":false},{"t":"4장 3절의 믿음은, 아브라함이 한 행위처럼 보이지만 공로가 아닙니다.","s":1752.48,"e":1757.7,"p":false,"h":false},{"t":"믿음 자체가 값어치가 있어서 의로 쳐 주신 것이 아니라, 믿음은 하나님이 주시는 것을 받는 빈손입니다.","s":1758.276,"e":1765.342,"p":false,"h":false},{"t":"야고보서 2장에서는 아브라함이 행함으로 의롭다 함을 받았다고 하는데, 이 말과 부딪히는 것 아니냐는 질문이 자주 나옵니다.","s":1765.98,"e":1774.372,"p":false,"h":false},{"t":"야고보는 믿음이 있다고 말하는 사람이 정말 그런지를 보여 주는 증거로서의 행위를 말하고, 바울은 하나님 앞에서 의가 어떻게 계산되는지를 말하므로, 서로 다른 질문에 답하는 것으로 읽는 것이 일반적입니다.","s":1775.016,"e":1788.894,"p":true,"h":false},{"t":"4장 11절의 표는, 할례가 의의 도장이었다는 뜻입니다.","s":1789.812,"e":1793.995,"p":false,"h":false},{"t":"도장은 이미 이루어진 계약에 찍는 것입니다.","s":1794.636,"e":1797.716,"p":false,"h":false},{"t":"이미 받은 의가 먼저이고, 표는 그 뒤에 온 것입니다.","s":1798.308,"e":1802.461,"p":true,"h":false},{"t":"4장 17절의 죽은 자를 살리시며 없는 것을 있는 것처럼 부르시는 하나님은, 믿음의 대상이 누구인지를 한 문장으로 보여 줍니다.","s":1803.348,"e":1811.809,"p":false,"h":false},{"t":"아브라함의 믿음은 자기 안의 확신이 아니라, 이런 하나님을 향한 것이었습니다.","s":1812.42,"e":1817.551,"p":true,"h":false},{"t":"4장 25절의 우리를 의롭다 하시기 위해 살아나셨다는 말은, 부활이 십자가와 함께 구원의 일부라는 뜻으로 읽습니다.","s":1818.468,"e":1826.286,"p":false,"h":false},{"t":"십자가에서 죄 문제가 해결되었고, 부활로 그 일이 하나님께 받아들여졌다는 확증이 되었다는 읽기가 널리 알려져 있습니다.","s":1826.928,"e":1835.138,"p":true,"h":false},{"t":"이 장을 읽을 때","s":1836.036,"e":1837.439,"p":true,"h":false},{"t":"성경 로마서 4장을 읽으실 때 붙잡을 것은 4절과 5절입니다.","s":1838.304,"e":1842.826,"p":false,"h":false},{"t":"일한 사람과 일하지 않은 사람의 차이를 놓치지 마십시오.","s":1843.452,"e":1847.062,"p":false,"h":false},{"t":"그리고 경건하지 않은 자를 의롭다 하신다는 말이 얼마나 놀라운 말인지 천천히 읽으십시오.","s":1847.52,"e":1853.496,"p":false,"h":false},{"t":"이 장의 줄거리는 간단합니다.","s":1854,"e":1856.219,"p":false,"h":false},{"t":"아브라함은 믿음으로 의롭다 함을 받았고, 그것이 우리에게도 똑같다는 것입니다.","s":1856.88,"e":1862.473,"p":true,"h":false},{"t":"다음 5장에서는 지금까지의 논증이 한곳에 모입니다.","s":1863.36,"e":1867.052,"p":false,"h":false},{"t":"그렇게 의롭다 함을 받은 사람에게 무슨 일이 일어나는지를 말합니다.","s":1867.644,"e":1872.138,"p":false,"h":false},{"t":"평화와 소망이 오고, 한 사람 아담과 한 사람 그리스도가 대조됩니다.","s":1872.756,"e":1877.637,"p":true,"h":false},{"t":"이제 성경 로마서 4장을 읽으십시오.","s":1878.516,"e":1881.234,"p":true,"h":false}]},{"title":"로마서 5장","audio":"book_2611040800_1.mp3","start":1882.008,"end":2222.712,"dur":340.7,"segs":[{"t":"로마서 5장","s":1882.008,"e":1883.301,"p":true,"h":false},{"t":"전체 흐름","s":1884.096,"e":1885.23,"p":true,"h":false},{"t":"지난 4장에서 바울은 아브라함을 통해, 의롭다 함이 행위가 아니라 믿음으로 온다는 것을 보여 주었습니다.","s":1886.112,"e":1893.116,"p":false,"h":false},{"t":"이제 5장은, 이렇게 의롭다 함을 받은 사람에게 무슨 일이 일어나는지를 말합니다.","s":1893.744,"e":1899.424,"p":false,"h":false},{"t":"1장부터 4장이 어떻게 의롭다 함을 받는가였다면, 5장부터는 의롭다 함을 받은 사람이 어디에 서 있는가로 넘어갑니다.","s":1900.044,"e":1908.061,"p":false,"h":false},{"t":"그래서 5장은 앞과 뒤를 잇는 다리 같은 장입니다.","s":1908.72,"e":1912.423,"p":true,"h":false},{"t":"1절은 이렇게 시작합니다.","s":1913.292,"e":1915.345,"p":false,"h":false},{"t":"그러므로 우리가 믿음으로 의롭다 하심을 받았으니, 하나님과 화평을 누립니다.","s":1915.992,"e":1921.459,"p":false,"h":false},{"t":"화평은 마음이 편안하다는 감정이 아니라 관계의 이름입니다.","s":1922.112,"e":1926.356,"p":false,"h":false},{"t":"하나님과 원수였던 관계가 끝났다는 말입니다.","s":1927.008,"e":1930.389,"p":false,"h":false},{"t":"그리고 우리는 이 은혜 안에 들어서 있고, 하나님의 영광을 바라며 즐거워한다고 합니다.","s":1930.968,"e":1936.94,"p":false,"h":false},{"t":"심지어 환난 중에도 즐거워한다고 합니다.","s":1937.556,"e":1940.363,"p":false,"h":false},{"t":"환난이 인내를, 인내가 연단을, 연단이 소망을 이루는 줄 알기 때문입니다.","s":1940.616,"e":1946.253,"p":false,"h":false},{"t":"그리고 이 소망은 부끄럽게 하지 않는다고 합니다.","s":1946.88,"e":1950.246,"p":false,"h":false},{"t":"하나님의 사랑이 성령으로 우리 마음에 부어졌기 때문입니다.","s":1950.876,"e":1954.981,"p":true,"h":false},{"t":"6절부터 11절에서 바울은 이 사랑이 어떤 사랑인지를 말하는데, 여기가 이 장에서 가장 놀라운 곳입니다.","s":1955.844,"e":1963.251,"p":false,"h":false},{"t":"먼저 사람의 상식을 생각해 보십시오.","s":1963.908,"e":1966.534,"p":false,"h":false},{"t":"사람이 누군가를 위해 목숨을 내놓는 경우는 어떤 때입니까.","s":1967.04,"e":1970.967,"p":false,"h":false},{"t":"7절은 의로운 사람을 위해 죽는 사람은 드물고, 선한 사람을 위해서라면 혹시 용감히 죽을 사람이 있을지 모른다고 합니다.","s":1971.576,"e":1979.943,"p":false,"h":false},{"t":"존경할 만한 사람, 사랑스러운 사람을 위해서라면 목숨을 거는 사람이 간혹 있다는 것입니다.","s":1980.576,"e":1986.748,"p":true,"h":false},{"t":"그런데 하나님은 어떻게 하셨습니까.","s":1987.668,"e":1990,"p":false,"h":false},{"t":"우리가 아직 연약할 때, 우리가 아직 죄인이었을 때, 그리스도가 우리를 위해 죽으셨다고 합니다.","s":1990.62,"e":1997.376,"p":false,"h":false},{"t":"10절은 더 나아가, 우리가 원수였을 때라고 합니다.","s":1998,"e":2001.869,"p":false,"h":false},{"t":"회개하고 돌아온 다음이 아닙니다.","s":2002.5,"e":2004.872,"p":false,"h":false},{"t":"하나님을 대적하고 있을 때, 아직 등을 돌리고 있을 때, 하나님이 먼저 자기 아들을 내주셨습니다.","s":2005.524,"e":2012.071,"p":false,"h":false},{"t":"사람의 사랑은 상대가 사랑스러워서 시작되지만, 하나님의 사랑은 상대가 원수일 때 시작되었습니다.","s":2012.688,"e":2019.505,"p":false,"h":false},{"t":"그러니 원수였을 때 이미 화목하게 하셨다면, 이제 화목한 사람을 끝까지 구원하시는 것은 얼마나 더 확실하겠느냐는 것이 바울의 논리입니다.","s":2020.104,"e":2029.678,"p":true,"h":false},{"t":"12절부터 21절은 이 장의 두 번째 큰 부분입니다.","s":2030.58,"e":2034.835,"p":false,"h":false},{"t":"바울은 시야를 확 넓혀서, 한 사람 아담과 한 사람 그리스도를 나란히 세웁니다.","s":2035.368,"e":2040.887,"p":false,"h":false},{"t":"한 사람 아담이 죄를 지어 죄가 세상에 들어왔고, 죄와 함께 죽음이 들어왔으며, 모든 사람이 죽음 아래 있게 되었다고 합니다.","s":2041.56,"e":2050.14,"p":false,"h":false},{"t":"이 말은 처음 읽으면 불공평하게 들릴 수 있습니다.","s":2050.776,"e":2054.394,"p":false,"h":false},{"t":"그런데 바울은 이 이야기를 정죄하려고 꺼낸 것이 아닙니다.","s":2054.988,"e":2059.035,"p":false,"h":false},{"t":"같은 구조로 뒤집으려고 꺼낸 것입니다.","s":2059.668,"e":2062.387,"p":false,"h":false},{"t":"한 사람 때문에 죽음이 왕 노릇 했다면, 한 사람 예수 그리스도 때문에, 은혜와 의의 선물을 넘치게 받는 사람들은 생명 안에서 왕 노릇 할 것이라고 합니다.","s":2062.656,"e":2072.878,"p":true,"h":false},{"t":"15절에서 17절 사이에는 더욱이라는 말이 반복됩니다.","s":2073.456,"e":2077.415,"p":false,"h":false},{"t":"한 사람의 범죄가 그렇게 큰 영향을 미쳤다면, 한 사람 그리스도의 은혜는 더욱 크다는 것입니다.","s":2078.064,"e":2084.549,"p":false,"h":false},{"t":"20절은 율법이 들어와서 죄가 더 드러나고 많아졌지만, 죄가 더한 곳에 은혜가 더욱 넘쳤다고 합니다.","s":2085.156,"e":2091.934,"p":false,"h":false},{"t":"이 말이 6장의 질문을 부릅니다.","s":2092.572,"e":2095.225,"p":false,"h":false},{"t":"그렇다면 은혜가 더 넘치도록 죄를 더 지어도 되는 것 아닙니까.","s":2095.884,"e":2100.205,"p":true,"h":false},{"t":"구절 풀이","s":2101.068,"e":2102.121,"p":true,"h":false},{"t":"5장 1절의 화평을 누린다는 말은, 사본에 따라 누리자로 읽기도 합니다.","s":2102.976,"e":2107.968,"p":false,"h":false},{"t":"어느 쪽이든 그 화평은 우리가 만들어 내는 것이 아니라, 의롭다 함을 받은 결과로 주어진 사실입니다.","s":2108.592,"e":2115.315,"p":true,"h":false},{"t":"5장 3절의 환난 중에도 즐거워한다는 말은, 고난을 좋아하라는 뜻이 아닙니다.","s":2116.188,"e":2121.556,"p":false,"h":false},{"t":"고난이 목적이 아니라, 그 고난 속에서 하나님의 사랑이 확인된다는 뜻으로 읽습니다.","s":2122.2,"e":2127.855,"p":true,"h":false},{"t":"5장 12절의 모든 사람이 죄를 지었으므로는 해석이 갈리는 곳입니다.","s":2128.752,"e":2133.308,"p":false,"h":false},{"t":"아담이 모든 사람의 대표여서 그 안에서 모두가 죄인이 되었다고 읽는 견해가 있고, 모든 사람이 각자 죄를 지었기 때문이라고 읽는 견해가 있습니다.","s":2133.9,"e":2143.865,"p":false,"h":false},{"t":"개혁신학은 대개 앞쪽으로 읽습니다.","s":2144.448,"e":2147.168,"p":false,"h":false},{"t":"이 대표 개념이 중요한 이유는, 18절과 19절에서 그리스도가 같은 방식으로 우리의 대표가 되셨다고 말하기 때문입니다.","s":2147.796,"e":2155.853,"p":false,"h":false},{"t":"우리가 한 일이 아니라 한 사람이 한 일이 우리에게 돌아온다는 구조가 이 단락의 중심입니다.","s":2156.472,"e":2162.548,"p":true,"h":false},{"t":"5장 20절의 죄가 더한 곳에 은혜가 더욱 넘쳤다는 말은, 죄를 권하는 말이 아닙니다.","s":2163.456,"e":2169.403,"p":false,"h":false},{"t":"은혜의 크기가 죄의 크기를 넘어선다는 뜻입니다.","s":2170.08,"e":2173.422,"p":false,"h":false},{"t":"이 오해는 6장에서 정면으로 다룹니다.","s":2173.68,"e":2176.56,"p":true,"h":false},{"t":"이 장을 읽을 때","s":2177.424,"e":2178.827,"p":true,"h":false},{"t":"성경 로마서 5장을 읽으 6,"p":true,"h":false},{"t":"3절부터 바울은 세례를 이야기하며, 이 신분이 어떻게 생겼는지를 설명합니다.","s":2285.028,"e":2290.732,"p":false,"h":false},{"t":"그리스도 예수 안으로 세례를 받은 우리는 그분의 죽음 안으로 세례를 받은 것이라고 합니다.","s":2291.364,"e":2296.686,"p":false,"h":false},{"t":"그리스도와 연합했다는 말입니다.","s":2297.304,"e":2299.634,"p":false,"h":false},{"t":"그분이 죽으실 때 우리도 함께 죽었고, 그분이 살아나실 때 우리도 새 생명 가운데서 살게 되었다는 것입니다.","s":2299.932,"e":2307.579,"p":false,"h":false},{"t":"6절은 우리의 옛 사람이 그리스도와 함께 십자가에 못 박혔고, 그래서 죄의 몸이 힘을 잃었으며, 우리가 더 이상 죄의 종노릇하지 않게 되었다고 합니다.","s":2308.248,"e":2318.413,"p":true,"h":false},{"t":"여기서 사람의 상식을 짚어야 합니다.","s":2319.336,"e":2321.815,"p":false,"h":false},{"t":"사람은 은혜와 책임을 이렇게 생각합니다.","s":2322.432,"e":2325.311,"p":false,"h":false},{"t":"은혜를 받았으니 이제 잘해야 한다, 잘하지 못하면 은혜가 취소된다.","s":2325.96,"e":2331.237,"p":false,"h":false},{"t":"그러면 은혜가 곧 조건이 되어 버립니다.","s":2331.864,"e":2334.636,"p":false,"h":false},{"t":"그런데 바울은 순서를 완전히 다르게 놓습니다.","s":2335.248,"e":2338.666,"p":false,"h":false},{"t":"먼저 된 일을 말하고, 그다음에 명령이 옵니다.","s":2339.208,"e":2342.924,"p":true,"h":false},{"t":"11절이 그 전환점입니다.","s":2343.78,"e":2345.871,"p":false,"h":false},{"t":"이와 같이 너희도 죄에 대하여는 죽은 자요, 그리스도 예수 안에서 하나님께 대하여는 산 자로 여길지어다.","s":2346.192,"e":2353.422,"p":false,"h":false},{"t":"먼저 사실을 알고, 그 사실을 믿고 여기라는 것입니다.","s":2354.004,"e":2358.082,"p":false,"h":false},{"t":"그리고 12절부터 명령이 나옵니다.","s":2358.72,"e":2361.336,"p":false,"h":false},{"t":"죄가 너희 죽을 몸을 왕 노릇 하지 못하게 하라.","s":2361.636,"e":2364.782,"p":false,"h":false},{"t":"14절은 이유를 댑니다.","s":2365.452,"e":2367.4,"p":false,"h":false},{"t":"죄가 너희를 주관하지 못할 것이다.","s":2368.008,"e":2370.48,"p":false,"h":false},{"t":"너희가 율법 아래 있지 않고 은혜 아래 있기 때문이다.","s":2370.996,"e":2374.651,"p":false,"h":false},{"t":"책임은 은혜의 조건이 아니라 은혜의 열매입니다.","s":2375.28,"e":2378.683,"p":true,"h":false},{"t":"15절에서 똑같은 질문이 다시 나옵니다.","s":2379.492,"e":2382.4,"p":false,"h":false},{"t":"그러면 우리가 율법 아래 있지 않고 은혜 아래 있으니 죄를 지어도 되겠습니까.","s":2383.02,"e":2388.248,"p":false,"h":false},{"t":"바울은 두 번째로 물리칩니다.","s":2388.888,"e":2391.242,"p":false,"h":false},{"t":"질문이 두 번 나온다는 것은 이 오해가 그만큼 끈질기다는 뜻입니다.","s":2391.912,"e":2396.854,"p":false,"h":false},{"t":"이번 대답은 종의 비유입니다.","s":2397.528,"e":2399.733,"p":false,"h":false},{"t":"사람은 누군가의 종으로 삽니다.","s":2400.372,"e":2402.655,"p":false,"h":false},{"t":"중립은 없습니다.","s":2403.216,"e":2404.708,"p":false,"h":false},{"t":"죄의 종으로 살면 죽음에 이르고, 순종의 종으로 살면 의에 이릅니다.","s":2405.34,"e":2410.225,"p":true,"h":false},{"t":"그런데 17절과 18절은 놀라운 말을 합니다.","s":2411.1,"e":2414.553,"p":false,"h":false},{"t":"너희가 전에는 죄의 종이었으나, 이제는 그 가르침에 마음으로 순종하여 죄로부터 해방되어 의의 종이 되었다.","s":2415.168,"e":2422.546,"p":false,"h":false},{"t":"바울은 종살이에서 풀려나 새 주인에게 간 사람의 이야기를 하고 있습니다.","s":2423.088,"e":2427.644,"p":false,"h":false},{"t":"풀려난 종이 다시 옛 주인에게 돌아가겠습니까.","s":2428.272,"e":2431.354,"p":false,"h":false},{"t":"죄를 짓는 것은 자유가 아니라, 이미 벗어난 종살이로 되돌아가는 일이라는 것입니다.","s":2432.016,"e":2437.735,"p":false,"h":false},{"t":"마지막 23절은 이 장의 결론이자 요약입니다.","s":2438.388,"e":2441.983,"p":false,"h":false},{"t":"죄의 삯은 사망이요, 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생입니다.","s":2442.636,"e":2448.391,"p":false,"h":false},{"t":"삯과 은사의 대조를 보십시오.","s":2449.044,"e":2451.206,"p":false,"h":false},{"t":"죄는 일한 만큼 삯을 주지만, 하나님은 삯이 아니라 선물을 주십니다.","s":2451.636,"e":2456.483,"p":true,"h":false},{"t":"구절 풀이","s":2457.36,"e":2458.413,"p":true,"h":false},{"t":"6장 2절의 그럴 수 없느니라는 말은, 바울이 가장 강하게 부인할 때 쓰는 표현입니다.","s":2459.268,"e":2464.999,"p":false,"h":false},{"t":"은혜를 핑계로 죄를 지을 수 있다는 생각은, 은혜가 무엇인지 모른다는 증거라는 뜻입니다.","s":2465.604,"e":2471.726,"p":true,"h":false},{"t":"6장 3절과 4절의 세례는, 물세례를 가리킨다고 읽는 견해도 있고, 그리스도와의 영적 연합을 가리킨다고 읽는 견해도 있습니다.","s":2472.624,"e":2481.664,"p":false,"h":false},{"t":"어느 쪽이든 바울의 요점은 의식이 아니라, 우리가 그리스도의 죽음과 부활 안에 포함되어 있다는 점입니다.","s":2482.344,"e":2489.426,"p":true,"h":false},{"t":"6장 6절의 옛 사람은, 우리가 그리스도 밖에서 아담 안에 있던 존재를 가리킵니다.","s":2490.336,"e":2496.301,"p":false,"h":false},{"t":"그것이 십자가에서 처리되었다는 말은, 죄의 유혹이 느껴지지 않는다는 말이 아니라, 하나님 앞에서의 신분이 바뀌었다는 뜻으로 읽습니다.","s":2496.96,"e":2505.816,"p":true,"h":false},{"t":"6장 11절의 여길지어다는, 4장에서 의로 여겨졌다고 할 때 쓴 말과 같은 계산하다라는 말입니다.","s":2506.716,"e":2513.538,"p":false,"h":false},{"t":"사실로 받아들이고 그 위에서 살라는 뜻입니다.","s":2514.132,"e":2517.459,"p":false,"h":false},{"t":"우리가 노력해서 죽는 것이 아니라, 이미 일어난 일을 사실로 계산하는 것입니다.","s":2518.092,"e":2523.486,"p":true,"h":false},{"t":"6장 16절에서 19절의 종 비유는, 바울이 19절에서 사람의 예를 들어 말한다고 밝히듯, 종 제도를 옹호하려는 것이 아니라 누구에게 속하느냐를 설명하려는 비유입니다.","s":2524.392,"e":2535.97,"p":true,"h":false},{"t":"이 장을 읽을 때","s":2536.848,"e":2538.251,"p":true,"h":false},{"t":"성경 로마서 6장을 읽으실 때 붙잡을 것은 순서입니다.","s":2539.116,"e":2543.131,"p":false,"h":false},{"t":"먼저 사실이 나오고, 그다음에 명령이 나옵니다.","s":2543.76,"e":2547.513,"p":false,"h":false},{"t":"우리는 흔히 명령을 지켜야 사실이 되는 것처럼 읽지만, 바울은 반대로 읽습니다.","s":2548.152,"e":2553.708,"p":false,"h":false},{"t":"11절이 그 경계선입니다.","s":2554.344,"e":2556.502,"p":false,"h":false},{"t":"그리고 1절과 15절에서 같은 질문이 두 번 나오는 것을 놓치지 마십시오.","s":2556.792,"e":2561.818,"p":true,"h":false},{"t":"다음 7장에서는 율법이 다시 나옵니다.","s":2562.588,"e":2565.466,"p":false,"h":false},{"t":"은혜 아래 있다면 율법은 어떻게 되는지, 그리고 바울이 말하는 내가 누구를 가리키는지가 논쟁이 되는 대목입니다.","s":2566.116,"e":2573.685,"p":true,"h":false},{"t":"이제 성경 로마서 6장을 읽으십시오.","s":2574.54,"e":2577.316,"p":true,"h":false}]},{"title":"로마서 7장","audio":"book_2611040800_1.mp3","start":2578.176,"end":2896.884,"dur":318.7,"segs":[{"t":"로마서 7장","s":2578.176,"e":2579.592,"p":true,"h":false},{"t":"전체 흐름","s":2580.48,"e":2581.614,"p":true,"h":false},{"t":"지난 6장에서 바울은, 은혜 아래 있는 사람이 죄에 머물 수 없는 이유를 신분으로 설명했습니다.","s":2582.496,"e":2588.798,"p":false,"h":false},{"t":"죄에 대하여 죽었고, 이제는 은혜 아래 있다는 것입니다.","s":2589.408,"e":2593.524,"p":false,"h":false},{"t":"그런데 6장 14절에서 율법 아래 있지 않다고 했으니, 율법은 이제 어떻게 되는가 하는 질문이 남습니다.","s":2594.16,"e":2601.145,"p":false,"h":false},{"t":"7장은 율법과 나의 관계를 세 단계로 풀어 갑니다.","s":2601.828,"e":2605.37,"p":true,"h":false},{"t":"1절부터 6절은 결혼의 비유입니다.","s":2606.256,"e":2609.023,"p":false,"h":false},{"t":"법은 사람이 살아 있는 동안만 그 사람을 묶습니다.","s":2609.316,"e":2612.714,"p":false,"h":false},{"t":"남편이 살아 있는 동안 아내는 남편에게 매여 있지만, 남편이 죽으면 그 법에서 풀려납니다.","s":2613.24,"e":2619.331,"p":false,"h":false},{"t":"바울은 이것을  하나님이 먼저 약속하신 이스라엘은 어떻게 된 것입니까.","s":3318.084,"e":3325.217,"p":false,"h":false},{"t":"이 질문이 9장부터 11장까지 이어집니다.","s":3325.86,"e":3329.155,"p":true,"h":false},{"t":"이제 성경 로마서 8장을 읽으십시오.","s":3330.072,"e":3332.873,"p":true,"h":false}]},{"title":"로마서 9장","audio":"book_2611040800_1.mp3","start":3333.708,"end":3823.02,"dur":489.3,"segs":[{"t":"로마서 9장","s":3333.708,"e":3334.989,"p":true,"h":false},{"t":"전체 흐름","s":3335.796,"e":3336.93,"p":true,"h":false},{"t":"지난 8장은, 하나님의 사랑에서 아무것도 우리를 끊을 수 없다는 선언으로 끝났습니다.","s":3337.812,"e":3343.755,"p":false,"h":false},{"t":"그런데 이 확실한 사랑을 말하는 바울의 마음에는 아픈 질문이 걸려 있었습니다.","s":3344.328,"e":3349.848,"p":false,"h":false},{"t":"그렇다면 하나님이 먼저 약속하신 이스라엘은 어떻게 된 것입니까.","s":3350.484,"e":3354.854,"p":false,"h":false},{"t":"이스라엘 대부분이 예수를 믿지 않고 있었기 때문입니다.","s":3355.452,"e":3359.258,"p":false,"h":false},{"t":"9장부터 11장은 이 질문에 대한 답입니다.","s":3359.88,"e":3363.168,"p":true,"h":false},{"t":"1절부터 5절에서 바울은 자기 마음을 먼저 드러냅니다.","s":3364.056,"e":3367.912,"p":false,"h":false},{"t":"내게 큰 근심이 있고, 마음에 쉬지 않는 고통이 있다고 합니다.","s":3368.484,"e":3373.053,"p":false,"h":false},{"t":"그리고 놀라운 말을 합니다.","s":3373.704,"e":3375.641,"p":false,"h":false},{"t":"내 형제, 내 골육 친척을 위해서라면, 내가 그리스도에게서 끊어져 저주를 받아도 좋겠다는 것입니다.","s":3375.972,"e":3383.251,"p":false,"h":false},{"t":"8장에서 아무것도 그리스도의 사랑에서 끊을 수 없다고 외친 사람이, 동족을 위해서는 끊어지는 것까지 원할 만큼 아파하고 있습니다.","s":3383.928,"e":3392.781,"p":false,"h":false},{"t":"이 마음을 알고 읽어야, 뒤에 나오는 어려운 이야기가 차갑게 들리지 않습니다.","s":3393.432,"e":3398.988,"p":false,"h":false},{"t":"바울은 이스라엘이 받은 것들을 하나씩 짚습니다.","s":3399.624,"e":3402.955,"p":false,"h":false},{"t":"양자 됨과 영광과 언약들과 율법과 예배와 약속들과 조상들, 그리고 그리스도도 육신으로는 그들에게서 나셨습니다.","s":3403.26,"e":3411.638,"p":true,"h":false},{"t":"그런데 6절에서 바울은 중요한 선을 긋습니다.","s":3412.548,"e":3415.814,"p":false,"h":false},{"t":"하나님의 말씀이 폐하여진 것이 아닙니다.","s":3416.436,"e":3419.133,"p":false,"h":false},{"t":"이스라엘에게서 난 사람이 다 이스라엘이 아니라는 것입니다.","s":3419.712,"e":3423.99,"p":false,"h":false},{"t":"아브라함의 자손이라고 해서 다 자녀가 아닙니다.","s":3424.644,"e":3427.902,"p":false,"h":false},{"t":"이스마엘이 아니라 이삭을 통해 난 사람이 자손이라 불렸습니다.","s":3428.532,"e":3432.898,"p":false,"h":false},{"t":"쌍둥이 중에서도 에서가 아니라 야곱이었습니다.","s":3433.536,"e":3436.864,"p":false,"h":false},{"t":"그것도 아직 태어나기도 전에, 선이나 악을 행하기도 전에 정해진 일이라고 합니다.","s":3437.496,"e":3442.763,"p":false,"h":false},{"t":"이유는 하나님의 택하심의 뜻이, 행위가 아니라 부르시는 이로 말미암아 서게 하려는 것이었습니다.","s":3443.4,"e":3449.938,"p":true,"h":false},{"t":"여기서 사람의 상식은 즉시 항의합니다.","s":3450.816,"e":3453.686,"p":false,"h":false},{"t":"하나님이 이렇게 먼저 정하신다면 불공평하지 않습니까.","s":3453.984,"e":3457.68,"p":false,"h":false},{"t":"14절에서 바울이 바로 이 질문을 던집니다.","s":3458.34,"e":3461.558,"p":false,"h":false},{"t":"그렇다면 하나님께 불의가 있다고 하겠습니까.","s":3462.156,"e":3465.167,"p":false,"h":false},{"t":"바울은 그럴 수 없다고 하고, 모세에게 하신 말씀을 가져옵니다.","s":3465.756,"e":3470.382,"p":false,"h":false},{"t":"내가 긍휼히 여길 사람을 긍휼히 여기고, 불쌍히 여길 사람을 불쌍히 여기리라.","s":3471.048,"e":3476.753,"p":false,"h":false},{"t":"그러니 이것은 원하는 사람이나 달려가는 사람에게 달린 것이 아니라, 긍휼히 여기시는 하나님께 달려 있다고 합니다.","s":3477.384,"e":3484.943,"p":true,"h":false},{"t":"이것을 사람의 눈으로만 보면 이상합니다.","s":3485.808,"e":3488.709,"p":false,"h":false},{"t":"그러나 1장부터 8장까지 이어서 읽은 사람은 이 말이 어디서 나오는지 압니다.","s":3489.228,"e":3494.725,"p":false,"h":false},{"t":"모든 사람이 죄 아래 있었고, 하나님께 받을 자격이 있는 사람은 없었습니다.","s":3495.348,"e":3500.886,"p":false,"h":false},{"t":"그렇다면 하나님이 누구를 구원하시든 그것은 은혜입니다.","s":3501.18,"e":3505.199,"p":false,"h":false},{"t":"불공평하다는 질문은, 모든 사람이 마땅히 받아야 할 것을 받지 못한 억울한 사람이라는 전제에서 나옵니다.","s":3505.788,"e":3512.93,"p":false,"h":false},{"t":"그런데 이 전제가 틀렸습니다.","s":3513.6,"e":3515.897,"p":false,"h":false},{"t":"공평을 기준으로 하면 모두가 심판 아래 있습니다.","s":3516.228,"e":3519.663,"p":false,"h":false},{"t":"그러므로 구원받는 사람은 공평 때문이 아니라 긍휼 때문에 구원받습니다.","s":3520.188,"e":3525.244,"p":false,"h":false},{"t":"선택은 하나님이 사람을 차별하신다는 이야기가 아니라, 아무도 받을 자격이 없는 자리에서 하나님이 먼저 손을 내미셨다는 이야기입니다.","s":3525.84,"e":3534.645,"p":true,"h":false},{"t":"19절에서 가상의 반대자가 다시 나옵니다.","s":3535.524,"e":3538.616,"p":false,"h":false},{"t":"그렇다면 하나님이 어찌하여 여전히 허물하십니까.","s":3539.268,"e":3542.693,"p":false,"h":false},{"t":"누가 그 뜻을 거역하겠습니까.","s":3543.336,"e":3545.582,"p":false,"h":false},{"t":"바울은 이렇게 대답합니다.","s":3546.216,"e":3548.231,"p":false,"h":false},{"t":"사람아, 네가 누구이기에 감히 하나님께 반문하느냐.","s":3548.844,"e":3552.686,"p":false,"h":false},{"t":"토기장이가 같은 흙덩이로 하나는 귀하게 쓰고 하나는 천하게 쓸 권리가 있지 않느냐고 합니다.","s":3553.272,"e":3558.8,"p":false,"h":false},{"t":"그리고 22절부터 24절에서 이 이야기는 이렇게 맺어집니다.","s":3559.428,"e":3564.147,"p":false,"h":false},{"t":"하나님은 진노의 그릇을 오래 참으시고, 또 긍휼의 그릇에 영광의 풍성함을 알게 하려 하셨습니다.","s":3564.756,"e":3571.248,"p":false,"h":false},{"t":"그 긍휼의 그릇은 유대인 가운데서뿐 아니라, 이방인 가운데서도 부르신 우리입니다.","s":3571.92,"e":3578.163,"p":true,"h":false},{"t":"이어서 바울은 호세아와 이사야를 인용하며, 이것이 처음부터 구약이 말한 것이라고 합니다.","s":3579.048,"e":3585.302,"p":false,"h":false},{"t":"내 백성이 아닌 사람을 내 백성이라 부르리라.","s":3585.96,"e":3589.24,"p":false,"h":false},{"t":"이스라엘 자손의 수가 바다의 모래 같을지라도 남은 자만 구원을 받으리라.","s":3589.884,"e":3594.716,"p":false,"h":false},{"t":"이사야가 말한 남은 자의 이야기입니다.","s":3595.284,"e":3598.078,"p":true,"h":false},{"t":"마지막 30절부터 33절은 결론입니다.","s":3598.992,"e":3602.369,"p":false,"h":false},{"t":"의를 따르지 않던 이방인은 의를 얻었는데, 의의 법을 따르던 이스라엘은 거기에 이르지 못했습니다.","s":3602.988,"e":3609.519,"p":false,"h":false},{"t":"왜 그렇습니까.","s":3610.152,"e":3611.419,"p":false,"h":false},{"t":"믿음으로 하지 않고 행위로 하는 것처럼 했기 때문입니다.","s":3612.06,"e":3615.753,"p":false,"h":false},{"t":"그들이 걸림돌에 걸려 넘어졌다고 하는데, 그 돌은 이사야가 말한 시온에 둔 돌, 곧 그리스도입니다.","s":3616.344,"e":3623.485,"p":false,"h":false},{"t":"그러나 그를 믿는 사람은 부끄러움을 당하지 않습니다.","s":3624.084,"e":3627.824,"p":true,"h":false},{"t":"구절 풀이","s":3628.584,"e":3629.637,"p":true,"h":false},{"t":"9장 1절부터 3절의 저주받아도 좋겠다는 말은, 모세가 금송아지 사건 뒤에 백성을 위해 자기 이름을 지워 달라고 기도한 장면과 닮았다고 읽는 견해가 있습니다.","s":3630.492,"e":3641.313,"p":false,"h":false},{"t":"바울이 실제로 그렇게 될 수 있다는 말이 아니라, 동족을 향한 사랑의 깊이를 보여 주는 말입니다.","s":3641.976,"e":3648.104,"p":true,"h":false},{"t":"9장 13절의 야곱은 사랑하고 에서는 미워하였다는 말은 말라기 1장의 인용입니다.","s":3648.996,"e":3655.03,"p":false,"h":false},{"t":"여기서 미워했다는 말은 감정적인 증오가 아니라, 택하지 않았다, 덜 사랑했다는 뜻으로 읽는 견해가 일반적입니다.","s":3655.728,"e":3664.008,"p":false,"h":false},{"t":"또 에서와 야곱은 두 사람 개인뿐 아니라 그들에게서 나온 민족을 가리킨다고 읽기도 합니다.","s":3664.656,"e":3670.826,"p":true,"h":false},{"t":"9장 11절부터 18절의 선택은, 로마서에서 가장 논쟁이 되는 주제입니다.","s":3671.712,"e":3677.368,"p":false,"h":false},{"t":"개혁신학은 이것을 개인에 대한 하나님의 무조건적인 택하심으로 읽습니다.","s":3678.012,"e":3682.766,"p":false,"h":false},{"t":"한편 하나님이 믿음을 미리 보셨다고 읽는 견해도 있고, 개인이 아니라 민족이나 공동체의 택하심으로 읽는 견해도 있습니다.","s":3683.412,"e":3691.441,"p":false,"h":false},{"t":"어느 쪽이든 바울의 강조점은, 구원이 사람의 행위나 의지에 근거하지 않는다는 점에 있습니다.","s":3691.98,"e":3698.315,"p":false,"h":false},{"t":"이 해설에서는 이 논쟁을 한쪽으로 끝내지 않습니다.","s":3698.928,"e":3702.632,"p":true,"h":false},{"t":"9장 17절과 18절의 바로를 완악하게 하신다는 말은, 출애굽기에서 하나님이 바로의 마음을 굳게 하신 이야기입니다.","s":3703.5,"e":3711.122,"p":false,"h":false},{"t":"그런데 출애굽기에는 바로가 스스로 마음을 완악하게 했다는 말도 함께 나옵니다.","s":3711.78,"e":3716.883,"p":false,"h":false},{"t":"두 가지가 함께 말해진다는 점은 기억해 둘 만합니다.","s":3717.54,"e":3721.406,"p":true,"h":false},{"t":"9장 22절과 23절을 보면, 진노의 그릇은 멸망받기로 준비된 것이라고만 하고 준비한 이가 누구인지는 말하지 않습니다.","s":3722.292,"e":3730.735,"p":false,"h":false},{"t":"반면 긍휼의 그릇은 하나님이 영광을 위해 미리 준비하셨다고 분명히 말합니다.","s":3731.04,"e":3736.762,"p":false,"h":false},{"t":"이 차이를 눈여겨보는 해석이 있습니다.","s":3737.376,"e":3739.96,"p":true,"h":false},{"t":"9장 32절은 이 장 안에서 사람의 책임도 함께 말합니다.","s":3740.832,"e":3745.011,"p":false,"h":false},{"t":"이스라엘이 넘어진 이유를, 믿음으로 하지 않고 행위로 하는 것처럼 했기 때문이라고 합니다.","s":3745.656,"e":3751.75,"p":false,"h":false},{"t":"하나님의 주권과 사람의 책임이 한 장 안에서 나란히 나옵니다.","s":3752.388,"e":3756.423,"p":false,"h":false},{"t":"10장은 이 책임 쪽을 이어서 다룹니다.","s":3756.996,"e":3759.725,"p":true,"h":false},{"t":"이 장을 읽을 때","s":3760.596,"e":3761.999,"p":true,"h":false},{"t":"성경 로마서 9장을 읽으실 때 붙잡을 것은 두 가지입니다.","s":3762.864,"e":3767.083,"p":false,"h":false},{"t":"하나는 1절부터 3절에 나오는 바울의 마음입니다.","s":3767.724,"e":3771.302,"p":false,"h":false},{"t":"이 장을 하나님의 차가운 선택 이야기로만 읽지 마시고, 동족 때문에 가슴이 찢어지는 사람이 쓴 글이라는 것을 기억하며 읽으십시오.","s":3771.9,"e":3780.668,"p":false,"h":false},{"t":"다른 하나는 16절입니다.","s":3781.188,"e":3783.144,"p":false,"h":false},{"t":"구원 ,"e":5499.544,"p":false,"h":false},{"t":"그러나 15절은 이렇게 말합니다.","s":5500.188,"e":5502.667,"p":false,"h":false},{"t":"음식 때문에 형제가 근심하게 된다면, 그것은 더 이상 사랑으로 행하는 것이 아닙니다.","s":5503.284,"e":5509.09,"p":false,"h":false},{"t":"그리스도가 위하여 죽으신 형제를 네 음식으로 망하게 하지 말라고 합니다.","s":5509.728,"e":5514.297,"p":true,"h":false},{"t":"17절은 이 단락의 중심 문장입니다.","s":5515.164,"e":5518.083,"p":false,"h":false},{"t":"하나님의 나라는 먹는 것과 마시는 것이 아니요, 오직 성령 안에 있는 의와 평강과 희락이라.","s":5518.692,"e":5525.002,"p":false,"h":false},{"t":"우리가 서로 다투는 많은 문제들이, 정작 하나님 나라의 본질은 아니라는 말입니다.","s":5525.64,"e":5531.359,"p":false,"h":false},{"t":"그래서 평화에 이르는 일과 서로의 덕을 세우는 일을 힘쓰라고 합니다.","s":5532.012,"e":5536.567,"p":false,"h":false},{"t":"마지막 22절과 23절은, 각자 가진 믿음을 하나님 앞에서 가지라고 하며, 의심하면서 먹는 사람은 믿음으로 하지 않았기 때문에 정죄를 받는다고 합니다.","s":5537.196,"e":5547.786,"p":false,"h":false},{"t":"믿음으로 하지 아니하는 모든 것은 죄입니다.","s":5548.356,"e":5551.349,"p":true,"h":false},{"t":"구절 풀이","s":5552.208,"e":5553.261,"p":true,"h":false},{"t":"14장 1절의 믿음이 연약한 사람은, 믿음이 없는 사람이 아닙니다.","s":5554.116,"e":5559.093,"p":false,"h":false},{"t":"그리스도 안에서 누리는 자유를 아직 다 이해하지 못해서 양심이 걸리는 사람을 가리킵니다.","s":5559.732,"e":5566.009,"p":false,"h":false},{"t":"이 연약함은 구원의 문제가 아니라 양심의 문제입니다.","s":5566.644,"e":5570.696,"p":true,"h":false},{"t":"14장 2절부터 6절의 문제가 구체적으로 무엇이었는지 본문은 자세히 말하지 않습니다.","s":5571.576,"e":5577.619,"p":false,"h":false},{"t":"유대인의 음식 규정, 우상에게 바쳤던 고기를 먹는 문제, 안식일과 절기를 지키는 문제 등으로 읽는 견해가 있습니다.","s":5578.236,"e":5586.606,"p":false,"h":false},{"t":"중요한 것은 구체적인 문제보다, 이런 문제를 대하는 태도입니다.","s":5587.236,"e":5592.154,"p":true,"h":false},{"t":"14장에서 바울의 입장은 자유로운 쪽, 곧 강한 쪽에 가깝습니다.","s":5593.068,"e":5598.037,"p":false,"h":false},{"t":"14절과 15장 1절에서 그렇게 말합니다.","s":5598.72,"e":5601.78,"p":false,"h":false},{"t":"그러나 바울은 강한 사람에게 더 큰 책임을 묻습니다.","s":5602.392,"e":5606.07,"p":false,"h":false},{"t":"자유가 있는 사람이 자유 때문에 형제를 무너뜨리면 안 된다는 것입니다.","s":5606.712,"e":5611.23,"p":true,"h":false},{"t":"이 단락은 구원과 복음의 본질이 걸린 문제에는 적용되지 않습니다.","s":5612.112,"e":5616.743,"p":false,"h":false},{"t":"복음 자체가 걸린 문제에서 바울은 갈 se,"h":false},{"t":"이는 성경의 인내로 말미암아 위로로 소망을 가지게 하려 함입니다.","s":47.232,"e":51.549,"p":false,"h":false},{"t":"구약 말씀이 오늘 우리를 가르치려고 기록되었다는 것입니다.","s":52.164,"e":56.085,"p":false,"h":false},{"t":"성경을 꼼꼼히 읽어야 하는 이유가 이 구절에 있습니다.","s":56.736,"e":60.341,"p":false,"h":false},{"t":"읽다가 모르는 부분이 있어도 그냥 지나치지 않고 붙들고 읽는 사람에게, 성경은 인내와 위로와 소망을 준다고 합니다.","s":60.912,"e":68.921,"p":true,"h":false},{"t":"7절은 14장의 결론입니다.","s":69.804,"e":72.064,"p":false,"h":false},{"t":"그러므로 그리스도께서 너희를 받아들이신 것같이 너희도 서로 받아서 하나님께 영광을 돌리라.","s":72.72,"e":79.029,"p":false,"h":false},{"t":"원수였을 때 우리를 받아 주신 그리스도를 기억한다면, 서로 받아들이기를 거부할 이유가 없습니다.","s":79.668,"e":86.371,"p":true,"h":false},{"t":"8절부터 12절은 로마서 전체의 주제를 모아 보여 줍니다.","s":87.228,"e":91.37,"p":false,"h":false},{"t":"그리스도는 하나님의 진실하심을 위해 할례받은 사람들의 종이 되셨고, 동시에 이방인들이 하나님의 긍휼하심을 인하여 영광을 돌리게 하려 하셨습니다.","s":91.98,"e":101.786,"p":false,"h":false},{"t":"바울은 이를 증명하려고 구약에서 연달아 인용합니다.","s":102.42,"e":106.163,"p":false,"h":false},{"t":"율법과 선지자와 시편에서, 이방인이 하나님을 찬송한다는 구절을 이어 붙입니다.","s":106.74,"e":112.337,"p":false,"h":false},{"t":"그리고 마지막 인용이 이사야 11장입니다.","s":112.968,"e":116.008,"p":false,"h":false},{"t":"이새의 뿌리가 나서 이방인을 다스리러 일어나실 것이니, 이방인들이 그에게 소망을 두리라.","s":116.64,"e":122.976,"p":false,"h":false},{"t":"이사야서를 읽으신 분이라면 반가운 구절입니다.","s":123.516,"e":126.894,"p":false,"h":false},{"t":"13절은 이 모든 말씀을 기도로 맺습니다.","s":127.548,"e":130.63,"p":false,"h":false},{"t":"소망의 하나님이 모든 기쁨과 평강을 너희에게 충만하게 하사, 성령의 능력으로 소망이 넘치게 하시기를 원한다.","s":131.184,"e":138.65,"p":true,"h":false},{"t":"14절부터는 편지를 마무리하는 개인적인 이야기입니다.","s":139.536,"e":143.465,"p":false,"h":false},{"t":"바울은 로마 교인들이 선함이 가득하고 서로 권면할 수 있는 사람들이라고 인정합니다.","s":144.072,"e":149.457,"p":false,"h":false},{"t":"그런데도 담대하게 썼다고 합니다.","s":150.084,"e":152.462,"p":false,"h":false},{"t":"자기가 이방인을 위한 그리스도의 일꾼으로서, 하나님의 복음을 전하는 제사장 같은 직분을 맡았기 때문입니다.","s":153.072,"e":160.169,"p":false,"h":false},{"t":"그의 목표는 복음이 아직 전해지지 않은 곳에 복음을 전하는 것이었습니다.","s":160.74,"e":165.646,"p":false,"h":false},{"t":"그래서 이사야 52장의 말씀을 인용합니다.","s":166.284,"e":169.578,"p":false,"h":false},{"t":"그에 대한 소식을 받지 못한 사람들이 볼 것이며, 듣지 못한 사람들이 깨달으리라.","s":170.208,"e":175.699,"p":true,"h":false},{"t":"22절부터 33절은 바울의 계획입니다.","s":176.544,"e":179.9,"p":false,"h":false},{"t":"그는 로마에 가 보기를 오래 원했고, 스페인으로 가는 길에 로마를 들르려고 합니다.","s":180.504,"e":186.324,"p":false,"h":false},{"t":"그런데 먼저 해야 할 일이 있습니다.","s":186.984,"e":189.382,"p":false,"h":false},{"t":"마게도냐와 아가야 교회들이 모은 구제 헌금을 가지고 예루살렘으로 가는 일입니다.","s":189.972,"e":195.203,"p":false,"h":false},{"t":"그리고 그는 로마 교인들에게 간곡히 부탁합니다.","s":195.84,"e":199.38,"p":false,"h":false},{"t":"나와 함께 힘을 다하여 나를 위하여 하나님께 기도하라.","s":199.98,"e":203.695,"p":false,"h":false},{"t":"유대의 순종하지 않는 사람들에게서 건짐을 받고, 예루살렘에 대한 내 섬김이 성도들에게 받아들여지도록 기도해 달라는 것입니다.","s":204.336,"e":212.514,"p":true,"h":false},{"t":"이 기도가 어떻게 응답되었는지는 사도행전에서 보았습니다.","s":213.408,"e":217.602,"p":false,"h":false},{"t":"바울은 예루살렘에서 체포되었고, 재판을 받고, 가이사랴에서 갇혀 지내다가, 죄수의 몸으로 로마에 도착했습니다.","s":218.268,"e":226.887,"p":false,"h":false},{"t":"바울이 기도한 모양과 하나님이 응답하신 모양은 달랐습니다.","s":227.484,"e":231.412,"p":false,"h":false},{"t":"그러나 바울은 로마에 도착했고, 거기서 거침없이 복음을 전했습니다.","s":232.056,"e":237.2,"p":true,"h":false},{"t":"구절 풀이","s":238.104,"e":239.157,"p":true,"h":false},{"t":"15장 4절은 성경을 읽는 이유를 말하는 구절입니다.","s":240.012,"e":243.578,"p":false,"h":false},{"t":"여기서 전에 기록된 것은 구약을 가리키지만, 신약도 같은 원리로 읽는 것이 일반적입니다.","s":244.224,"e":250.416,"p":false,"h":false},{"t":"성경은 정보를 주려고 기록된 것이 아니라, 읽는 사람이 인내하고 위로를 받아 소망을 가지게 하려고 기록되었습니다.","s":251.064,"e":258.593,"p":true,"h":false},{"t":"15장 8절의 할례받은 사람들의 종이 되셨다는 말은, 그리스도가 먼저 이스라엘에게 약속을 이루러 오셨다는 뜻입니다.","s":259.452,"e":267.522,"p":false,"h":false},{"t":"이 점이 이방인에게도 은혜가 열린 일을 더욱 놀랍게 만듭니다.","s":268.164,"e":272.366,"p":true,"h":false},{"t":"15장 16절의 제사장 직분은, 복음을 전하는 일을 제사장의 예배에 비유한 말입니다.","s":273.24,"e":279.205,"p":false,"h":false},{"t":"이방인이 하나님께 받아들여지는 제물이 되게 하는 것이 바울이 맡은 일이라는 뜻입니다.","s":279.864,"e":285.683,"p":true,"h":false},{"t":"15장 19절의 일루리곤은 지금의 발칸반도 서쪽 지역을 가리키는 것으로 알려져 있습니다.","s":286.596,"e":292.658,"p":false,"h":false},{"t":"15장 24절의 스페인에 바울이 실제로 갔는지는 성경이 기록하지 않습     $('tot').textContent = fmt(t.dur); $('cur').textContent = '0:00'; $('fill').style.width = '0%';
    if (curSrc !== t.audio) { curSrc = t.audio; audio.src = t.audio; applySpd(); }
    try { audio.currentTime = t.start; } catch (e) {}
    /* 앞 글·다음 글 */
    const pt = $('pt'), nt = $('nt');
    pt.style.display = k > 0 ? '' : 'none'; if (k > 0) { pt.title = '앞 글: ' + TRACKS[k - 1].title; }
    nt.style.display = k < N - 1 ? '' : 'none'; if (k < N - 1) { nt.title = '다음 글: ' + TRACKS[k + 1].title; }
    if (k < N - 1) { $('nvname').textContent = TRACKS[k + 1].title; $('nvgo').href = '#' + (k + 2); $('nvcard').style.display = 'block'; } else { $('nvcard').style.display = 'none'; }
    /* 이어 듣기 */
    const r = $('resume'); r.style.display = 'none';
    const pos = parseFloat(pref('pos' + k));
    if (pos > 10 && pos < (t.dur || 1e9) - 5) {
      r.style.display = 'block';
      r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
      $('rb').onclick = () => { seek(t.start + pos); r.style.display = 'none'; play(); };
    }
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function go(nk, autoplay) {
    if (nk < 0 || nk >= N) { return; }
    try { history.pushState(null, '', '#' + (nk + 1)); } catch (e) { try { location.hash = '#' + (nk + 1); } catch (x) {} }
    render(nk);
    if (autoplay) { play(); }
  }
  function hashK() { const m = /^#(\d+)/.exec(location.hash || ''); if (m) { const q = parseInt(m[1], 10) - 1; if (q >= 0 && q < N) { return q; } } return 0; }
  window.addEventListener('hashchange', () => { const q = hashK(); if (q !== k) { render(q); } });
  (function () { const tl = $('tolist'); if (LIST) { tl.href = LIST; tl.style.display = 'inline-block'; } })();

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('pt').onclick = () => go(k - 1, false);
  $('nt').onclick = () => go(k + 1, true);
  $('nvgo').onclick = e => { e.preventDefault(); go(k + 1, true); };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); armEnd(); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); seek(T().start + ((e.clientX - r.left) / r.width) * (T().dur || 0)); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  render(hashK());

  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, go, seek, toggle, audio, TRACKS, state: () => ({ k, playing, curSrc }) };
})();
</script>
</body>
</html>
