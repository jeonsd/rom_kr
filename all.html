(function () {
  const TITLE = "로마서 해설서", TRACKS = [{"title":"로마서 시작하기 전에","audio":"book_2610300218_1.mp3","start":0,"end":366.516,"dur":366.5,"segs":[{"t":"로마서 시작하기 전에","s":0,"e":1.745,"p":true,"h":false},{"t":"이 해설서는 이렇게 쓰십시오","s":2.484,"e":4.809,"p":true,"h":false},{"t":"이 해설서는 성경 로마서를 대신하는 글이 아닙니다.","s":5.472,"e":9.106,"p":false,"h":false},{"t":"성경을 더 잘 읽게 하려고 만든 글입니다.","s":9.648,"e":12.657,"p":false,"h":false},{"t":"쓰는 방법은 간단합니다.","s":13.176,"e":15.17,"p":false,"h":false},{"t":"해설서 한 장을 듣고, 이어서 성경 로마서 같은 장을 읽거나 유튜브로 들으십시오.","s":15.768,"e":21.72,"p":false,"h":false},{"t":"그리고 다시 다음 장 해설서를 듣고, 다음 장 성경을 읽으십시오.","s":22.212,"e":27.076,"p":false,"h":false},{"t":"이렇게 한 장씩 번갈아 가면 됩니다.","s":27.54,"e":29.973,"p":true,"h":false},{"t":"성경은 정독해야 제 맛이 납니다.","s":30.816,"e":33.369,"p":false,"h":false},{"t":"그런데 잘 모르는 내용이 섞여 있으면, 자꾸 그냥 지나치며 대충 읽게 됩니다.","s":33.984,"e":39.627,"p":false,"h":false},{"t":"해설서는 그 걸리는 곳을 미리 알려 드립니다.","s":40.176,"e":43.493,"p":false,"h":false},{"t":"그러니 성경을 읽다가 모르는 곳이 나와도 지나치지 마시고 붙잡고 읽으십시오.","s":44.028,"e":48.974,"p":false,"h":false},{"t":"해설서에서 들은 표지가 거기 서 있을 것입니다.","s":49.608,"e":52.839,"p":true,"h":false},{"t":"로마서는 어떤 편지인가","s":53.676,"e":55.686,"p":true,"h":false},{"t":"로마서는 바울이 로마에 있는 신자들에게 보낸 편지입니다.","s":56.556,"e":60.475,"p":false,"h":false},{"t":"바울은 고린도에 머물 때 이 편지를 썼다고 읽는 것이 일반적이고, 서기 오십 년대의 일입니다.","s":61.056,"e":67.541,"p":false,"h":false},{"t":"바울은 로마에 가 본 적이 없었습니다.","s":68.184,"e":70.991,"p":false,"h":false},{"t":"그래서 얼굴도 모르는 신자들에게 자기가 전하는 복음이 무엇인지를 처음부터 차근차근 설명한 글이 로마서입니다.","s":71.604,"e":78.851,"p":true,"h":false},{"t":"로마서가 어려운 이유는 세 가지입니다.","s":79.74,"e":82.426,"p":false,"h":false},{"t":"첫째, 이야기가 아니라 논증이기 때문입니다.","s":83.016,"e":86.644,"p":false,"h":false},{"t":"그러므로, 왜냐하면, 그런즉 같은 말로 이어지기 때문에 한 구절을 놓치면 뒤가 이해되지 않습니다.","s":87.264,"e":94.495,"p":false,"h":false},{"t":"둘째, 낯선 낱말이 많기 때문입니다.","s":95.184,"e":98.465,"p":false,"h":false},{"t":"셋째, 질문과 대답이 섞여 있기 때문입니다.","s":99.036,"e":102.689,"p":false,"h":false},{"t":"바울은 가상의 반대자를 세워 놓고 그러면 어떠하냐, 그러면 죄에 머물러도 십시오.","s":1472.904,"e":1475.657,"p":true,"h":false}]},{"title":"로마서 4장","audio":"book_2610300218_1.mp3","start":1476.468,"end":1880.424,"dur":404,"segs":[{"t":"로마서 4장","s":1476.468,"e":1477.729,"p":true,"h":false},{"t":"전체 흐름","s":1478.556,"e":1479.69,"p":true,"h":false},{"t":"지난 3장에서 바울은 로마서 전체의 열쇠를 열었습니다.","s":1480.572,"e":1484.628,"p":false,"h":false},{"t":"하나님의 의가 율법과 상관없이 나타났고, 그것이 값없이 은혜로, 믿는 모든 사람에게 주어진다고 했습니다.","s":1485.252,"e":1493.418,"p":false,"h":false},{"t":"그리고 사람에게는 자랑할 것이 없다고 했습니다.","s":1494.072,"e":1497.339,"p":true,"h":false},{"t":"이 말을 들은 유대인은 이렇게 반문할 것입니다.","s":1498.14,"e":1501.434,"p":false,"h":false},{"t":"그것은 우리 조상들이 믿어 온 것과 다른 새로운 가르침이 아닙니까.","s":1502.064,"e":1506.6,"p":false,"h":false},{"t":"우리가 가장 존경하는 조상 아브라함은 어떻습니까.","s":1507.212,"e":1510.518,"p":false,"h":false},{"t":"아브라함은 순종으로 인정받은 사람이 아닙니까.","s":1511.172,"e":1514.255,"p":false,"h":false},{"t":"4장은 이 질문에 대한 대답입니다.","s":1514.844,"e":1517.375,"p":false,"h":false},{"t":"바울은 새로운 가르침이라고 의심하는 사람에게, 가장 오래된 증거를 가져옵니다.","s":1518.048,"e":1523.809,"p":false,"h":false},{"t":"바로 아브라함입니다.","s":1524.42,"e":1526.073,"p":true,"h":false},{"t":"바울은 창세기 15장 6절을 가져옵니다.","s":1526.976,"e":1529.957,"p":false,"h":false},{"t":"아브라함이 하나님을 믿으니, 그것이 그에게 의로 여겨졌다는 말씀입니다.","s":1530.504,"e":1535.85,"p":false,"h":false},{"t":"여기서 여겨졌다는 말은 장부에 기록한다는 뜻의 계산하는 말입니다.","s":1536.48,"e":1540.858,"p":false,"h":false},{"t":"아브라함이 의로운 일을 해서 의로운 사람이 된 것이 아니라, 하나님이 그의 장부에 의를 적어 넣어 주셨다는 것입니다.","s":1541.484,"e":1549.102,"p":true,"h":false},{"t":"그리고 4절과 5절이 이 장에서 가장 놀라운 구절입니다.","s":1549.98,"e":1553.886,"p":false,"h":false},{"t":"일한 사람에게 주는 품삯은 은혜가 아니라 마땅히 받을 빚입니다.","s":1554.48,"e":1558.662,"p":false,"h":false},{"t":"그러나 일하지 않아도, 경건하지 않은 사람을 의롭다 하시는 분을 믿는 사람은, 그 믿음이 의로 여겨집니다.","s":1559.232,"e":1566.759,"p":false,"h":false},{"t":"사람의 상식은 이렇습니다.","s":1567.368,"e":1569.31,"p":false,"h":false},{"t":"하나님이 의롭다고 해 주시는 대상은 경건한 사람, 착하게 산 사람이어야 합니다.","s":1569.636,"e":1575.417,"p":false,"h":false},{"t":"그런데 바울은 경건하지 않은 자를 의롭다 하시는 분이라고 합니다.","s":1576.08,"e":1580.268,"p":false,"h":false},{"t":"이 말을 처음 들으면 숨이 멎을 만큼 놀랍습니다.","s":1580.904,"e":1584.507,"p":false,"h":false},{"t":"하나님은 착한 사람이 아니라 죄인을 의롭다 하시는 분입니다.","s":1585.116,"e":1589.446,"p":true,"h":false},{"t":"바울은 이어서 다윗을 증인으로 세웁니다.","s":1590.264,"e":1593.06,"p":false,"h":false},{"t":"다윗은 시편에서, 행위와 상관없이 하나님께 의를 인정받는 사람의 복을 말했습니다.","s":1593.684,"e":1599.806,"p":false,"h":false},{"t":"죄가 가려진 사람, 주께서 죄를 계산하지 않으시는 사람이 복이 있다고 합니다.","s":1600.452,"e":1605.837,"p":true,"h":false},{"t":"그다음 질문은 이것입니다.","s":1606.752,"e":1608.694,"p":false,"h":false},{"t":"이 복이 할례받은 사람에게만 해당합니까.","s":1609.308,"e":1612.099,"p":false,"h":false},{"t":"바울은 순서를 짚습니다.","s":1612.728,"e":1614.707,"p":false,"h":false},{"t":"아브라함이 의롭다고 여김을 받은 것은 창세기 15장이고, 할례를 받은 것은 17장입니다.","s":1615.356,"e":1621.723,"p":false,"h":false},{"t":"의롭다는 판결이 먼저였고, 할례는 그 뒤에 받은 표였습니다.","s":1622.412,"e":1627.013,"p":false,"h":false},{"t":"그래서 아브라함은 할례받지 않고 믿는 사람들의 조상도 되고, 할례받은 사람들 가운데 믿음의 길을 따르는 사람들의 조상도 됩니다.","s":1627.632,"e":1636.324,"p":true,"h":false},{"t":"약속도 같습니다.","s":1637.208,"e":1638.691,"p":false,"h":false},{"t":"약속이 율법을 통해 온 것이라면, 믿음은 쓸모없어지고 약속은 무효가 됩니다.","s":1639.332,"e":1645.087,"p":false,"h":false},{"t":"그러나 믿음으로 받는 것이므로 은혜이고, 그래서 모든 후손에게 확실합니다.","s":1645.668,"e":1650.958,"p":true,"h":false},{"t":"17절부터 22절은 아브라함의 믿음이 어떤 것인지를 보여 줍니다.","s":1651.86,"e":1656.629,"p":false,"h":false},{"t":"아브라함은 약속을 받았을 때 거의 백 살이었고, 사라의 태도 이미 열매를 맺을 수 없는 상태였습니다.","s":1657.296,"e":1664.318,"p":false,"h":false},{"t":"사람의 눈으로 볼 때는 소망이 없는 자리였습니다.","s":1664.964,"e":1668.331,"p":false,"h":false},{"t":"그러나 그는 바랄 수 없는 중에도 바라고 믿었다고 합니다.","s":1668.6,"e":1672.476,"p":false,"h":false},{"t":"이 믿음은 자기 안에서 짜낸 힘이 아닙니다.","s":1673.1,"e":1676.091,"p":false,"h":false},{"t":"죽은 자를 살리시고, 없는 것을 있는 것처럼 부르시는 하나님을 바라보는 것입니다.","s":1676.736,"e":1682.345,"p":false,"h":false},{"t":"믿음의 크기가 아니라 믿음의 대상이 이 장의 중심입니다.","s":1683,"e":1687.133,"p":true,"h":false},{"t":"마지막 23절부터 25절에서 바울은, 이 말씀이 아브라함만을 위해 기록된 것이 아니라 우리를 위한 것이라고 합니다.","s":1688.04,"e":1696.58,"p":false,"h":false},{"t":"예수님을 죽은 자 가운데서 살리신 분을 믿는 우리에게도 의로 여겨진다는 것입니다.","s":1697.256,"e":1702.912,"p":false,"h":false},{"t":"예수님은 우리의 범죄 때문에 내주신 바 되었고, 우리를 의롭다 하시기 위해 살아나셨습니다.","s":1703.556,"e":1709.711,"p":true,"h":false},{"t":"구절 풀이","s":1710.576,"e":1711.629,"p":true,"h":false},{"t":"4장 3절의 여겨졌다는 말은, 계산하다, 장부에 기록하다는 뜻입니다.","s":1712.484,"e":1718.172,"p":false,"h":false},{"t":"이 장에서 여러 번 되풀이되는 열쇠 단어입니다.","s":1718.856,"e":1722.146,"p":false,"h":false},{"t":"의를 얻은 사람이 의로운 사람으로 변했다는 뜻이 아니라, 하나님이 그에게 의를 계산해 주셨다는 뜻입니다.","s":1722.78,"e":1729.953,"p":true,"h":false},{"t":"4장 5절의 경건하지 않은 자를 의롭다 하신다는 말은, 읽는 사람이 가장 걸리는 구절입니다.","s":1730.844,"e":1736.991,"p":false,"h":false},{"t":"하나님이 불의를 눈감아 주신다는 말이 아닙니다.","s":1737.648,"e":1740.789,"p":false,"h":false},{"t":"3장 25절에서 본 것처럼, 죄의 값이 그리스도 안에서 이미 치러졌기 때문에, 그 위에서 의롭다고 선언하시는 것입니다.","s":1741.32,"e":1750.066,"p":true,"h":false},{"t":"4장 3절의 믿음은, 아브라함이 한 행위처럼 보이지만 공로가 아닙니다.","s":1750.896,"e":1756.116,"p":false,"h":false},{"t":"믿음 자체가 값어치가 있어서 의로 쳐 주신 것이 아니라, 믿음은 하나님이 주시는 것을 받는 빈손입니다.","s":1756.692,"e":1763.758,"p":false,"h":false},{"t":"야고보서 2장에서는 아브라함이 행함으로 의롭다 함을 받았다고 하는데, 이 말과 부딪히는 것 아니냐는 질문이 자주 나옵니다.","s":1764.396,"e":1772.788,"p":false,"h":false},{"t":"야고보는 믿음이 있다고 말하는 사람이 정말 그런지를 보여 주는 증거로서의 행위를 말하고, 바울은 하나님 앞에서 의가 어떻게 계산되는지를 말하므로, 서로 다른 질문에 답하는 것으로 읽는 것이 일반적입니다.","s":1773.432,"e":1787.313,"p":true,"h":false},{"t":"4장 11절의 표는, 할례가 의의 도장이었다는 뜻입니다.","s":1788.228,"e":1792.411,"p":false,"h":false},{"t":"도장은 이미 이루어진 계약에 찍는 것입니다.","s":1793.052,"e":1796.132,"p":false,"h":false},{"t":"이미 받은 의가 먼저이고, 표는 그 뒤에 온 것입니다.","s":1796.724,"e":1800.877,"p":true,"h":false},{"t":"4장 17절의 죽은 자를 살리시며 없는 것을 있는 것처럼 부르시는 하나님은, 믿음의 대상이 누구인지를 한 문장으로 보여 줍니다.","s":1801.764,"e":1810.225,"p":false,"h":false},{"t":"아브라함의 믿음은 자기 안의 확신이 아니라, 이런 하나님을 향한 것이었습니다.","s":1810.836,"e":1815.967,"p":true,"h":false},{"t":"4장 25절의 우리를 의롭다 하시기 위해 살아나셨다는 말은, 부활이 십자가와 함께 구원의 일부라는 뜻으로 읽습니다.","s":1816.884,"e":1824.702,"p":false,"h":false},{"t":"십자가에서 죄 문제가 해결되었고, 부활로 그 일이 하나님께 받아들여졌다는 확증이 되었다는 읽기가 널리 알려져 있습니다.","s":1825.344,"e":1833.554,"p":true,"h":false},{"t":"이 장을 읽을 때","s":1834.452,"e":1835.855,"p":true,"h":false},{"t":"성경 로마서 4장을 읽으실 때 붙잡을 것은 4절과 5절입니다.","s":1836.72,"e":1841.242,"p":false,"h":false},{"t":"일한 사람과 일하지 않은 사람의 차이를 놓치지 마십시오.","s":1841.868,"e":1845.478,"p":false,"h":false},{"t":"그리고 경건하지 않은 자를 의롭다 하신다는 말이 얼마나 놀라운 말인지 천천히 읽으십시오.","s":1845.936,"e":1851.912,"p":false,"h":false},{"t":"이 장의 줄거리는 간단합니다.","s":1852.416,"e":1854.635,"p":false,"h":false},{"t":"아브라함은 믿음으로 의롭다 함을 받았고, 그것이 우리에게도 똑같다는 것입니다.","s":1855.296,"e":1860.889,"p":true,"h":false},{"t":"다음 5장에서는 지금까지의 논증이 한곳에 모입니다.","s":1861.776,"e":1865.468,"p":false,"h":false},{"t":"그렇게 의롭다 함을 받은 사람에게 무슨 일이 일어나는지를 말합니다.","s":1866.06,"e":1870.554,"p":false,"h":false},{"t":"평화와 소망이 오고, 한 사람 아담과 한 사람 그리스도가 대조됩니다.","s":1871.172,"e":1876.053,"p":true,"h":false},{"t":"이제 성경 로마서 4장을 읽으십시오.","s":1876.932,"e":1879.65,"p":true,"h":false}]},{"title":"로마서 5장","audio":"book_2610300218_1.mp3","start":1880.424,"end":2221.128,"dur":340.7,"segs":[{"t":"로마서 5장","s":1880.424,"e":1881.717,"p":true,"h":false},{"t":"전체 흐름","s":1882.512,"e":1883.646,"p":true,"h":false},{"t":"지난 4장에서 바울은 아브라함을 통해, 의롭다 함이 행위가 아니라 믿음으로 온다는 것을 보여 주었습니다.","s":1884.528,"e":1891.532,"p":false,"h":false},{"t":"이제 5장은, 이렇게 의롭다 함을 받은 사람에게 무슨 일이 일어나는지를 말합니다.","s":1892.16,"e":1897.841,"p":false,"h":false},{"t":"1장부터 4장이 어떻게 의롭다 함을 받는가였다면, 5장부터는 의롭다 함을 받은 사람이 어디에 서 있는가로 넘어갑니다.","s":1898.46,"e":1906.477,"p":false,"h":false},{"t":"그래서 5장은 앞과 뒤를 잇는 다리 같은 장입니다.","s":1907.136,"e":1910.839,"p":true,"h":false},{"t":"1절은 이렇게 시작합니다.","s":1911.708,"e":1913.761,"p":false,"h":false},{"t":"그러므로 우리가 믿음으로 의롭다 하심을 받았으니, 하나님과 화평을 누립니다.","s":1914.408,"e":1919.88,"p":false,"h":false},{"t":"화평은 마음이 편안하다는 감정이 아니라 관계의 이름입니다.","s":1920.528,"e":1924.772,"p":false,"h":false},{"t":"하나님과 원수였던 관계가 끝났다는 말입니다.","s":1925.424,"e":1928.805,"p":false,"h":false},{"t":"그리고 우리는 이 은혜 안에 들어서 있고, 하나님의 영광을 바라며 즐거워한다고 합니다.","s":1929.384,"e":1935.356,"p":false,"h":false},{"t":"심지어 환난 중에도 즐거워한다고 합니다.","s":1935.972,"e":1938.779,"p":false,"h":false},{"t":"환난이 인내를, 인내가 연단을, 연단이 소망을 이루는 줄 알기 때문입니다.","s":1939.032,"e":1944.663,"p":false,"h":false},{"t":"그리고 이 소망은 부끄럽게 하지 않는다고 합니다.","s":1945.296,"e":1948.662,"p":false,"h":false},{"t":"하나님의 사랑이 성령으로 우리 마음에 부어졌기 때문입니다.","s":1949.292,"e":1953.397,"p":true,"h":false},{"t":"6절부터 11절에서 바울은 이 사랑이 어떤 사랑인지를 말하는데, 여기가 이 장에서 가장 놀라운 곳입니다.","s":1954.26,"e":1961.667,"p":false,"h":false},{"t":"먼저 사람의 상식을 생각해 보십시오.","s":1962.324,"e":1964.95,"p":false,"h":false},{"t":"사람이 누군가를 위해 목숨을 내놓는 경우는 어떤 때입니까.","s":1965.456,"e":1969.383,"p":false,"h":false},{"t":"7절은 의로운 사람을 위해 죽는 사람은 드물고, 선한 사람을 위해서라면 혹시 용감히 죽을 사람이 있을지 모른다고 합니다.","s":1969.992,"e":1978.359,"p":false,"h":false},{"t":"존경할 만한 사람, 사랑스러운 사람을 위해서라면 목숨을 거는 사람이 간혹 있다는 것입니다.","s":1978.992,"e":1985.164,"p":true,"h":false},{"t":"그런데 하나님은 어떻게 하셨습니까.","s":1986.084,"e":1988.416,"p":false,"h":false},{"t":"우리가 아직 연약할 때, 우리가 아직 죄인이었을 때, 그리스도가 우리를 위해 죽으셨다고 합니다.","s":1989.036,"e":1995.792,"p":false,"h":false},{"t":"10절은 더 나아가, 우리가 원수였을 때라고 합니다.","s":1996.416,"e":2000.285,"p":false,"h":false},{"t":"회개하고 돌아온 다음이 아닙니다.","s":2000.916,"e":2003.288,"p":false,"h":false},{"t":"하나님을 대적하고 있을 때, 아직 등을 돌리고 있을 때, 하나님이 먼저 자기 아들을 내주셨습니다.","s":2003.94,"e":2010.487,"p":false,"h":false},{"t":"사람의 사랑은 상대가 사랑스러워서 시작되지만, 하나님의 사랑은 상대가 원수일 때 시작되었습니다.","s":2011.104,"e":2017.921,"p":false,"h":false},{"t":"그러니 원수였을 때 이미 화목하게 하셨다면, 이제 화목한 사람을 끝까지 구원하시는 것은 얼마나 더 확실하겠느냐는 것이 바울의 논리입니다.","s":2018.52,"e":2028.09,"p":true,"h":false},{"t":"12절부터 21절은 이 장의 두 번째 큰 부분입니다.","s":2028.996,"e":2033.251,"p":false,"h":false},{"t":"바울은 시야를 확 넓혀서, 한 사람 아담과 한 사람 그리스도를 나란히 세웁니다.","s":2033.784,"e":2039.316,"p":false,"h":false},{"t":"한 사람 아담이 죄를 지어 죄가 세상에 들어왔고, 죄와 함께 죽음이 들어왔으며, 모든 사람이 죽음 아래 있게 되었다고 합니다.","s":2039.976,"e":2048.556,"p":false,"h":false},{"t":"이 말은 처음 읽으면 불공평하게 들릴 수 있습니다.","s":2049.192,"e":2052.81,"p":false,"h":false},{"t":"그런데 바울은 이 이야기를 정죄하려고 꺼낸 것이 아닙니다.","s":2053.404,"e":2057.451,"p":false,"h":false},{"t":"같은 구조로 뒤집으려고 꺼낸 것입니다.","s":2058.084,"e":2060.803,"p":false,"h":false},{"t":"한 사람 때문에 죽음이 왕 노릇 했다면, 한 사람 예수 그리스도 때문에, 은혜와 의의 선물을 넘치게 받는 사람들은 생명 안에서 왕 노릇 할 것이라고 합니다.","s":2061.072,"e":2071.294,"p":true,"h":false},{"t":"15절에서 17절 사이에는 더욱이라는 말이 반복됩니다.","s":2071.872,"e":2075.831,"p":false,"h":false},{"t":"한 사람의 범죄가 그렇게 큰 영향을 미쳤다면, 한 사람 그리스도의 은혜는 더욱 크다는 것입니다.","s":2076.48,"e":2082.965,"p":false,"h":false},{"t":"20절은 율법이 들어와서 죄가 더 드러나고 많아졌지만, 죄가 더한 곳에 은혜가 더욱 넘쳤다고 합니다.","s":2083.572,"e":2090.35,"p":false,"h":false},{"t":"이 말이 6장의 질문을 부릅니다.","s":2090.988,"e":2093.641,"p":false,"h":false},{"t":"그렇다면 은혜가 더 넘치도록 죄를 더 지어도 되는 것 아닙니까.","s":2094.3,"e":2098.621,"p":true,"h":false},{"t":"구절 풀이","s":2099.484,"e":2100.537,"p":true,"h":false},{"t":"5장 1절의 화평을 누린다는 말은, 사본에 따라 누리자로 읽기도 합니다.","s":2101.392,"e":2106.384,"p":false,"h":false},{"t":"어느 쪽이든 그 화평은 우리가 만들어 내는 것이 아니라, 의롭다 함을 받은 결과로 주어진 사실입니다.","s":2107.008,"e":2113.731,"p":true,"h":false},{"t":"5장 3절의 환난 중에도 즐거워한다는 말은, 고난을 좋아하라는 뜻이 아닙니다.","s":2114.604,"e":2119.972,"p":false,"h":false},{"t":"고난이 목적이 아니라, 그 고난 속에서 하나님의 사랑이 확인된다는 뜻으로 읽습니다.","s":2120.616,"e":2126.272,"p":true,"h":false},{"t":"5장 12절의 모든 사람이 죄를 지었으므로는 해석이 갈리는 곳입니다.","s":2127.168,"e":2131.724,"p":false,"h":false},{"t":"아담이 모든 사람의 대표여서 그 안에서 모두가 죄인이 되었다고 읽는 견해가 있고, 모든 사람이 각자 죄를 지었기 때문이라고 읽는 견해가 있습니다.","s":2132.316,"e":2142.281,"p":false,"h":false},{"t":"개혁신학은 대개 앞쪽으로 읽습니다.","s":2142.864,"e":2145.591,"p":false,"h":false},{"t":"이 대표 개념이 중요한 이유는, 18절과 19절에서 그리스도가 같은 방식으로 우리의 대표가 되셨다고 말하기 때문입니다.","s":2146.212,"e":2154.269,"p":false,"h":false},{"t":"우리가 한 일이 아니라 한 사람이 한 일이 우리에게 돌아온다는 구조가 이 단락의 중심입니다.","s":2154.888,"e":2160.964,"p":true,"h":false},{"t":"5장 20절의 죄가 더한 곳에 은혜가 더욱 넘쳤다는 말은, 죄를 권하는 말이 아닙니다.","s":2161.872,"e":2167.819,"p":false,"h":false},{"t":"은혜의 크기가 죄의 크기를 넘어선다는 뜻입니다.","s":2168.496,"e":2171.838,"p":false,"h":false},{"t":"이 오해는 6장에서 정면으로 다룹니다.","s":2172.096,"e":2174.976,"p":true,"h":false},{"t":"이 장을 읽을 때","s":2175.84,"e":2177.243,"p":true,"h":false},{"t":"성경 로마서 5장을 읽으실 때 붙잡을 것은 6절부터 10절입니다.","s":2178.108,"e":2182.996,"p":false,"h":false},{"t":"연약할 때, 죄인일 때, 원수 되었을 때, 이 세 가지가 차례로 나옵니다.","s":2183.652,"e":2190.035,"p":false,"h":false},{"t":"하나님이 우리가 준비되기를 기다리지 않으셨다는 점을 놓치지 마십시오.","s":2190.636,"e":2195.132,"p":false,"h":false},{"t":"12절 이하는 어렵게 느껴지면, 한 사람 아담과 한 사람 그리스도의 대조라는 큰 틀만 잡고 가셔도 됩니다.","s":2195.676,"e":2203.02,"p":true,"h":false},{"t":"다음 6장에서는 5장 끝에서 나온 질문이 정면으로 다뤄집니다.","s":2203.92,"e":2208.212,"p":false,"h":false},{"t":"은혜를 더하게 하려고 죄에 머물러 있어도 되겠습니까.","s":2208.852,"e":2212.29,"p":false,"h":false},{"t":"은혜와 책임을 어떻게 이해해야 하는지가 여기서 풀립니다.","s":2212.92,"e":2216.697,"p":true,"h":false},{"t":"이제 성경 로마서 5장을 읽으십시오.","s":2217.6,"e":2220.387,"p":true,"h":false}]},{"title":"로마서 6장","audio":"book_2610300218_1.mp3","start":2221.128,"end":2578.752,"dur":357.6,"segs":[{"t":"로마서 6장","s":2221.128,"e":2222.534,"p":true,"h":false},{"t":"전체 흐름","s":2223.36,"e":2224.494,"p":true,"h":false},{"t":"지난 5장 끝에서 바울은, 죄가 더한 곳에 은혜가 더욱 넘쳤다고 말했습니다.","s":2225.376,"e":2230.717,"p":false,"h":false},{"t":"이 말을 들은 사람이 이렇게 반응하는 것은 자연스럽습니다.","s":2231.388,"e":2235.343,"p":false,"h":false},{"t":"그렇다면 은혜가 더 넘치도록 죄를 더 지어도 되겠네요.","s":2235.924,"e":2239.887,"p":false,"h":false},{"t":"사실 이 반응이 은혜를 처음 들은 사람의 가장 흔한 첫 반응입니다.","s":2240.568,"e":2245.048,"p":false,"h":false},{"t":"은혜로 값없이 받는다면 놀고먹어도 되는 것 아니냐는 생각입니다.","s":2245.68,"e":2250.122,"p":false,"h":false},{"t":"이 질문이 바울 당시에도 있었다는 것을 3장 8절에서 보았습니다.","s":2250.684,"e":2255.226,"p":false,"h":false},{"t":"6장은 이 질문에 대한 바울의 대답입니다.","s":2255.904,"e":2258.86,"p":true,"h":false},{"t":"1절과 2절입니다.","s":2259.72,"e":2261.212,"p":false,"h":false},{"t":"그러면 우리가 은혜를 더하게 하려고 죄에 머물러 있겠습니까.","s":2261.808,"e":2265.83,"p":false,"h":false},{"t":"그럴 수 없습니다.","s":2266.452,"e":2267.834,"p":false,"h":false},{"t":"바울은 이 질문을 길게 변명하지 않고 한마디로 물리친 뒤에 이유를 설명합니다.","s":2268.468,"e":2274.178,"p":false,"h":false},{"t":"이유는 규칙이 아니라 신분입니다.","s":2274.804,"e":2277.346,"p":false,"h":false},{"t":"죄에 대하여 죽은 우리가 어찌 그 가운데서 더 살겠느냐는 것입니다.","s":2278.008,"e":2282.542, 48,"e":2732.076,"p":false,"h":false},{"t":"우리 주 예수 그리스도로 말미암아 하나님께 감사하리로다.","s":2732.724,"e":2736.378,"p":true,"h":false},{"t":"사람이 선한 마음을 먹어도 그대로 행하지 못하는 경험은 누구에게나 있습니다.","s":2737.26,"e":2742.141,"p":false,"h":false},{"t":"7장은 이 경험이, 단순한 의지 부족이 아니라는 것을 보여 줍니다.","s":2742.768,"e":2747.629,"p":false,"h":false},{"t":"율법을 지키려는 힘으로는 이 싸움을 끝낼 수 없습니다.","s":2748.276,"e":2752.098,"p":false,"h":false},{"t":"그래서 이 탄식의 끝에 필요한 것은 더 나은 결심이 아니라 건져 주시는 분입니다.","s":2752.74,"e":2758.192,"p":false,"h":false},{"t":"이 건져 주시는 분이 어떻게 일하시는지는 8장에서 나옵니다.","s":2758.824,"e":2763.005,"p":true,"h":false},{"t":"구절 풀이","s":2763.9,"e":2764.953,"p":true,"h":false},{"t":"7장 1절에서 6절의 결혼 비유는, 세밀한 법 해석을 요구하는 비유가 아닙니다.","s":2765.808,"e":2771.311,"p":false,"h":false},{"t":"요점은 죽음이 관계를 끊는다는 것 하나입니다.","s":2771.964,"e":2775.206,"p":true,"h":false},{"t":"7장 7절에서 13절의 내가는, 율법이 오자 죄가 살아났다는 이야기입니다.","s":2776.104,"e":2781.796,"p":false,"h":false},{"t":"이것을 아담이나 이스라엘의 경험으로 읽는 견해도 있고, 바울 자신의 경험으로 읽는 견해도 있습니다.","s":2782.44,"e":2789.225,"p":true,"h":false},{"t":"7장 14절에서 25절의 내가는 해석이 크게 갈립니다.","s":2790.072,"e":2794.228,"p":false,"h":false},{"t":"첫째, 아직 그리스도를 알기 전의 바울이나 믿지 않는 사람의 경험이라고 읽는 견해가 있습니다.","s":2794.896,"e":2801.19,"p":false,"h":false},{"t":"둘째, 믿은 뒤에도 계속되는 신자의 내적 싸움이라고 읽는 견해가 있습니다.","s":2801.736,"e":2807.151,"p":false,"h":false},{"t":"개혁신학은 대개 둘째로 읽습니다.","s":2807.784,"e":2810.402,"p":false,"h":false},{"t":"이 대목이 현재형으로 말한다는 점, 하나님의 법을 즐거워한다는 말이 있다는 점이 이유로 거론됩니다.","s":2811.06,"e":2817.642,"p":false,"h":false},{"t":"첫째로 읽는 쪽은 8장 2절에서 건져졌다는 말과의 대비를 강조합니다.","s":2818.26,"e":2823.002,"p":false,"h":false},{"t":"어느 쪽으로 읽든 7장의 요점은 같습니다.","s":2823.624,"e":2826.664,"p":false,"h":false},{"t":"사람은 스스로 이 싸움을 끝낼 수 없고, 건져 주시는 분이 필요하다는 것입니다.","s":2827.224,"e":2832.731,"p":false,"h":false},{"t":"이 해설에서는 한쪽으로 단정하지 않습니다.","s":2833.38,"e":2836.437,"p":true,"h":false},{"t":"7장 24절의 곤고한 사람은 절망의 외침이지만, 25절이 곧바로 감사로 이어지기 때문에, 이 탄식은 막다른 길이 아니라 출구를 찾는 소리입니다.","s":2837.232,"e":2847.651,"p":true,"h":false},{"t":"이 장을 읽을 때","s":2848.536,"e":2849.939,"p":true,"h":false},{"t":"성경 로마서 7장을 읽으실 때 붙잡을 것은 두 가지입니다.","s":2850.804,"e":2855.163,"p":false,"h":false},{"t":"하나는 율법이 나쁜 것이 아니라는 점입니다.","s":2855.808,"e":2858.798,"p":false,"h":false},{"t":"12절을 기억하십시오.","s":2859.372,"e":2861.093,"p":false,"h":false},{"t":"다른 하나는 24절과 25절의 연결입니다.","s":2861.568,"e":2865.097,"p":false,"h":false},{"t":"탄식 바로 뒤에 감사가 나옵니다.","s":2865.456,"e":2867.752,"p":false,"h":false},{"t":"13절부터 25절을 읽다가 내가가 너무 많이 나와서 어지러우면, 내가 누구인지 따지기보다 이 사람이 무엇을 간절히 구하고 있는지를 보며 읽으십시오.","s":2868.372,"e":2878.721,"p":true,"h":false},{"t":"다음 8장은 로마서의 절정입니다.","s":2879.496,"e":2882.143,"p":false,"h":false},{"t":"24절에서 누가 나를 건져 내랴 하고 물은 질문에 대한 대답이, 정죄함이 없다는 선언으로 시작되고, 성령과 하나님의 사랑이 길게 펼쳐집니다.","s":2882.736,"e":2893.03,"p":true,"h":false},{"t":"이제 성경 로마서 7장을 읽으십시오.","s":2893.896,"e":2896.71,"p":true,"h":false}]},{"title":"로마서 8장","audio":"book_2610300218_1.mp3","start":2897.46,"end":3333.456,"dur":436,"segs":[{"t":"로마서 8장","s":2897.46,"e":2898.801,"p":true,"h":false},{"t":"전체 흐름","s":2899.656,"e":2900.79,"p":true,"h":false},{"t":"지난 7장은 누가 나를 건져 내랴 하는 탄식으로 끝났고, 곧바로 감사가 이어졌습니다.","s":2901.672,"e":2907.798,"p":false,"h":false},{"t":"8장은 그 건져 주심이 어떤 것인지를 펼쳐 보이는 장입니다.","s":2908.368,"e":2912.498,"p":false,"h":false},{"t":"로마서 전체에서 가장 높은 곳이고, 많은 사람이 가장 사랑하는 장입니다.","s":2913.048,"e":2918.517,"p":true,"h":false},{"t":"1절은 이렇게 시작합니다.","s":2919.42,"e":2921.473,"p":false,"h":false},{"t":"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니.","s":2922.12,"e":2926.755,"p":false,"h":false},{"t":"7장에서 죄와 싸우며 탄식하던 사람에게 가장 먼저 들려오는 말이, 정죄가 없다는 선언입니다.","s":2927.376,"e":2933.983,"p":false,"h":false},{"t":"3장에서 재판정에 서 있던 피고에게 이제 판결이 내려진 것입니다.","s":2934.648,"e":2939.242,"p":true,"h":false},{"t":"3절은 어떻게 이런 일이 가능했는지를 말합니다.","s":2940.12,"e":2943.476,"p":false,"h":false},{"t":"율법이 육신 때문에 연약하여 할 수 없던 일을 하나님이 하셨다고 합니다.","s":2944.008,"e":2948.561,"p":false,"h":false},{"t":"자기 아들을 죄 있는 육신의 모양으로 보내셔서, 그 육신에 죄를 정하셨다는 것입니다.","s":2949.228,"e":2954.849,"p":false,"h":false},{"t":"사람의 상식으로는 죄를 지은 쪽이 벌을 받아야 합니다. alse,"h":false},{"t":"이스마엘이 아니라 이삭을 통해 난 사람이 자손이라 불렸습니다.","s":3428.28,"e":3432.646,"p":false,"h":false},{"t":"쌍둥이 중에서도 에서가 아니라 야곱이었습니다.","s":3433.284,"e":3436.612,"p":false,"h":false},{"t":"그것도 아직 태어나기도 전에, 선이나 악을 행하기도 전에 정해진 일이라고 합니다.","s":3437.244,"e":3442.511,"p":false,"h":false},{"t":"이유는 하나님의 택하심의 뜻이, 행위가 아니라 부르시는 이로 말미암아 서게 하려는 것이었습니다.","s":3443.148,"e":3449.686,"p":true,"h":false},{"t":"여기서 사람의 상식은 즉시 항의합니다.","s":3450.564,"e":3453.434,"p":false,"h":false},{"t":"하나님이 이렇게 먼저 정하신다면 불공평하지 않습니까.","s":3453.732,"e":3457.428,"p":false,"h":false},{"t":"14절에서 바울이 바로 이 질문을 던집니다.","s":3458.088,"e":3461.306,"p":false,"h":false},{"t":"그렇다면 하나님께 불의가 있다고 하겠습니까.","s":3461.904,"e":3464.915,"p":false,"h":false},{"t":"바울은 그럴 수 없다고 하고, 모세에게 하신 말씀을 가져옵니다.","s":3465.504,"e":3470.13,"p":false,"h":false},{"t":"내가 긍휼히 여길 사람을 긍휼히 여기고, 불쌍히 여길 사람을 불쌍히 여기리라.","s":3470.796,"e":3476.499,"p":false,"h":false},{"t":"그러니 이것은 원하는 사람이나 달려가는 사람에게 달린 것이 아니라, 긍휼히 여기시는 하나님께 달려 있다고 합니다.","s":3477.132,"e":3484.691,"p":true,"h":false},{"t":"이것을 사람의 눈으로만 보면 이상합니다.","s":3485.556,"e":3488.457,"p":false,"h":false},{"t":"그러나 1장부터 8장까지 이어서 읽은 사람은 이 말이 어디서 나오는지 압니다.","s":3488.976,"e":3494.473,"p":false,"h":false},{"t":"모든 사람이 죄 아래 있었고, 하나님께 받을 자격이 있는 사람은 없었습니다.","s":3495.096,"e":3500.634,"p":false,"h":false},{"t":"그렇다면 하나님이 누구를 구원하시든 그것은 은혜입니다.","s":3500.928,"e":3504.947,"p":false,"h":false},{"t":"불공평하다는 질문은, 모든 사람이 마땅히 받아야 할 것을 받지 못한 억울한 사람이라는 전제에서 나옵니다.","s":3505.536,"e":3512.678,"p":false,"h":false},{"t":"그런데 이 전제가 틀렸습니다.","s":3513.348,"e":3515.645,"p":false,"h":false},{"t":"공평을 기준으로 하면 모두가 심판 아래 있습니다.","s":3515.976,"e":3519.411,"p":false,"h":false},{"t":"그러므로 구원받는 사람은 공평 때문이 아니라 긍휼 때문에 구원받습니다.","s":3519.936,"e":3524.992,"p":false,"h":false},{"t":"선택은 하나님이 사람을 차별하신다는 이야기가 아니라, 아무도 받을 자격이 없는 자리에서 하나님이 먼저 손을 내미셨다는 이야기입니다.","s":3525.588,"e":3534.393,"p":true,"h":false},{"t":"19절에서 가상의 반대자가 다시 나옵니다.","s":3535.272,"e":3538.364,"p":false,"h":false},{"t":"그렇다면 하나님이 어찌하여 여전히 허물하십니까.","s":3539.016,"e":3542.441,"p":false,"h":false},{"t":"누가 그 뜻을 거역하겠습니까.","s":3543.084,"e":3545.33,"p":false,"h":false},{"t":"바울은 이렇게 대답합니다.","s":3545.964,"e":3547.979,"p":false,"h":false},{"t":"사람아, 네가 누구이기에 감히 하나님께 반문하느냐.","s":3548.592,"e":3552.434,"p":false,"h":false},{"t":"토기장이가 같은 흙덩이로 하나는 귀하게 쓰고 하나는 천하게 쓸 권리가 있지 않느냐고 합니다.","s":3553.02,"e":3558.548,"p":false,"h":false},{"t":"그리고 22절부터 24절에서 이 이야기는 이렇게 맺어집니다.","s":3559.176,"e":3563.895,"p":false,"h":false},{"t":"하나님은 진노의 그릇을 오래 참으시고, 또 긍휼의 그릇에 영광의 풍성함을 알게 하려 하셨습니다.","s":3564.504,"e":3570.996,"p":false,"h":false},{"t":"그 긍휼의 그릇은 유대인 가운데서뿐 아니라, 이방인 가운데서도 부르신 우리입니다.","s":3571.668,"e":3577.911,"p":true,"h":false},{"t":"이어서 바울은 호세아와 이사야를 인용하며, 이것이 처음부터 구약이 말한 것이라고 합니다.","s":3578.796,"e":3585.05,"p":false,"h":false},{"t":"내 백성이 아닌 사람을 내 백성이라 부르리라.","s":3585.708,"e":3588.988,"p":false,"h":false},{"t":"이스라엘 자손의 수가 바다의 모래 같을지라도 남은 자만 구원을 받으리라.","s":3589.632,"e":3594.464,"p":false,"h":false},{"t":"이사야가 말한 남은 자의 이야기입니다.","s":3595.032,"e":3597.826,"p":true,"h":false},{"t":"마지막 30절부터 33절은 결론입니다.","s":3598.74,"e":3602.117,"p":false,"h":false},{"t":"의를 따르지 않던 이방인은 의를 얻었는데, 의의 법을 따르던 이스라엘은 거기에 이르지 못했습니다.","s":3602.736,"e":3609.267,"p":false,"h":false},{"t":"왜 그렇습니까.","s":3609.9,"e":3611.169,"p":false,"h":false},{"t":"믿음으로 하지 않고 행위로 하는 것처럼 했기 때문입니다.","s":3611.808,"e":3615.501,"p":false,"h":false},{"t":"그들이 걸림돌에 걸려 넘어졌다고 하는데, 그 돌은 이사야가 말한 시온에 둔 돌, 곧 그리스도입니다.","s":3616.092,"e":3623.233,"p":false,"h":false},{"t":"그러나 그를 믿는 사람은 부끄러움을 당하지 않습니다.","s":3623.832,"e":3627.572,"p":true,"h":false},{"t":"구절 풀이","s":3628.332,"e":3629.385,"p":true,"h":false},{"t":"9장 1절부터 3절의 저주받아도 좋겠다는 말은, 모세가 금송아지 사건 뒤에 백성을 위해 자기 이름을 지워 달라고 기도한 장면과 닮았다고 읽는 견해가 있습니다.","s":3630.24,"e":3641.062,"p":false,"h":false},{"t":"바울이 실제로 그렇게 될 수 있다는 말이 아니라, 동족을 향한 사랑의 깊이를 보여 주는 말입니다.","s":3641.724,"e":3647.852,"p":true,"h":false},{"t":"9장 13절의 야곱은 사랑하고 에서는 미워하였다는 말은 말라기 1장의 인용입니다.","s":3648.744,"e":3654.778,"p":false,"h":false},{"t":"여기서 미워했다는 말은 감정적인 증오가 아니라, 택하지 않았다, 덜 사랑했다는 뜻으로 읽는 견해가 일반적입니다.","s":3655.476,"e":3663.756,"p":false,"h":false},{"t":"또 에서와 야곱은 두 사람 개인뿐 아니라 그들에게서 나온 민족을 가리킨다고 읽기도 합니다.","s":3664.404,"e":3670.574,"p":true,"h":false},{"t":"9장 11절부터 18절의 선택은, 로마서에서 가장 논쟁이 되는 주제입니다.","s":3671.46,"e":3677.125,"p":false,"h":false},{"t":"개혁신학은 이것을 개인에 대한 하나님의 무조건적인 택하심으로 읽습니다.","s":3677.76,"e":3682.514,"p":false,"h":false},{"t":"한편 하나님이 믿음을 미리 보셨다고 읽는 견해도 있고, 개인이 아니라 민족이나 공동체의 택하심으로 읽는 견해도 있습니다.","s":3683.16,"e":3691.189,"p":false,"h":false},{"t":"어느 쪽이든 바울의 강조점은, 구원이 사람의 행위나 의지에 근거하지 않는다는 점에 있습니다.","s":3691.728,"e":3698.063,"p":false,"h":false},{"t":"이 해설에서는 이 논쟁을 한쪽으로 끝내지 않습니다.","s":3698.676,"e":3702.38,"p":true,"h":false},{"t":"9장 17절과 18절의 바로를 완악하게 하신다는 말은, 출애굽기에서 하나님이 바로의 마음을 굳게 하신 이야기입니다.","s":3703.248,"e":3710.87,"p":false,"h":false},{"t":"그런데 출애굽기에는 바로가 스스로 마음을 완악하게 했다는 말도 함께 나옵니다.","s":3711.528,"e":3716.631,"p":false,"h":false},{"t":"두 가지가 함께 말해진다는 점은 기억해 둘 만합니다.","s":3717.288,"e":3721.154,"p":true,"h":false},{"t":"9장 22절과 23절을 보면, 진노의 그릇은 멸망받기로 준비된 것이라고만 하고 준비한 이가 누구인지는 말하지 않습니다.","s":3722.04,"e":3730.483,"p":false,"h":false},{"t":"반면 긍휼의 그릇은 하나님이 영광을 위해 미리 준비하셨다고 분명히 말합니다.","s":3730.788,"e":3736.51,"p":false,"h":false},{"t":"이 차이를 눈여겨보는 해석이 있습니다.","s":3737.124,"e":3739.708,"p":true,"h":false},{"t":"9장 32절은 이 장 안에서 사람의 책임도 함께 말합니다.","s":3740.58,"e":3744.759,"p":false,"h":false},{"t":"이스라엘이 넘어진 이유를, 믿음으로 하지 않고 행위로 하는 것처럼 했기 때문이라고 합니다.","s":3745.404,"e":3751.498,"p":false,"h":false},{"t":"하나님의 주권과 사람의 책임이 한 장 안에서 나란히 나옵니다.","s":3752.136,"e":3756.171,"p":false,"h":false},{"t":"10장은 이 책임 쪽을 이어서 다룹니다.","s":3756.744,"e":3759.473,"p":true,"h":false},{"t":"이 장을 읽을 때","s":3760.344,"e":3761.747,"p":true,"h":false},{"t":"성경 로마서 9장을 읽으실 때 붙잡을 것은 두 가지입니다.","s":3762.612,"e":3766.831,"p":false,"h":false},{"t":"하나는 1절부터 3절에 나오는 바울의 마음입니다.","s":3767.472,"e":3771.05,"p":false,"h":false},{"t":"이 장을 하나님의 차가운 선택 이야기로만 읽지 마시고, 동족 때문에 가슴이 찢어지는 사람이 쓴 글이라는 것을 기억하며 읽으십시오.","s":3771.648,"e":3780.416,"p":false,"h":false},{"t":"다른 하나는 16절입니다.","s":3780.936,"e":3782.892,"p":false,"h":false},{"t":"구원이 원하는 사람이나 달려가는 사람에게 달린 것이 아니라 긍휼히 여기시는 하나님께 달려 있다는 말은, 두려운 말이기 전에 우리가 받은 것이 얼마나 값없는 것인지를 말해 주는 위로의 말입니다.","s":3783.456,"e":3795.696,"p":false,"h":false},{"t":"11절부터 24절이 어렵게 느껴지면, 모든 논쟁을 풀려고 하지 말고 이 한 가지만 붙잡고 읽으셔도 됩니다.","s":3796.344,"e":3804.316,"p":true,"h":false},{"t":"다음 10장에서 바울은 같은 이스라엘의 문제를 사람의 책임 쪽에서 다시 말합니다.","s":3805.236,"e":3810.716,"p":false,"h":false},{"t":"복음을 듣고도 순종하지 않은 것이 누구의 책임인지, 그리고 복음이 어떻게 전해지는지를 말하는 장입니다.","s":3811.356,"e":3818.353,"p":true,"h":false},{"t":"이제 성경 로마서 9장을 읽으십시오.","s":3819.24,"e":3821.98,"p":true,"h":false}]},{"title":"로마서 10장","audio":"book_2610300218_1.mp3","start":3822.768,"end":4219.2,"dur":396.4,"segs":[{"t":"로마서 10장","s":3822.768,"e":3824.123,"p":true,"h":false},{"t":"전체 흐름","s":3825,"e":3826.134,"p":true,"h":false},{"t":"지난 9장에서 바울은 이스라엘의 문제를 하나님의 택하심 쪽에서 말했습니다.","s":3827.016,"e":3832.121,"p":false,"h":false},{"t":"구원은 원하는 사람이나 달려가는 사람에게 달린 것이 아니라 긍휼히 여기시는 하나님께 달려 있다고 했습니다.","s":3832.776,"e":3839.533,"p":false,"h":false},{"t":"그러면서도 마지막에는 이스라엘이 넘어진 이유를, 믿음으로 하지 않고 행위로 하는 것처럼 했기 때문이라고 했습니다.","s":3840.156,"e":3847.754,"p":false,"h":false},{"t":"10장은 바로 이 사람의 책임 쪽을 이어서 말합니다.","s":3848.364,"e":3851.856,"p":true,"h":false},{"t":"1절에서 바울은 다시 자기 마음을 말합니다.","s":3852.72,"e":3855.887,"p":false,"h":false},{"t":"형제들아, 내 마음의 원하는 바와 그들을 위한 기도는 그들이 구원받는 것입니다.","s":3856.536,"e":3862.171,"p":false,"h":false},{"t":"그는 이스라엘에게 하나님께 대한 열심이 있다는 것을 증언합니다.","s":3862.8,"e":3867.109,"p":false,"h":false},{"t":"그런데 그 열심은 지식을 따른 것이 아니라고 합니다.","s":3867.732,"e":3871.423,"p":false,"h":false},{"t":"열심은 있었지만, 하나님의 의를 알지 못했다는 것입니다.","s":3872.052,"e":3876.259,"p":false,"h":false},{"t":"그래서 자기의 의를 세우려고 힘썼고, 하나님의 의에는 복종하지 않았습니다.","s":3876.912,"e":3882.305,"p":true,"h":false},{"t":"3장에서 보았던 대조가 여기서 다시 나옵니다.","s":3883.176,"e":3886.531,"p":false,"h":false},{"t":"사람이 쌓아 올리는 의와, 하나님이 주시는 의입니다.","s":3886.848,"e":3891.051,"p":false,"h":false},{"t":"이스라엘은 열심히 쌓았지만, 하나님이 이미 주신 것을 받아들이지 못했습니다.","s":3891.708,"e":3897.014,"p":false,"h":false},{"t":"4절은 그리스도가 율법의 마침이 되셨다고 합니다.","s":3897.684,"e":3901.152,"p":false,"h":false},{"t":"율법이 가리키던 목표가 그리스도이고, 그분을 믿는 모든 사람에게 의가 된다는 뜻입니다.","s":3901.788,"e":3908.229,"p":true,"h":false},{"t":"5절부터 13절은 두 가지 길을 나란히 놓습니다.","s":3909.132,"e":3912.915,"p":false,"h":false},{"t":"율법으로 말미암은 의는 그것을 행하는 사람이 그것으로 산다고 합니다.","s":3913.488,"e":3918.144,"p":false,"h":false},{"t":"그러나 믿음으로 말미암은 의는 이렇게 말합니다.","s":3918.78,"e":3922.183,"p":false,"h":false},{"t":"네 마음속에서, 누가 하늘에 올라가겠느냐, 누가 지옥에 내려가겠느냐 하지 말라.","s":3922.74,"e":3928.83,"p":false,"h":false},{"t":"하늘에서 그리스도를 모셔 내리는 것도, 죽은 자 가운데서 그리스도를 올리는 것도 우리가 할 일이 아니라는 것입니다.","s":3929.472,"e":3937.194,"p":false,"h":false},{"t":"이미 하신 일이기 때문입니다.","s":3937.86,"e":3939.91,"p":false,"h":false},{"t":"말씀이 네게 가까워 네 입에 있고 네 마음에 있다고 합니다.","s":3940.524,"e":3944.543,"p":true,"h":false},{"t":"그리고 9절이 이 장의 중심입니다.","s":3945.456,"e":3948.011,"p":false,"h":false},{"t":"네가 만일 네 입으로 예수를 주로 시인하며, 또 하나님이 그를 죽은 자 가운데서 살리신 것을 네 마음에 믿으면 구원을 받으리라.","s":3948.516,"e":3956.855,"p":false,"h":false},{"t":"구원의 길이 이렇게 가깝고 이렇게 단순합니다.","s":3957.408,"e":3960.916,"p":false,"h":false},{"t":"가야 할 먼 길도, 채워야 할 점수도 없습니다.","s":3961.548,"e":3965.07,"p":false,"h":false},{"t":"말씀이 이미 입에 있고 마음에 있습니다.","s":3965.688,"e":3968.641,"p":false,"h":false},{"t":"12절은 유대인이나 헬라인이나 차별이 없다고 하고, 13절은 누구든지 주의 이름을 부르는 사람은 구원을 받으리라고 합니다.","s":3969.252,"e":3977.454,"p":false,"h":false},{"t":"이 말씀은 1장에서 말한 믿는 모든 사람이라는 말이, 여기서 가장 쉬운 말로 다시 나온 것입니다.","s":3978.108,"e":3985.226,"p":true,"h":false},{"t":"그런데 14절부터 바울은 연달아 질문합니다.","s":3986.136,"e":3989.719,"p":false,"h":false},{"t":"믿지 않는 사람을 어떻게 부르겠습니까.","s":3990.312,"e":3992.911,"p":false,"h":false},{"t":"듣지 못한 사람을 어떻게 믿겠습니까.","s":3993.48,"e":3996.086,"p":false,"h":false},{"t":"전하는 사람이 없는데 어떻게 듣겠습니까.","s":3996.396,"e":3999.302,"p":false,"h":false},{"t":"보내심을 받지 않았는데 어떻게 전하겠습니까.","s":3999.852,"e":4002.901,"p":false,"h":false},{"t":"부름, 믿음, 들음, 전함, 보내심으로 이어지는 사슬입니다.","s":4003.524,"e":4009.878,"p":false,"h":false},{"t":"이 사슬은 거꾸로 따라가면 보내시는 분에게서 시작됩니다.","s":4010.472,"e" 을 알고 확신한다.","s":5495.472,"e":5499.292,"p":false,"h":false},{"t":"그러나 15절은 이렇게 말합니다.","s":5499.936,"e":5502.415,"p":false,"h":false},{"t":"음식 때문에 형제가 근심하게 된다면, 그것은 더 이상 사랑으로 행하는 것이 아닙니다.","s":5503.032,"e":5508.847,"p":false,"h":false},{"t":"그리스도가 위하여 죽으신 형제를 네 음식으로 망하게 하지 말라고 합니다.","s":5509.476,"e":5514.045,"p":true,"h":false},{"t":"17절은 이 단락의 중심 문장입니다.","s":5514.912,"e":5517.831,"p":false,"h":false},{"t":"하나님의 나라는 먹는 것과 마시는 것이 아니요, 오직 성령 안에 있는 의와 평강과 희락이라.","s":5518.44,"e":5524.75,"p":false,"h":false},{"t":"우리가 서로 다투는 많은 문제들이, 정작 하나님 나라의 본질은 아니라는 말입니다.","s":5525.388,"e":5531.107,"p":false,"h":false},{"t":"그래서 평화에 이르는 일과 서로의 덕을 세우는 일을 힘쓰라고 합니다.","s":5531.76,"e":5536.315,"p":false,"h":false},{"t":"마지막 22절과 23절은, 각자 가진 믿음을 하나님 앞에서 가지라고 하며, 의심하면서 먹는 사람은 믿음으로 하지 않았기 때문에 정죄를 받는다고 합니다.","s":5536.944,"e":5547.534,"p":false,"h":false},{"t":"믿음으로 하지 아니하는 모든 것은 죄입니다.","s":5548.104,"e":5551.097,"p":true,"h":false},{"t":"구절 풀이","s":5551.956,"e":5553.009,"p":true,"h":false},{"t":"14장 1절의 믿음이 연약한 사람은, 믿음이 없는 사람이 아닙니다.","s":5553.864,"e":5558.841,"p":false,"h":false},{"t":"그리스도 안에서 누리는 자유를 아직 다 이해하지 못해서 양심이 걸리는 사람을 가리킵니다.","s":5559.48,"e":5565.757,"p":false,"h":false},{"t":"이 연약함은 구원의 문제가 아니라 양심의 문제입니다.","s":5566.392,"e":5570.444,"p":true,"h":false},{"t":"14장 2절부터 6절의 문제가 구체적으로 무엇이었는지 본문은 자세히 말하지 않습니다.","s":5571.324,"e":5577.367,"p":false,"h":false},{"t":"유대인의 음식 규정, 우상에게 바쳤던 고기를 먹는 문제, 안식일과 절기를 지키는 문제 등으로 읽는 견해가 있습니다.","s":5577.984,"e":5586.354,"p":false,"h":false},{"t":"중요한 것은 구체적인 문제보다, 이런 문제를 대하는 태도입니다.","s":5586.984,"e":5591.902,"p":true,"h":false},{"t":"14장에서 바울의 입장은 자유로운 쪽, 곧 강한 쪽에 가깝습니다.","s":5592.816,"e":5597.785,"p":false,"h":false},{"t":"14절과 15장 1절에서 그렇게 말합니다.","s":5598.468,"e":5601.528,"p":false,"h":false},{"t":"그러나 바울은 강한 사람에게 더 큰 책임을 묻습니다.","s":5602.14,"e":5605.818,"p":false,"h":false},{"t":"자유가 있는 사람이 자유 때문에 형제를 무너뜨리면 안 된다는 것입니다.","s":5606.46,"e":5610.978,"p":true,"h":false},{"t":"이 단락은 구원과 복음의 본질이 걸린 문제에는 적용되지 않습니다.","s":5611.86,"e":5616.491,"p":false,"h":false},{"t":"복음 자체가 걸린 문제에서 바울은 갈라디아서에서처럼 한 걸음도 물러서지 않았습니다.","s":5617.116,"e":5622.873,"p":false,"h":false},{"t":"14장이 말하는 것은 신자들이 서로 다르게 판단할 수 있는 문제에 대한 태도입니다.","s":5623.524,"e":5628.831,"p":true,"h":false},{"t":"14장 23절의 믿음으로 하지 아니하는 것은, 양심의 확신 없이 행하는 것을 가리킨다고 읽는 것이 일반적입니다.","s":5629.716,"e":5637.413,"p":false,"h":false},{"t":"믿는 사람이 하는 모든 일이 죄라는 말이 아닙니다.","s":5638.068,"e":5641.449,"p":true,"h":false},{"t":"이 장을 읽을 때","s":5642.28,"e":5643.683,"p":true,"h":false},{"t":"성경 로마서 14장을 읽으실 때 붙잡을 것은 4절과 17절입니다.","s":5644.548,"e":5649.528,"p":false,"h":false},{"t":"남의 종을 비판하는 너는 누구냐는 질문 앞에서, 내가 평소에 누구를 비판하고 있는지 생각해 보십시오.","s":5650.164,"e":5657.347,"p":false,"h":false},{"t":"그리고 17절에서 하나님 나라가 무엇인지를 확인하십시오.","s":5657.868,"e":5661.83,"p":false,"h":false},{"t":"읽으시다가 내가 강한 쪽인지 약한 쪽인지 생각이 드시면, 바울이 양쪽 모두에게 말하고 있다는 점을 기억하십시오.","s":5662.368,"e":5669.966,"p":true,"h":false},{"t":"다음 15장에서 바울은 이 이야기를 마무리하고, 로마서 전체를 마무리하는 자리로 들어갑니다.","s":5670.756,"e":5677.235,"p":false,"h":false},{"t":"그리고 자기가 로마에 가고 싶어 하는 이유와 계획, 그리고 기도 부탁을 말합니다.","s":5677.884,"e":5683.461,"p":true,"h":false},{"t":"이제 성경 로마서 14장을 읽으십시오.","s":5684.328,"e":5687.261,"p":true,"h":false}]},{"title":"로마서 15장","audio":"book_2610300218_2.mp3","start":0,"end":339.192,"dur":339.2,"segs":[{"t":"로마서 15장","s":0,"e":1.429,"p":true,"h":false},{"t":"전체 흐름","s":2.268,"e":3.402,"p":true,"h":false},{"t":"지난 14장은 서로 다른 신자들이 서로를 업신여기거나 비판하지 말라는 이야기였습니다.","s":4.284,"e":10.176,"p":false,"h":false},{"t":"15장은 이 이야기를 끝맺으면서, 로마서 전체를 마무리하는 장입니다.","s":10.8,"e":16.032,"p":true,"h":false},{"t":"1절은 믿음이 강한 우리가 믿음이 약한 사람의 약점을 담당하고, 자기를 기쁘게 하지 말라고 합니다.","s":16.884,"e":23.515,"p":false,"h":false},{"t":"그 이유는 3절에 있습니다.","s":24.156,"e":26.312,"p":false,"h":false},{"t":"그리스도께서도 자기를 기쁘게 하지 않으셨습니다.","s":26.604,"e":29.881,"p":false,"h":false},{"t":"우리가 서로를 받아들이는 기준은, 내가 상대를 얼마나 인정하느냐가 아니라 그리스도가 나를 어떻게 받으셨느냐입니다.","s":30.492,"e":38.097,"p":true,"h":false},{"t":"4절은 읽다가 멈추게 합니다.","s":39.024,"e":41.23,"p":false,"h":false},{"t":"무엇이든지 전에 기록된 것은 우리의 교훈을 위하여 기록된 것입니다.","s":41.796,"e":46.691,"p":false,"h":false},{"t":"이는 성경의 인내로 말미암아 위로로 소망을 가지게 하려 함입니다.","s":47.232,"e":51.549,"p":false,"h":false},{"t":"구약 말씀이 오늘 우리를 가르치려고 기록되었다는 것입니다.","s":52.164,"e":56.085,"p":false,"h":false},{"t":"성경을 꼼꼼히 읽어야 하는 이유가 이 구절에 있습니다.","s":56.736,"e":60.341,"p":false,"h":false},{"t":"읽다가 모르는 부분이 있어도 그냥 지나치지 않고 붙들고 읽는 사람에게, 성경은 인내와 위로와 소망을 준다고 합니다.","s":60.912,"e":68.921,"p":true,"h":false},{"t":"7절은 14장의 결론입니다.","s":69.804,"e":72.064,"p":false,"h":false},{"t":"그러므로 그리스도께서 너희를 받아들이신 것같이 너희도 서로 받아서 하나님께 영광을 돌리라.","s":72.72,"e":79.029,"p":false,"h":false},{"t":"원수였을 때 우리를 받아 주신 그리스도를 기억한다면, 서로 받아들이기를 거부할 이유가 없습니다.","s":79.668,"e":86.371,"p":true,"h":false},{"t":"8절부터 12절은 로마서 전체의 주제를 모아 보여 줍니다.","s":87.228,"e":91.37,"p":false,"h":false},{"t":"그리스도는 하나님의 진실하심을 위해 할례받은 사람들의 종이 되셨고, 동시에 이방인들이 하나님의 긍휼하심을 인하여 영광을 돌리게 하려 하셨습니다.","s":91.98,"e":101.786,"p":false,"h":false},{"t":"바울은 이를 증명하려고 구약에서 연달아 인용합니다.","s":102.42,"e":106.163,"p":false,"h":false},{"t":"율법과 선지자와 시편에서, 이방인이 하나님을 찬송한다는 구절을 이어 붙입니다.","s":106.74,"e":112.346,"p":false,"h":false},{"t":"그리고 마지막 인용이 이사야 11장입니다.","s":112.968,"e":116.008,"p":false,"h":false},{"t":"이새의 뿌리가 나서 이방인을 다스리러 일어나실 것이니, 이방인들이 그에게 소망을 두리라.","s":116.64,"e":122.976,"p":false,"h":false},{"t":"이사야서를 읽으신 분이라면 반가운 구절입니다.","s":123.516,"e":126.894,"p":false,"h":false},{"t":"13절은 이 모든 말씀을 기도로 맺습니다.","s":127.548,"e":130.63,"p":false,"h":false},{"t":"소망의 하나님이 모든 기쁨과 평강을 너희에게 충만하게 하사, 성령의 능력으로 소망이 넘치게 하시기를 원한다.","s":131.184,"e":138.65,"p":true,"h":false},{"t":"14절부터는 편지를 마무리하는 개인적인 이야기입니다.","s":139.536,"e":143.465,"p":false,"h":false},{"t":"바울은 로마 교인들이 선함이 가득하고 서로 권면할 수 있는 사람들이라고 인정합니다.","s":144.072,"e":149.457,"p":false,"h":false},{"t":"그런데도 담대하게 썼다고 합니다.","s":150.084,"e":152.462,"p":false,"h":false},{"t":"자기가 이방인을 위한 그리스도의 일꾼으로서, 하나님의 복음을 전하는 제사장 같은 직분을 맡았기 때문입니다.","s":153.072,"e":160.169,"p":false,"h":false},{"t":"그의 목표는 복음이 아직 전해지지 않은 곳에 복음을 전하는 것이었습니다.","s":160.74,"e":165.646,"p":false,"h":false},{"t":"그래서 이사야 52장의 말씀을 인용합니다.","s":166.284,"e":169.578,"p":false,"h":false},{"t":"그에 대한 소식을 받지 못한 사람들이 볼 것이며, 듣지 못한 사람들이 깨달으리라.","s":170.208,"e":175.699,"p":true,"h":false},{"t":"22절부터 33절은 바울의 계획입니다.","s":176.544,"e":179.9,"p":false,"h":false},{"t":"그는 로마에 가 보기를 오래 원했고, 스페인으로 가는 길에 로마를 들르려고 합니다.","s":180.504,"e":186.324,"p":false,"h":false},{"t":"그런데 먼저 해야 할 일이 있습니다.","s":186.984,"e":189.382,"p":false,"h":false},{"t":"마게도냐와 아가야 교회들이 모은 구제 헌금을 가지고 예루살렘으로 가는 일입니다.","s":189.972,"e":195.203,"p":false,"h":false},{"t":"그리고 그는 로마 교인들에게 간곡히 부탁합니다.","s":195.84,"e":199.38,"p":false,"h":false},{"t":"나와 함께 힘을 다하여 나를 위하여 하나님께 기도하라.","s":199.98,"e":203.695,"p":false,"h":false},{"t":"유대의 순종하지 않는 사람들에게서 건짐을 받고, 예루살렘에 대한 내 섬김이 성도들에게 받아들여지도록 기도해 달라는 것입니다.","s":204.336,"e":212.514,"p":true,"h":false},{"t":"이 기도가 어떻게 응답되었는지는 사도행전에서 보았습니다.","s":213.408,"e":217.602,"p":false,"h":false},{"t":"바울은 예루살렘에서 체포되었고, 재판을 받고, 가이사랴에서 갇혀 지내다가, 죄수의 몸으로 로마에 도착했습니다.","s":218.268,"e":226.887,"p":false,"h":false},{"t":"바울이 기도한 모양과 하나님이 응답하신 모양은 달랐습니다.","s":227.484,"e":231.412,"p":false,"h":false},{"t":"그러나 바울은 로마에 도착했고, 거기서 거침없이 복음을 전했습니다.","s":232.056,"e":237.2,"p":true,"h":false},{"t":"구절 풀이","s":238.104,"e":239.157,"p":true,"h":false},{"t":"15장 4절은 성경을 읽는 이유를 말하는 구절입니다.","s":240.012,"e":243.571,"p":false,"h":false},{"t":"여기서 전에 기록된 것은 구약을 가리키지만, 신약도 같은 원리로 읽는 것이 일반적입니다.","s":244.224,"e":250.416,"p":false,"h":false},{"t":"성경은 정보를 주려고 기록된 것이 아니라, 읽는 사람이 인내하고 위로를 받아 소망을 가지게 하려고 기록되었습니다.","s":251.064,"e":258.593,"p":true,"h":false},{"t":"15장 8절의 할례받은 사람들의 종이 되셨다는 말은, 그리스도가 먼저 이스라엘에게 약속을 이루러 오셨다는 뜻입니다.","s":259.452,"e":267.522,"p":false,"h":false},{"t":"이 점이 이방인에게도 은혜가 열린 일을 더욱 놀랍게 만듭니다.","s":268.164,"e":272.366,"p":true,"h":false},{"t":"15장 16절의 제사장 직분은, 복음을 전하는 일을 제사장의 예배에 비유한 말입니다.","s":273.24,"e":279.205,"p":false,"h":false},{"t":"이방인이 하나님께 받아들여지는 제물이 되게 하는 것이 바울이 맡은 일이라는 뜻입니다.","s":279.864,"e":285.685,"p":true,"h":false},{"t":"15장 19절의 일루리곤은 지금의 발칸반도 서쪽 지역을 가리키는 것으로 알려져 있습니다.","s":286.596,"e":292.656,"p":false,"h":false},{"t":"15장 24절의 스     const t = audio.currentTime || 0;
    const k = trackAt(t); if (k !== ti) { switchTo(k); }
    const d = TRACKS[ti].dur || 0, rel = Math.max(0, t - TRACKS[ti].start);
    $('cur').textContent = fmt(rel); $('tot').textContent = fmt(d);
    if (d > 0) { $('fill').style.width = Math.min(100, rel / d * 100) + '%'; }
    mark(idxAt(t), playing);
  }
  /* 이어듣기가 꺼져 있을 때: 같은 파일 안에서 다음 글로 넘어가는 순간 멈춥니다 */
  function boundary() {
    if (!playing || auto || ti >= N - 1) { return false; }
    const nx = TRACKS[ti + 1]; if (nx.audio !== curSrc) { return false; }
    if ((audio.currentTime || 0) >= nx.start - 0.05) {
      audio.pause(); setPlaying(false);
      try { audio.currentTime = nx.start; } catch (e) {}
      clearMark(); ti = ti + 1; updateNow(); mediaMeta(); setHash(); pref('pos', ti + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); play(); };
      paint();
      return true;
    }
    return false;
  }
  function loop() { if (boundary()) { return; } paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
    try { if ('mediaSession' in navigator) { navigator.mediaSession.playbackState = p ? 'playing' : 'paused'; } } catch (e) {}
  }
  function savePos() { pref('pos', ti + ':' + localT()); }
  function play() { const pr = audio.play(); setPlaying(true); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { audio.pause(); setPlaying(false); savePos(); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seekAbs(t) {
    const d = audio.duration; const hi = (d && isFinite(d)) ? d : TRACKS[ti].end;
    try { audio.currentTime = Math.max(0, Math.min(t, hi)); } catch (e) {}
    paint();
  }

  /* 글 바꾸기: 소리 파일이 같으면 위치만 옮기고, 다르면 다음 파일을 불러옵니다 (같은 재생기를 계속 써서 폰에서도 이어집니다) */
  function loadTrack(k, st, autoPlay) {
    if (k < 0 || k >= N) { return; }
    lastUser = 0; clearMark(); ti = k; updateNow(); mediaMeta(); setHash(); warmNext();
    const tr = TRACKS[k], target = tr.start + (st || 0);
    if (curSrc !== tr.audio) { curSrc = tr.audio; audio.src = tr.audio; applySpd(); }
    try { audio.currentTime = target; } catch (e) {}
    if (autoPlay) { play(); } else { paint(); }
  }
  function jump(k, i) {
    const S = TRACKS[k] && TRACKS[k].segs; if (!S || i < 0 || i >= S.length) { return; }
    lastUser = 0;
    if (k !== ti || TRACKS[k].audio !== curSrc) { loadTrack(k, S[i].s - TRACKS[k].start, true); mark(i, true); return; }
    seekAbs(S[i].s); mark(i, true); if (!playing) { play(); }
  }

  audio.addEventListener('timeupdate', () => {
    if (boundary()) { return; }
    if (!playing) { paint(); }
    if (Date.now() - lastSave > 4000) { lastSave = Date.now(); savePos(); }
  });
  audio.addEventListener('loadedmetadata', () => {
    const want = TRACKS[ti].start + 0; /* 파일을 바꾼 직후 위치가 어긋났다면 바로잡습니다 */
    if (curSrc === TRACKS[ti].audio && (audio.currentTime || 0) < TRACKS[ti].start - 1 && audio.currentTime < 0.5 && TRACKS[ti].start > 1 && !playing) { try { audio.currentTime = want; } catch (e) {} }
    paint();
  });
  audio.addEventListener('ended', () => {
    if (ti < N - 1) {
      if (auto) { loadTrack(ti + 1, 0, true); return; }
      setPlaying(false); clearMark(); pref('pos', (ti + 1) + ':0');
      const n = $('note'); n.style.display = 'block';
      n.innerHTML = '이어듣기가 <b>꺼져 있어서</b> 멈췄습니다. <button type="button" id="nb">이어듣기 켜고 다음 글 듣기</button>';
      $('nb').onclick = () => { auto = true; applyAuto(); hideNote(); loadTrack(ti + 1, 0, true); };
    } else { setPlaying(false); pref('pos', '0:0'); clearMark(); }
  });
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일(' + curSrc + ')을 불러오지 못했습니다. mp3 파일들이 이 페이지와 같은 폴더에 있는지 확인해 주세요.'; });

  /* 단추 */
  $('auto').onclick = () => { auto = !auto; applyAuto(); hideNote(); };
  $('play').onclick = toggle;
  $('back').onclick = () => seekAbs((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seekAbs((audio.currentTime || 0) + 10);
  $('prev').onclick = () => {
    const t = audio.currentTime || 0, i = idxAt(t), cur = segs()[i];
    if (cur && t - cur.s > 2) { jump(ti, i); }
    else if (i > 0) { jump(ti, i - 1); }
    else if (ti > 0) { loadTrack(ti - 1, 0, true); }
    else { seekAbs(0); }
  };
  $('next').onclick = () => {
    const i = idxAt(audio.currentTime || 0) + 1;
    if (i < segs().length) { jump(ti, i); } else if (ti < N - 1) { loadTrack(ti + 1, 0, true); }
  };
  $('pt').onclick = () => { if (localT() > 5 || ti === 0) { loadTrack(ti, 0, true); } else { loadTrack(ti - 1, 0, true); } };
  $('nt').onclick = () => { if (ti < N - 1) { loadTrack(ti + 1, 0, true); } };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); const d = TRACKS[ti].dur || 0; seekAbs(TRACKS[ti].start + ((e.clientX - r.left) / r.width) * d); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-k'), +s.getAttribute('data-i')); } });
  $('toc').addEventListener('click', e => {
    const a = e.target.closest ? e.target.closest('a') : null; if (!a) { return; }
    e.preventDefault(); $('lst').open = false; lastUser = 0;
    const k = +a.getAttribute('data-k');
    loadTrack(k, 0, true);
    const sec = $('t' + k); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} }
  });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seekAbs((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seekAbs((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  /* 잠금 화면·이어폰 단추 */
  try {
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
      set('play', play); set('pause', pause);
      set('nexttrack', () => $('nt').onclick()); set('previoustrack', () => $('pt').onclick());
      set('seekbackward', () => seekAbs((audio.currentTime || 0) - 10)); set('seekforward', () => seekAbs((audio.currentTime || 0) + 10));
    }
  } catch (e) {}

  /* 시작: 주소 끝의 #번호가 있으면 그 글을, 없으면 첫 글을 준비하고, 지난번 위치가 있으면 이어 듣기 안내 */
  const hm = /^#(\d+)$/.exec(location.hash || '');
  let k0 = 0; if (hm) { const q = parseInt(hm[1], 10) - 1; if (q >= 0 && q < N) { k0 = q; } }
  loadTrack(k0, 0, false);
  inited = true;
  if (hm) { const sec = $('t' + k0); if (sec) { setTimeout(() => { try { sec.scrollIntoView({ block: 'start' }); } catch (x) {} }, 60); } }
  else {
    const sp = (pref('pos') || '').split(':'), rk = parseInt(sp[0], 10), rt = parseFloat(sp[1]);
    if (rk >= 0 && rk < N && rt > 10 && rt < (TRACKS[rk].dur || 1e9) - 5) {
      const r = $('resume'); r.style.display = 'block';
      r.innerHTML = '지난번 <b>' + esc(TRACKS[rk].title) + '</b> ' + fmt(rt) + '까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
      $('rb').onclick = () => { r.style.display = 'none'; loadTrack(rk, rt, true); const sec = $('t' + rk); if (sec) { try { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (x) {} } };
    }
  }
  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, loadTrack, toggle, audio, TRACKS, seekAbs, state: () => ({ ti, auto, playing, curSrc }) };
})();
</script>
</body>
</html>
